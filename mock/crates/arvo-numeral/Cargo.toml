[package]
name = "arvo-numeral"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A value of a declared signature, held alone in the carrier its placement derives"
readme = "README.md.tmpl"

[dependencies]
arvo-format.workspace = true
arvo-placement.workspace = true
notko.workspace = true

# One mutant per rung. Each removes that rung's adaptation onto the declared
# width, and the equality tests fail while it is on. Off by default
# and never enabled by anything that ships.
#
# One mutant per operation beside them, each breaking that operation where it
# goes wrong first: the unsigned saturating difference below zero, the signed
# saturating negation of the lowest member, the saturating product that leaves
# the machine integer on the negative side. `mutant-under` sends the top of the
# range to the bottom in a crossing to a sibling signature. `mutant-div` returns
# the dividend where the quotient leaves the range, `mutant-convert` reads the
# source's slot index as the target's, and `mutant-index` sends a negative host
# integer to the top of an unsigned saturating range. `mutant-accumulator` makes
# `take` sum the whole slice whatever the capacity.
[features]
mutant-8 = []
mutant-16 = []
mutant-32 = []
mutant-64 = []
mutant-sub = []
mutant-neg = []
mutant-mul = []
mutant-under = []
mutant-div = []
mutant-convert = []
mutant-index = []
mutant-accumulator = []

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[dev-dependencies]
trybuild = "1"
