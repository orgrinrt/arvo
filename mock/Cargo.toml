[workspace]
resolver = "2"
members = [
    # L0a — foundation traits (no storage, no algorithms)
    "crates/arvo-transparent",
    "crates/arvo-strategy",

    # L0 — minimal bare-primitive layer
    "crates/arvo-storage",

    # L0.5 — trait contracts (declarations only)
    "crates/arvo-bits-contracts",
    "crates/arvo-mask-contracts",
    "crates/arvo-numeric-contracts",

    # L1 — implementation crates (concrete storage + impls)
    "crates/arvo-bits",
    "crates/arvo-bitmask",
    "crates/arvo-refit",
    "crates/arvo-tensor",

    # L2 — algorithm + hash crates
    "crates/arvo-hash",
    "crates/arvo-sparse",
    "crates/arvo-graph",
    "crates/arvo-comb",

    # L3 — spectral
    "crates/arvo-spectral",

    # facade — re-exports + default impls + ergonomic aliases
    "crates/arvo",

    # bench infrastructure (operational tooling, not a published artefact)
    "benches",
    "benches/variants/fnv1a",
    "benches/variants/xxhash3",
    "benches/variants/structural-decomposition",
    "benches/variants/spectral-bisection",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
notko = { git = "ssh://git@github.com/orgrinrt/notko.git", branch = "dev", default-features = false, features = ["const", "try_trait_v2"] }
arvo-transparent = { path = "crates/arvo-transparent" }
arvo-strategy = { path = "crates/arvo-strategy" }
arvo-storage = { path = "crates/arvo-storage" }
arvo-bits-contracts = { path = "crates/arvo-bits-contracts" }
arvo-mask-contracts = { path = "crates/arvo-mask-contracts" }
arvo-numeric-contracts = { path = "crates/arvo-numeric-contracts" }
arvo-bits = { path = "crates/arvo-bits" }
arvo-bitmask = { path = "crates/arvo-bitmask" }
arvo-refit = { path = "crates/arvo-refit" }
arvo-tensor = { path = "crates/arvo-tensor" }
arvo-hash = { path = "crates/arvo-hash" }
arvo-graph = { path = "crates/arvo-graph" }
arvo-sparse = { path = "crates/arvo-sparse" }
arvo-spectral = { path = "crates/arvo-spectral" }
arvo-comb = { path = "crates/arvo-comb" }
arvo = { path = "crates/arvo" }

# Incremental compilation is off here, deliberately.
#
# arvo's cost is in monomorphised output, not in source it could reuse: the
# per-width, per-strategy, per-sign impl macros turn a small file into an
# enormous object, and `libarvo_strategy.rlib` alone is 19 MB. Incremental
# caches a dep graph proportional to that output on every rustc invocation and
# cargo garbage-collects the sessions lazily, so an afternoon of iteration put
# 8.9 GB in `target/debug/incremental` across a thousand session directories.
#
# It buys correspondingly little: the expensive part is re-monomorphising, which
# incremental does not avoid. Turning it off makes a cold build marginally
# slower and stops the directory growing without bound.
[profile.dev]
incremental = false
