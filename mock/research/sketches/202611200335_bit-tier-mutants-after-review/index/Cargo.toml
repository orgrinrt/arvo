# The index refusal cases of `arvo-bits`' `compile_fail.rs`, built as examples
# of this crate rather than through trybuild, which drops `RUSTFLAGS` from its
# own build and so cannot see a mutant set by a `cfg`.
[workspace]

[package]
name = "bit-tier-index-mutant-after-review"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
arvo-bits = { path = "../../../../crates/arvo-bits" }
arvo-format = { path = "../../../../crates/arvo-format" }

[[example]]
name = "a_bit_at_the_width_is_refused"
path = "../../../../crates/arvo-bits/tests/ui/a_bit_at_the_width_is_refused.rs"

