# Its own `[workspace]` table so cargo does not walk up into the mock workspace,
# which excludes only `benches` and would otherwise refuse this tree with
# "current package believes it's in a workspace when it's not".
#
# A standalone tree inherits nothing, so everything the parent would have
# supplied is spelled out and the dependency is a relative path. Relative, not
# absolute: `sketches/width-bound/Cargo.toml` names an absolute path into a
# worktree that no longer exists, so that sketch builds nowhere and its evidence
# cannot be re-run by anybody.
[workspace]

[package]
name = "the-adaptation-contract-under-translation"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Measuring the adaptation's behaviour under translation and under negation, against the shipped map"

[dependencies]
arvo-format = { path = "../../../crates/arvo-format" }

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
