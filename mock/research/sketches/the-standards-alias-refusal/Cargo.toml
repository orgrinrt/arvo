# Its own `[workspace]` table so it is a standalone tree and cargo does not walk
# up into the mock workspace, which is what every sibling sketch here does. It
# carried none, so cargo found the parent, refused with "current package believes
# it's in a workspace when it's not", and the sketch could be read but not built.
#
# A standalone tree inherits nothing, so the values the parent used to supply are
# spelled out and the dependency is a path.
[workspace]

[package]
name = "arvo-standards"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "The industrial fixed-point conventions, as aliases over arvo's own primitives"

[dependencies]
arvo-format = { path = "../../../crates/arvo-format" }

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
