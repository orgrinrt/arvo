# Free-standing: an empty `[workspace]` table stops cargo walking up into
# `mock/Cargo.toml`, so this probe needs no edit to the member or exclude lists
# and touches nothing in the source tier.
[workspace]

[package]
name = "q31-carrier-dependence"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
arvo-format = { path = "../../../crates/arvo-format" }
notko = { git = "ssh://git@github.com/orgrinrt/notko.git", branch = "dev", default-features = false, features = ["const", "try_trait_v2"] }

[[bin]]
name = "battery"
path = "src/battery.rs"
