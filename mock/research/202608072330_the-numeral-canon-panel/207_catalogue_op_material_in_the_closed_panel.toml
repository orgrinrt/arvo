# Op's material in the closed formalization panel, one row per statement, with
# what became of it and how that was established.
#
# This is not the canon and not a registry namespace. `canon_paths` names
# `mock/registry/*.toml` and nothing here is loaded by the schema check. It is an
# audit surface, built so nobody sweeps this archive a fourth time.
#
# ## What a row is
#
# One statement of op's, keyed on what he said rather than on what any document
# carried, because a ledger keyed on what was carried cannot find an item no
# ledger ever held. That is the same key `OLD_112_the_op_material_sweep.md`
# section 6.2 specified and it is the reason this file exists at all.
#
# ## The four verdicts, and they are not interchangeable
#
# `superseded`  something later replaced it, and the row names what.
# `carried`     it is in the registry now, and the row names the row.
# `lost`        it is in no registry row and nothing replaced it.
# `exploration` op was thinking aloud, so there is nothing to carry.
#
# `why_dropped` is separate from the verdict on purpose. **"No reason found" is a
# different finding from "superseded" and is never written as one.** Where a
# document records the decision not to carry something, the row cites it; where
# nothing does, the row says so in those words.
#
# ## Confidence
#
# How directly the verdict was checked, never how strongly it is believed.
#
# 0.9 and up  the source file and the deciding document both opened at source
# 0.7 to 0.9  source opened, disposition established by a controlled search
# below 0.7   established by search alone, or the reading is contestable
#
# ## The instruments, committed beside this file
#
# `207_probes/roster.sh`, which establishes the population.
# `207_probes/archive_citation_gap.sh`, which carries a mutation control.
# `207_probes/registry_coverage.sh`, whose CARRIED rows are the control on its
# own vocabulary: the closed panel's sweep recorded six occasions where a first
# vocabulary returned nothing and a second found the idea, so a zero from an
# uncontrolled grep decides nothing.

# --- the frame, which decides most of the rows below ---------------------------
#
# Three of op's own statements govern how everything in the closed panel is read,
# and all three are already registry rows. They are restated here because a
# reader who does not hold them will misread every verdict in this file.
#
# `ruling::prior_calls_are_a_historical_log_not_calls` demotes his prior design
# calls: collected for reference, not calls, not ratified intents, not canon,
# because they belong to a lineage that failed. Its own note says porting one
# would restore the authority he removed. **So absence is the correct state for
# that material, and a row below saying `superseded` on this ground is recording
# the mechanism working rather than a defect.**
#
# `ruling::the_d_numbered_decisions_are_dead` does the same for every numbered
# decision, D1 to D75, and it is why five items below are closed in one line.
#
# `ruling::his_voice_is_demoted_except_where_he_frames_it_absolute` is the carve-
# out, and it is the one nobody applied. In his words the demotion covers "this
# panels transcripts and checkpoints **or other files**" **except** where "I
# explicitly frame something I say as absolute", of which he recalls two, "both
# of those were very abstract intents only, not specific calls of concrete
# things". The closed panel is an "other file" and a handful of its statements
# are framed as absolute in exactly that sense. **Which statements those are, and
# whether the carve-out licenses porting them, is not settled here and is not
# mine to settle.** It is filed as `question::whether_the_absolute_framing_carve_
# out_reaches_the_closed_panel`.

