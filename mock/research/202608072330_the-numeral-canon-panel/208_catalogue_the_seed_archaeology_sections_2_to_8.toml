# The seed archaeology's sections 2 through 8, one row per talking point, with
# what became of it and how that was established.
#
# This is not the canon and not a registry namespace. `canon_paths` names
# `mock/registry/*.toml` and nothing here is loaded by the schema check. It is an
# audit surface, built so nobody sweeps `SEED_TALKING_POINTS.md` a second time.
#
# Section 1 is seat 207's and is catalogued at
# `207_catalogue_op_material_in_the_closed_panel.toml`. Section 0 is the frame
# and is read rather than catalogued. Sections 2 through 8 are here: 57 numbered
# talking points, T1 through T57, plus the two unnumbered items in section 2.
#
# ## What a row is
#
# One talking point, keyed on the seed's own T-number, because that is the key
# every later reader will arrive holding. The `claim` is what the seed states,
# not what the archive stated: where the two differ that difference is the
# finding and it is in `why_dropped`.
#
# ## The verdicts, and they are not interchangeable
#
# `reproduced`   re-run here, under the pin, with a control. Current evidence.
# `covered`      the registry holds the subject, reached by its own route rather
#                than from this file, and the row names where.
# `retired`      a registry row closes it, and the row names which.
# `live_hazard`  unresolved, and something in the registry today depends on it.
# `unported`     in no registry row, with nothing standing in its place.
# `miscarried`   the seed states it wrongly; the archive underneath is right.
#
# **`unported` is not a recommendation to port.** Most of these are unported for
# a reason that is good, and the reason is in `why_dropped`. Several are unported
# for no reason anybody recorded, and those say exactly that, in those words.
#
# ## Confidence
#
# How directly the verdict was checked, never how strongly it is believed.
#
# 0.9 and up  the archive passage and the registry state both opened at source
# 0.7 to 0.9  one of the two opened, or established by a controlled instrument
# below 0.7   established by controlled search alone; the archive passage was
#             not opened and the seed's rendering of it is taken on its word
#
# **Most rows sit below 0.7 and that is the honest number.** The seed is 945
# lines summarising a 320-file archive, and this seat opened six of its cited
# passages rather than 127. What was checked mechanically is different and is
# stated per row: every citation's existence and range, the two re-runs, the
# bench corpus, and the registry sweep.
#
# ## The instruments, committed beside this file
#
# `208_probes/p1_citations_resolve.sh`   every archive citation in sections 2-8,
#     resolved against the tree. 127 of them: 29 named files, 5 probe paths, 93
#     bare file numbers. All resolve, all in range. Three controls, all fired.
# `208_probes/p2_rerun_the_two_current_claims.sh`  the two the seed calls current
#     evidence, re-run on the pin with the archive's own negative controls as
#     arms. Both compile, both controls refuse.
# `208_probes/p3_bench_artifacts.sh`  the committed bench corpus, counted, dated
#     and split by era, with a nonsense-family control.
# `208_probes/p4_registry_coverage.sh`  the registry swept for each subject on
#     two or three independent phrasings, with four carried controls.
# `208_probes/p5_archive_refs_resolve.sh`  whether the engine resolves a citation
#     into the closed panel or skips it. Mutation control both directions.

# --- the frame, which decides how every row below is read -----------------------
#
# **The seed has no authority and says so.** Its section 0: "Nothing in the source
# archive is evidence, and nothing below may bolster any claim." Every entry is a
# claim that panel made, recorded so it can be put back on the table and tested
# again. A row below marked `unported` is therefore not automatically a loss.
#
# **It names three exceptions that ARE current evidence**, and this seat checked
# all three rather than taking them. Two re-run probes: verified, reproduced a
# third time, and now `probe` rows. The committed bench artifacts: verified to
# exist, and the seed's own count of them is wrong, which is the `miscarried` row
# below. Op's own text: outside this dispatch and inside seat 207's.
#
# **The registry can already carry this material and does not have to become
# anything.** That was the open half of the dispatch and it is settled:
# `retirement.toml` cites the closed panel 94 times, the engine resolves those
# citations rather than skipping them, and a planted citation naming a file that
# is not there is reported as `unresolvable-provenance`. Measured both directions
# in `208_probes/p5_archive_refs_resolve.out`. What limits the port is not the
# schema. It is that a `proposal` needs a region over a declared axis and a
# `probe` needs a control, and almost nothing in section 3 has either.
#
# **The one thing the registry's channel is used for is closing routes.** All 94
# of those citations are the same single anchor, `OLD_124_consolidation_twelve`
# section 6, the cumulative droplist. Until the two `probe` rows this seat added,
# nothing had ever cited the archive to carry a result forward.

