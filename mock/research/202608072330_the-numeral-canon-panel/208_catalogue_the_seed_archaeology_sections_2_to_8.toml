# =============================================================================
# What this catalogue does NOT establish
#
# Stated here rather than left to be inferred, because the seed's own section 8
# is the reason this file could be built at all and the same honesty is owed.
#
# **Six of 127 cited passages were opened.** T15's refutation, T24's discrepancy,
# T9b's count at both ends, and the two re-run sources. Every other row's claim
# is the seed's rendering of a passage this seat did not read, and where that
# matters the row says so in `evidence`.
#
# **What was checked mechanically is different and is stronger.** Every citation
# resolves and is in range, 127 of them with three controls. The two current
# claims reproduce with the archive's own negative controls firing. The bench
# corpus is counted and dated with a control. The registry sweep ran two or three
# independent phrasings per subject with four carried controls and one nonsense
# control. The archive citation channel is shown to resolve rather than skip,
# with a mutation control both directions.
#
# **A `covered` verdict is the weakest one here.** It means the registry reached
# the subject, established by a word-level sweep and, on eight rows, by opening
# the registry row. It does not mean the registry holds the same claim, and
# several `covered` rows say plainly which half may still be unported.
#
# **An `unported` verdict may mean the material never reached the seed either.**
# T55 is the coverage bound: the seed swept consolidations rather than the
# ninety-nine member files, and its own section 8 says a point sourced only from
# a consolidation inherits that document's compressions. Two seats have now named
# the member-file sweep as the instrument nobody has built.
#
# **Nothing here is a recommendation to port.** Four rows earned a registry row
# and they are named in the frame at the top. The rest are catalogued so that the
# next reader starts from a verdict with its evidence rather than from 945 lines.
