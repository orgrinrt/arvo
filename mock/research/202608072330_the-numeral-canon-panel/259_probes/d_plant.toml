
# ---------------------------------------------------------------------------
# PLANTED BY 259_probes/d_can_a_structural_claim_state_its_region.sh
#
# Six candidate spellings of one structural claim, appended to the real
# registry so the shipped checkers judge them. The script removes every line of
# this file again after the run. Nothing here is a proposal and nothing here is
# to be committed into `mock/registry/`.
#
# The claim used throughout is the layering derivation already in the registry
# as `the_topics_form_a_stack_a_frame_and_the_canons_own_machinery`, filed
# `normative` after being written `argument` because, in that row's own words,
# "no predicate, because none in this registry can express it".
# ---------------------------------------------------------------------------

# D1. The state that forced the refiling: reasoned, and no region.
# EXPECT: a-region-agrees-with-the-sentence-kind / an-established-claim-carries-no-region
[[proposal]]
id = "zz_probe_argument_with_no_region"
kind = "finding"
sentence_kind = "argument"
standing = "one_expert"
topic = "canon_form"
says = "The twenty topics are not one order; eleven form a stack, four a frame, four the canon's own machinery."
because = "Derived from the `what` sentence of each topic row by one test: can this topic's subject be stated at all without a decision belonging to that one."
note = "Planted by a probe. The reasoning is real and the region is absent, which is the state the layering row was in before it was refiled."
provenance = ["panel::202608072330_the-numeral-canon-panel::223_checkpoint_the_topic_layering::#the-stack-bottom-first"]
keywords = ["probe", "layering", "region", "argument"]

# D2. The region written in the vocabulary the claim's subject actually has.
# EXPECT: every-predicate-names-a-declared-axis / axis-not-declared
[[proposal]]
id = "zz_probe_argument_with_a_structural_axis"
kind = "finding"
sentence_kind = "argument"
standing = "one_expert"
topic = "canon_form"
says = "The twenty topics are not one order; eleven form a stack, four a frame, four the canon's own machinery."
because = "Derived from the `what` sentence of each topic row by one test: can this topic's subject be stated at all without a decision belonging to that one."
predicate = [
  "registry_state: the twenty topic rows as they stand at this commit",
  "namespace: namespace = topic",
]
note = "Planted by a probe. The coordinates are the ones the claim genuinely varies over."
provenance = ["panel::202608072330_the-numeral-canon-panel::223_checkpoint_the_topic_layering::#the-stack-bottom-first"]
keywords = ["probe", "layering", "region", "structural axis"]

