# Catalogue of panel files 00 through 49 (this seat's slice), private-investigator
# pass rather than a porting pass. One row per item examined; a file with more
# than one separately-evidenced claim gets more than one row.
#
# Not canon. Not read by any tool. This is the audit trail for the porting
# decision on each item: what it claims, what happened to it, how sure I am,
# and what would raise or lower that confidence. Kept beside the panel rather
# than under mock/registry/ on purpose: canon_paths in mockspace.toml globs
# every TOML under mock/registry/, and a catalogue that is explicitly
# uncertain and confidence-scored must not sit where the tooling treats
# anything present as settled.
#
# verdict:
#   live        - claim exists and is already directly cited by a registry row
#   superseded  - claim is real and was properly carried forward into a later
#                 consolidation file or ledger, which IS what is cited
#   lost        - claim is real, canon-worthy, and reached no registry row
#                 before this round (ported_as shows what this round added)
#   exploration - process, methodology, audit-of-someone-else's-file, or a
#                 dead end that was never meant to become canon
#
# confidence: 0.0-1.0. Reflects how directly I checked the item, not how
# strongly I believe the underlying claim. A 0.5 on an unread file means "the
# structural evidence points one way and I have not opened it to confirm";
# raising it costs one Read call and whoever does that owes the correction to
# this row, not a new file.
#
# Format note: TOML beside the registry, in the registry's own dialect,
# because a reader who already knows how to read law.toml or probe.toml reads
# this with no new grammar, and it stays greppable with the same tools
# (`grep -rn 'id = "` on the same tree). The one deliberate difference is
# `verdict` and `confidence`, which no canon namespace carries and which mark
# this table as the uncertain one on sight.

