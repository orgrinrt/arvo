title = "Layout::Dense and Layout::Bitpacked footprint, swept past L1 and L2"
workload = "default"
master_seed = 0x1234_5678_9ABC_DEF0
may_differ = false
required = true

[sweep.dense]
title = "Layout::Dense footprint: sequential sum swept past L1 and L2"
arms = [
    "bitpack-footprint-dense",
    "bitpack-footprint-dense-alt",
]
points = [
    16384,
    65536,
    1048576,
    4194304,
    7000000,
    33554432,
]

[sweep.packed]
title = "Layout::Bitpacked footprint: plan-driven sum swept past L1 and L2"
arms = [
    "bitpack-footprint-packed",
    "bitpack-footprint-packed-naive",
]
points = [
    16384,
    65536,
    1048576,
    4194304,
    7000000,
    33554432,
]

# The head-to-head the footprint pair never ran (panel file 26).
#
# The `dense` and `packed` sweeps above were once two separate
# benches, so dense was only ever compared to dense and packed only to
# packed, and no packed-against-dense delta existed at any size past L1. All
# four arms are declared against the same `FootprintColumn` Routine with the
# same size list and share one `build_input_bytes`, so they were always
# directly comparable. This section runs them together. No variant code
# changes; the arms are byte-identical to the ones the two sweeps above
# already time.
[sweep.headtohead]
title = "Bitpacked against Dense over one column, swept from L1 to past a 12 MB L2"
arms = [
    "bitpack-footprint-dense",
    "bitpack-footprint-dense-alt",
    "bitpack-footprint-packed",
    "bitpack-footprint-packed-naive",
]
points = [
    16384,
    65536,
    1048576,
    4194304,
    7000000,
]
