    "satfold-seq",
    "satfold-iterfold",
    "satfold-lanes4-idx",
    "satfold-lanes16",
    "satfold-lanes64",
    "satfold-nolaw",
    "satfold-neon",
    "satfold-lanes16-constl",
]
points = [
    3010,  # L = 16, column 32 KiB, L1-resident, offset by one byte, saturating
    7010,  # L = 64, column 32 KiB, L1-resident, offset by one byte, saturating
    10010,  # L = 256, column 32 KiB, L1-resident, offset by one byte, saturating
    12010,  # L = 4096, column 32 KiB, L1-resident, offset by one byte, saturating
]

[sweep.length-dram]
