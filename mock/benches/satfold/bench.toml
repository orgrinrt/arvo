    "satfold-lanes16",
    "satfold-lanes16-3",
    "satfold-gate-true",
    "satfold-gate-false",
    "satfold-seq",
]
points = [
    7000,  # L = 64, column 32 KiB L1-resident, aligned, saturating
    10000,  # L = 256, column 32 KiB L1-resident, aligned, saturating
    12000,  # L = 4096, column 32 KiB L1-resident, aligned, saturating
