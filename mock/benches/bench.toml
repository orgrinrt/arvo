# arvo's bench tree. Every bench is a member directory beside this file, with
# its arms under `<bench>/arms/<arm>/` and its points in its own `bench.toml`.
# The support crates the arms and the hooks library share live in `support/`.

# One bench here is byte shaped, `digest-crossover`, whose arms read a run of
# bytes and write the eight bytes of a digest; every other takes its routine
# from `routine_for` in `src/lib.rs`. An empty or absent list would make the
# generated byte dispatch monomorphise a byte routine at every point of every
# bench, up to 335544324 bytes, so it is pinned to the crossover's lengths.
[dispatch]
points = [1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256]

[timing]
passes = 4
runs_per_pass = 1000
batch_size = 100
harness_runs = 1
cooldowns_ms = [0]
