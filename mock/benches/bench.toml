# ---------------------------------------------------------------------------
# The container fork (panel file 141). Four arms per row, all computing the
# identical value: `headroom` is the shipped rule (rung(rung_bits(W)+1)),
# `minimum` is the deletion, `plusone` is rung(W+1) kept as an aliasing
# control, `native` is plain Rust primitive arithmetic with the projection
# written once. The size field is a key: W*10000 + NC*1000 + OP*100 + D,
# decoded by `bench-warm-container-shared`'s `key_w` / `key_nc` / `key_op` /
# `key_d`. NC 0 is 8192 elements, NC 1 is 1048576. OP 0 is wrapping (Warm),
# OP 1 is saturating (Precise). D is operations per element.
# ---------------------------------------------------------------------------

