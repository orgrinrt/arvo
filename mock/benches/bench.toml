# ---------------------------------------------------------------------------
# The wide rung (panel file 22). Five arms per row, all computing the identical
# value. `ragged` is the byte-exact payload the ratified rule assigns to Cold
# and Precise; `ragged-overread` is the same payload read with whole-limb loads
# that reach into the neighbour; `wordround` is the whole-64-bit-limb payload
# the rule assigns to Hot and Warm; `wordround-alias` is the same stride from a
# different expression, kept as a noise-floor control; `align16` is the
# vector-aligned baseline. The size field is a key: W*1000 + NC*100 + D,
# decoded by `bench-wide-rung-shared`'s `key_w` / `key_nc` / `key_d`. NC 0 is
# 2048 elements, NC 1 is 458752. Every swept width is above the 128-bit native
# rung, which no other bench in this directory reaches.
