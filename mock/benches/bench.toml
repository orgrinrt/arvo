# arvo's bench tree. Every bench is a member directory beside this file, with
# its arms under `<bench>/arms/<arm>/` and its points in its own `bench.toml`.
# The support crates the arms and the hooks library share live in `support/`.

# No bench here is byte shaped: every one takes its routine from `routine_for`
# in `src/lib.rs`. An empty or absent list would make the generated byte
# dispatch monomorphise a byte routine at every point of every bench, up to
# 335544324 bytes, so it is pinned to one small point that nothing runs.
[dispatch]
points = [64]

[timing]
passes = 4
runs_per_pass = 1000
batch_size = 100
harness_runs = 1
cooldowns_ms = [0]
