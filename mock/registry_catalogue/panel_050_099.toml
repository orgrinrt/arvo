# Port catalogue for panel files 050-099 of
# mock/research/202608072330_the-numeral-canon-panel/.
#
# Format choice: TOML, sibling to mock/registry/ rather than inside it.
# Inside mock/registry/ would put this under `canon_paths` (mockspace.toml
# declares `canon_paths = ["mock/registry/*.toml"]`), which would make the
# mockspace tooling try to validate every [[item]] block against the
# registry's declared namespace schema (topic/dimension/obligation/question/
# strategy/law/probe/retirement/ruling/proposal) and treat this catalogue as
# canon, which it explicitly is not: entries here are uncertain, scored, and
# most were declined rather than promoted. A sibling directory keeps it
# TOML (machine-readable, greppable, diffable the same way the registry is)
# without polluting canon_paths or confusing `mock check`.
#
# One row per panel file (not per individual claim), since a file is the
# panel's own unit of authorship (numbered, written once, frozen) and a
# per-claim granularity for ~50 files would run past what one seat's slice
# can review at the depth this catalogue demands. Where one file carries
# several claims with materially different dispositions, that split is
# named inside `claims` / `note` rather than as separate rows.
#
# Fields:
#   path              - the panel file, relative to the panel root
#   unit              - which panel unit/topic it belongs to, where known
#   claims            - one to three sentence summary of what the file establishes or argues
#   verdict           - "live" | "superseded" | "lost" | "exploration" | "mixed"
#                        live:        the claim stands and either reached the registry
#                                     directly or through a consolidation that cites it
#                        superseded:  a later panel file replaced or refined the claim;
#                                     named in `superseded_by`
#                        lost:        real, controlled, evidenced content that never
#                                     reached a consolidation or the registry, by
#                                     accident rather than by decision
#                        exploration: process/checkpoint/dispatcher material, or a
#                                     genuinely open question with no claim to lose
#                        mixed:       different parts of the file carry different
#                                     verdicts; see `note`
#   confidence        - 0.0-1.0, this seat's confidence in the verdict
#   reason            - why this verdict, with what was checked
#   superseded_by     - paths of files that replace or refine this one's claims
#   supersedes        - paths this file itself replaces or refines
#   conflicts_with    - paths making an incompatible claim, neither resolved as superseding
#   first_commit      - date of the file's (only, in every case checked) commit
#   edited_after_supersessor - whether this file's own text was touched after a file
#                        in `superseded_by` landed (always false for numbered panel
#                        files, which are frozen; kept as a field because the schema
#                        is meant to generalise to files that are not)
#   canon_rows        - registry rows (namespace::slug) already citing this file, at
#                        time of this pass
#   ported_this_pass  - registry rows this seat added because of this file
#   note              - anything the fields above do not carry

