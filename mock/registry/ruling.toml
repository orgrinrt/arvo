topic = "binding_time"
says = "The admissible category for a predicate is whatever is available at const time. Making the predicates const expressions allows using const functions and piping in data from outside the typestate, and because they are const-time expressions the typestate is usable inside them too."
quote = '''
Let me just add there that the above collapses to whatever is available at const time: Making the
predicates const expressions for example, allows using const functions and pipe in some data that is
outside the typestate. However, being const time expressions, typestate is usable there too
'''
