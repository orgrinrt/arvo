This is something you should decide based on the workflow and soundness and validity of the canon
and work. If it's a real thing that constrains the work and is needed to know, it's canon

This is, again, something that bears on the two priors. I think, if it's a rule that can't be avoided
or designed away, a law, or something that constraints the work of the design, it's canon.
'''
