note = "Two statements of his in one sitting, and the second limb of the test lives only in the second. The row carried the two-limb `says` against the first statement alone, so a reader diffing it against its own evidence found half the test unsupported. Extended rather than shortened, because the missing limb is his. The second statement is the fourth answer in the same sitting, captured in the workspace repository at `.data/op-responses/202608311209_arvo-canon-panel-audit.md`, which no reference from here can reach.\n\nThe third `says` sentence, that the kind of statement and the tier do not decide the question, is the panel's inference from him sidestepping the three options he was given rather than a thing he said."
