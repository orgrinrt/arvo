[[ruling]]
id = "never_a_runtime_check_and_one_lowered_path"
kind = "intent"
rung = "ratified"
topic = "binding_time"
key = "I15"
says = "Runtime code can exist. Its branching should be done as much as possible with const-time ifs erased by monomorphisation, const solving and ultimately the backend. Never any runtime checks, ever: invalids are caught at compile time and unused paths are cleared when lowered. **Unless there is a justifiable reason that is blessed by a lead designer.**"
ratification = '''
Ratified by op on being asked whether this was `stated` or `in_force`, and he
took neither option as put: he ratified it and added a bound nobody had asked
about, because the absolute reading is too strong for what sits downstream.

> This is perhaps too absolute for some things specifically downstream in arvo,
> the algorithm crates and all. So ratify it with the addendum ", unless there's
> a justifiable reason that is blessed by a lead designer" or something similar.

The options he chose among were: `in_force` and ratified, on the grounds that
arvo's own lints already enforce it independently of any panel convergence;
ratified but not `in_force`, keeping his authority separate from the lints'; or
left at `stated`. **He picked none of the three**, which is the answer: the
question was about standing and the thing that actually needed fixing was the
strength of the claim.

The escape is his to grant and nobody else's. An agent finding a reason it
believes justifiable has found a question for him, not a licence.
'''
quote = '''
Option 1, but I should be clear on this: Runtime code can exist, it's only that the branching of it
should be done as much as possible, with const-time ifs that get erased via monomorphisation and just
const time solving and ultimately llvm. Never any runtime checks, ever. We catch invalids on compile
time, and unused paths we clear out when lowered. Period.
'''
note = "Two strengths in one sentence and they are different: \"as much as possible\" governs the branching, \"never, ever\" governs the checks. Runtime code exists; runtime validation does not. The options put to him were: compile time only, per type; both, at named places, compile time per type plus a runtime check at a declared ingest boundary; or runtime ingest as primary with the compile-time acts as consequences. He took the first and sharpened past it. The catalogue marks this STATED; by the same test it applies to the operating constraints it arguably reads as in force, since arvo's own repo rules carry it, and that disagreement is recorded here rather than acted on."
