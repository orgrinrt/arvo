note = "He rejected the fork rather than picking a side. The two options were: a value may gate an arm, at the cost measured for the value-gated form that materialises both lowerings and selects between them; or a value may not gate an arm, in which case several measured regions are characterisations rather than arms. Said in his own voice about the meaning of his own ratified entry, and not marked as a separate ratification."
