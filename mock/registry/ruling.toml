[[ruling]]
id = "the_overflow_panic_is_permitted_and_bounded"
kind = "ruling"
rung = "ratified"
topic = "overflow_policy"
answers = ["does_the_native_imitation_cover_the_debug_panic"]
key = "I18"
says = "Panic is the go-to for what cannot be caught at compile time through the typestate, on debug builds, in every strategy rather than only where a native primitive is being imitated. On a release build pretty much nothing panics, because the typestate and the debug panics are what force soundness in, so the panic is not needed there. What stands in its place on release is the guarantee plus an explicit declaration of the mode, saturate or wrap or whatever applies to the overflow or underflow at hand, which then lowers and behaves accordingly. None of this is black and white and the intent is deliberately loose."
ratification = '''
Ratified by op, in his own words and at his own request kept as loose as he
stated them. Asked whether "never on release outside of warm" named a concern
or a marker, he rejected the frame the question was built on:

> It's not the point to imitate, that is stale thinking, and see prior answer.
> However, panic is the go-to for things that can't be caught on compile time
> via typestate, when on debug builds, even on hot. On release, pretty much
> nothing should panic, because the intent is that the typestate and debug panics
> will force soundness into everything, so it's not needed on release builds.
> However, that's not as black and white either, so the intent, a bit loosened,
> and framed as above I frame it, holds. Idea is to make things forced sound,
> which means usually panic over saturation or overflow. But on a release build,
> we don't want to panic, rather we should either have the guarantees and
> explicit declaration of the saturation or wrap or whatever mode on overflow (or
> underflow) at hand and it will lower and behave accordingly. This is more
> complex than it seems so it should be ratified as ambiguously as I've stated it
> here, perhaps this verbatim to start with, and sharpen as we find the boundaries
> and real constraints to this and can name them precisely

**Two things moved.** The bound is no longer the imitation concern at all, which
he called stale thinking, and it reaches every strategy: "even on hot". And the
axis is the build rather than the strategy, debug against release, with the
release side carrying a declared mode instead of a panic.

**The looseness is ratified, not tolerated.** He asked for it kept ambiguous
until the boundaries are found and can be named precisely, so an arm that
sharpens this without having measured those boundaries is going past what he
blessed rather than completing it.

The options he chose among were: the reading that "outside of warm" named a
concern rather than a marker, so it survives the strategy set being reshaped;
that it named the Warm marker specifically and the row generalised past him; or
leaving it stated. **He took none, because both readings rested on the imitation
framing he was discarding.**
'''
quote = '''
Option 3 but strategy bound and never on release outside of warm. As a rule of thumb, not an
absolute, more of an intent
'''
because = "The build bound is why it does not undermine the never-a-runtime-check intent: a shipped program still contains no runtime validation."
note = "The options put to him were: no, values only, so the imitation covers what values come out and never the runtime signalling; the same guarantee at compile time, so what the panic catches is still caught but the imitation is of the guarantee rather than the mechanism; or yes, the intent bends here, a debug-only panic being the one acceptable exception. He corrected his own wording minutes later, and that correction is a separate row. Being a rule of thumb, an arm that cannot honour it is not thereby wrong."
provenance = ["panel::202608072330_the-numeral-canon-panel::104_op_the_imitation_is_ergonomic_and_i9_is_not_his_to_settle::#2-whether-the-imitation-covers-the-native-debug-overflow-panic"]
keywords = ["overflow", "panic", "debug", "dev", "release", "Warm", "rule of thumb", "imitation", "runtime check", "bound"]

