[[ruling]]
id = "the_derivation_is_a_placement_and_the_operation_set_is_an_admission_rule"
kind = "ruling"
rung = "ratified"
ratified_by = "experts"
topic = "the_realisation_map"
says = "The container derivation is a placement rather than a semantics, and its output count moves with occupancy: one output at sole occupancy, the carrier; three at shared, the carrier, the access width and the stride. Two arms, not one number. And the design ships an admission rule rather than an operation list: an operation is admitted exactly when it is a function of the declared signature, and where two realisations of one name disagree, the signature is missing a coordinate."
answers = ["container_derivation_output_count", "which_operation_set_the_design_ships"]
promotion = "Two seats, independently, on a floor settled hours earlier. Both reached the same two results and both reported that the questions as recorded could not be answered as put: the first offered three answers to a question with two regions, and the second asked for a list where the canon's own shape gives a rule.\n\n**The standing selector-versus-key disagreement is dead on both readings and neither seat had to pick.** Selector and key are one function curried two ways; the floor removed the only thing that made the difference observable. One seat argued it from the identity clause, that two factorings separated by no declared signature are one design. The other compiled both orders and showed they resolve identically, with both negative controls refusing. Constructively it went further: both readings name the wrong key, since the ladder is keyed on the placement objective and the strategy-to-objective map is the selector, which preserves the earlier two-expert result that a strategy name is a binding.\n\n**The admission rule is the format spine's closed-concept-open-inventory shape one tier down**, which is what makes it a derivation rather than a new decision.\n\n**One seat's blindness was compromised and it reported the leak itself.** A merge it was told to run printed the other seat's probe filenames, which are near enough that seat's two conclusions. All six of its probes and both of its conclusions were committed before that merge, so the contamination is bounded and checkable from the commit ordering, but it says plainly it can no longer serve as a blind instance on the framing. That is the dispatcher's error rather than the seat's."
because = "Under the settled ratification model the experts propose and the coordinator judges whether the reasoning, the evidence and the stated region are enough. Both results are gateable on a declared axis, which `dimension::occupancy` now carries."
note = "**A measurement broke its own author's criterion twice, and that is why the answer is trusted.** The first instrument set out to confirm a recorded claim that two partitions share no jump point, and found it true under one packing rule and false under the other, with neither carrier saying which it assumed. The replacement established what actually matters: the access width is not a function of the carrier and neither is the converse, under both rules, with three controls firing. It also panicked at width 123, where the access ladder runs out of native containers before the carrier ladder does.\n\n**One seat retired its own positive arm as true by construction**, the declared-width operations ignoring the carrier by definition, so the sweep restated its premise. The claim is analytic and is recorded as analytic.\n\n**What is not settled here** is membership above the floor, which stays open and now has a better-posed shape under `the_standard_is_parity_in_output_not_in_the_internals`: what the framework must be able to express, and which of those ship now against marked later."
provenance = ["panel::202608072330_the-numeral-canon-panel::226_lattner_the_derivation_outputs::#23-the-answer", "panel::202608072330_the-numeral-canon-panel::225_peyton_jones_the_container_premise::#3-the-statement-that-survives-and-it-is-already-the-canons-shape"]
keywords = ["container derivation", "placement", "output count", "occupancy", "sole", "shared", "stride", "access width", "selector", "key", "curried", "admission rule", "operation set", "open inventory"]

[[ruling]]
id = "the_fused_result_is_composable_except_at_signed_saturating"
kind = "ruling"
rung = "stated"
topic = "algebraic_laws"
says = "The fused multiply-add's result is reachable by composing multiply and add everywhere except at signed saturating, where it is unreachable at every fraction width including zero. So the fused operation is not a required member of any operation inventory; it is a required arm at signed saturating."
because = "Op's bound is parity in output rather than in the internals, so what the standards oblige is that the result be reproducible, not that an operation of that name be declared. Whether the result is reachable by composition is then a measurement, and it is one."
note = "**Measured, with the controls firing**: signed saturating reaches it for no mode at two placements, every other policy reaches it for some mode, swept across widths 5 to 7 over signed and unsigned crossed with wrap and saturate. It reproduces two committed law rows digit for digit at width 6 and extends them to 5 and 7.\n\n**Two structural mechanisms, both found by controls that failed first.** Any adaptation reading only the residue is translation-equivariant by construction, and wrap composes because it is a ring homomorphism while saturation is not.\n\n**This supersedes an earlier derivation reached under the inventory reading**, which concluded that a design shipping four of five operations was unreachable for any standards-adequate core because IEEE 754 requires the fused operation. That reasoning read the standards bound as constraining arvo's inventory, which op corrected the same evening. The conclusion does not survive in that form; what replaces it is narrower, measured, and states its region.\n\n**One expert.** Recorded at `stated` rather than promoted, and a second instance is owed before it becomes canon."
provenance = ["panel::202608072330_the-numeral-canon-panel::226_lattner_the_derivation_outputs::#23-the-answer"]
keywords = ["fused multiply-add", "fma", "composition", "signed", "saturating", "wrap", "ring homomorphism", "translation-equivariant", "arm", "region", "parity"]

[[ruling]]
id = "the_standard_is_parity_in_output_not_in_the_internals"
kind = "ruling"
rung = "stated"
topic = "arvo_identity"
says = "The standards bound is met by agreeing with what a standard documents as its result, for the cases it covers. It does not oblige matching the standard's internals, and it does not oblige carrying the standard's operation list. Reaching the same result by a different or unconventional route is fine, so long as the logic of the spec is matched. And a standard may ship with holes in it, each marked, because standards parity is not the thing that has to ship: the framework is, and it has to be sound, expressible, mathematically accurate and exhaustive."
quote = '''
just to note: the standard should be for parity in output, not so much the internals. as long as it
matches the logic of the spec, but perhaps achieves it slightly different or unconventional way, that
is fine.

and we can leave each standard a few holes with a FIXME to fill later, to be honest, that's not the
important thing to ship, it's a fundamentally sound, expressible and mathematically accurate and
exhaustive framework
'''
because = "An expert had derived the operation-set floor as the union of the two named standards' operation sets, reading the bound as constraining arvo's inventory. He said unprompted that the bound is about output."
note = "**It does not move which standards are in scope**, which `the_standards_bound_starts_at_two_and_reserves_the_rest` fixed at MATLAB `fi`/`fimath` and IEEE 754 with three reserved. It fixes what being in scope demands.\n\n**What it corrects is live work.** The derivation that the four-of-five cell is unreachable because IEEE 754 requires the fused multiply-add rested on the inventory reading. The bound obliges reproducing that operation's result, the exactly-rounded `a*b + c` with one rounding rather than two, and whether arvo declares an operation of that name is internals. The conclusion may still hold on the different ground that no composition of the other four reproduces it, which is a claim needing its own evidence.\n\n**The container premise refutation is untouched**, since it rested on a container-stated numeral returning 8192 where MATLAB documents 0, which is a disagreement in output.\n\nIt sits with the ratified format spine, which states arithmetic as an exact operation composed with a named total adaptation: a statement about the result that says nothing about the route.\n\n**The second half ranks the two and standards parity loses.** A standard covered with marked holes ships; a framework with holes does not. So the standards are a check on whether the framework is exhaustive rather than a gate on shipping, which is why two were named in the first place. **A hole in a standard is a `FIXME` and is honest. A hole in the framework is a defect.**\n\n**That moves the shape of `which_operation_set_the_design_ships`** from which operations must be present to what the framework must be able to express, and which of those ship now against marked later. The second is smaller, better posed, and answerable without the standards being complete."
provenance = ["panel::202608072330_the-numeral-canon-panel::227_op_the_standard_is_parity_in_output::#what-it-settles"]
keywords = ["standard", "parity", "output", "internals", "spec", "MATLAB", "fi", "IEEE 754", "alias", "adequacy", "operation set", "unconventional", "route"]

