# --- the predicate, the arms, and what is const --------------------------------

[[ruling]]
id = "the_work_is_predicated_arms_composed"
kind = "intent"
rung = "ratified"
topic = "the_predicate_notation"
key = "I13"
says = "The work is not a generalisation but a set of arms with const predicates, each optimising one nameable region and applying nowhere else, so that everywhere is optimal by construction as a composition of those regions. A universal solution is explicitly rejected: the strategies as a concept make one impossible by premise. Every finding must be predicated, including universal ones, so that where it holds is said exactly rather than assumed."
quote = '''
Even if "mostly doesn't hold in arvo", it means that still "sometimes holds in arvo" which means, there's
a nameable predicate for the sometimes which allows choosing the more optimal lowering and arm for that
specific case. We have to all remember that we are not writing a generalization, rather a bunch of arms
with const predicates that optimize each little "sometimes" so that all "sometimes" apply on that
sometimes and nowhere else, thus "everywhere" is optimal by construction as a composition of those
sometimes

Add that predicated arm for small wins that compound together as the heart of the work the experts are
doing. We explicitly reject a universal solution. That is ass. The strategies themselves as a concept
make a universal solution impossible by premise. We collect and compound answers to specific regions
where a predicate holds and write the expression where it holds, and the most optimal things that hold
true there. We should add a rule where all findings have to be predicated, even "universal" ones, so that
they are exact; currently universal would then probably mean something like "where n is numeral and
strategy is any and hardware features are any and threads are any" etc. that forces clearly saying where
a finding is known to hold instead of assuming an ambiguous "universal" that shifts constantly and is by
design, rejected and unstable
'''
because = "If the strategies weigh measurements differently then no single expression is best for all of them, so asking for one asks the design to stop being what it is. An unpredicated finding shifts its implied scope constantly and is unstable by design."
note = "The only entry at this rung. He ratified his own two statements in the sitting that produced them, with the instruction that the entry mean no more than he said and not extend beyond it. The scope is those two paragraphs. The dimension list, the distinction between `any` and unmeasured, and the exactness bar for a predicate are elaboration and are not part of what was ratified."
provenance = ["panel::202608072330_the-numeral-canon-panel::INTENTS::#i13-the-work-is-predicated-arms-composed-and-a-universal-solution-is-rejected"]
keywords = ["predicate", "arm", "arms", "region", "universal", "composition", "sometimes", "const predicate", "generalisation", "exact"]

[[ruling]]
id = "a_predicate_lists_only_what_holds"
kind = "ruling"
rung = "stated"
topic = "the_predicate_notation"
says = "Unmeasured and unknown do not go in a predicate. What is not known is assumed not true until proven true, and nothing writes unsure into a predicate. Unsure and unmeasured go unstated, and being unstated implicitly means not true."
quote = '''
unmeasured or unknown does not list in the predicate. It's not known, it's assumed not true until proven
true. No adding "unsure" into the predicate. Unsure or unmeasured etc explicitly go unstated and
implicitly mean not true
'''
note = "Said in the same sitting as the ratified entry, correcting an elaboration of the coordinator's rather than adding to the intent. It replaced a proposal that a predicate should write `unmeasured` on a dimension nobody checked; it should write nothing there. He did not mark it as a separate ratification, so it sits below the entry it specifies."
provenance = ["panel::202608072330_the-numeral-canon-panel::INTENTS::#i13-the-work-is-predicated-arms-composed-and-a-universal-solution-is-rejected"]
keywords = ["predicate", "unmeasured", "unknown", "unsure", "unstated", "absent", "not true", "omission"]

[[ruling]]
id = "the_predicate_is_whatever_is_available_at_const_time"
kind = "ruling"
