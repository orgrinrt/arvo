[[ruling]]
id = "warms_objective_is_the_intuitive_best_choice"
supersedes = ["warm_behaves_as_a_native_rust_primitive_would"]
ratification = '''
Ratified by op. Asked to ratify the earlier
`warm_behaves_as_a_native_rust_primitive_would`, he sent the question here
instead, saying the later wording is the one that holds:

> I think I have already expanded on this and reworded it better later, so there
> should already be a ruling, ratified by me, to the same effect, with the
> exception that intuition trumps rust convention, because we don't just want to
> simply mimic rust and lose on efficiencies, ergonomics, solidness, where
> following rust would lose those. It's more complex and nuanced, but the intent
> itself is that for the most part it should be *intuitive* to users, and being a
> rust crate, how rust does it *is the baseline* for intuition, but it's not
> absolute and there are already clarifications from me on that.

**Intuition is the intent and Rust convention is its baseline, not its
definition.** Being a Rust crate is what makes Rust's way the starting point for
what a user finds intuitive; it is not what makes it correct. Where following
Rust costs efficiency, ergonomics or soundness, intuition wins and the imitation
goes.

The options put to him on the earlier row were: ratify it as written with the
naming left open; ratify and close the naming with it; or leave it stated. **He
answered about a different row**, which is the finding: the roster of what to ask
about was built from the row that was easiest to find rather than from the one
that governs.
'''
kind = "intent"
rung = "ratified"
topic = "the_strategy_axis"
key = "I4"
says = "The intuitive-compromise strategy does not merely imitate. Its intent is to be the intuitive best choice for most every use case, and the intuitive part demands it mimics. Mimicry is not absolutely required and is dropped where it is consistently just the worse choice."
quote = '''
I should add that Warm does not merely imitate, its intent is to be intuitive best choice for most
every use case, and the intuitive part demands it mimics, but it does not make it absolutely
required, if mimicking is consistently just worse choice.
'''
note = "This sharpens the standing call rather than contradicting it: the objective sits underneath the imitation, so there is an escape from imitation the earlier statement did not describe."
provenance = ["panel::202608072330_the-numeral-canon-panel::38_op_the_strategies_weigh_measurements_differently::#his-words-verbatim"]
