says = "The licence clause, that everything inside an unobserved stretch is arvo's to choose, is an intent rather than a workspace rule leaking into the canon or a thing that drops to the design tier. He designated it one in four words and put it on the panel's side of the line."
quote = '''
It becomes your intent
