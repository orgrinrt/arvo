# --- the last round he answered, from `217` -----------------------------------

[[ruling]]
id = "the_warrant_is_a_token_and_a_clause_on_the_values_side"
kind = "ruling"
rung = "ratified"
ratified_by = "experts"
topic = "canon_form"
says = "A predicate entry may name how its region was earned, after the region and on the values side: `<axis>: <span>: <token>, <clause>`. Three tokens and no fourth. `swept` for a region a run covered. `construction` for an axis that cannot enter the argument at all, with the clause saying what makes it unable to. `exhaustive` for a span walked in full, with the clause naming the domain the span is the whole of. An entry carrying no token claims no warrant, which is what every existing entry keeps meaning. And a `construction` entry obliges the row's `evidence` to name an instrument that varied that axis and found no movement."
promotion = "Two derivations, written blind and in parallel from the ratified marker ruling, then each handed the other and resumed to attack it. Both conceded to the other on the thing they had got wrong and the result is neither's opening position.\n\nThe token is `construction` rather than `proof`, conceded by the seat that proposed `proof`, on the other's argument turned against its own file: a warranted axis can sit on a one-expert row, so `proof` makes a claim about the sentence inside a field about an axis, which is the row-level and axis-level confusion both files independently diagnosed in `sentence_kind`. It is also the corpus's own word, in 80 registry fields. The locus is the values side, conceded by the seat that proposed the slug side, because putting the marker there makes marking and obliging one act with nothing to keep in step.\n\nThe clause and the `evidence` obligation are the synthesis and were in neither opening file. One seat required a resolvable citation and withdrew it, because a genuinely new mechanism has no row to cite and the requirement bites hardest exactly when a finding is new. The other offered a prose clause and said in its own file that the arm checking it was the weakest thing in the file, carrying the defect this crate documents about its own retired word list. Obliging `evidence` instead grades nothing and moves the check off the prose: a well-phrased restatement costs seconds, a run that varies an axis and reports no movement does not.\n\nPer-axis rather than per-row is measured twice over disjoint evidence: 25 rows carry a universal and a bounded region together, and 6 of 8 `theorem` rows cannot be stated correctly at row granularity. Unmarked claiming nothing is the only one of four candidate defaults that keeps the ratified ruling's own `note` literally true.\n\nWhat the two agree on by having read the same paragraph rather than by two instruments is recorded in both files and excluded from the above: the word warrant itself, that `exhaustive` may not carry `any`, and that the shipped checker reads one side only."
because = "The ruling this descends from names the spelling as the panel's, and under the settled ratification model the experts propose and the coordinator judges whether the reasoning, the evidence and the stated region are enough."
note = "**`sentence_kind = \"theorem\"` is the bare-token marker already shipped and already broken**, which is why the tokens are not spelled `argued`, `measured` or `proof`. Of eight `theorem` rows one writes a universal, five write a sweep-shaped span and two write nothing, and one is a universal sentence holding at widths 3 to 7 and nowhere else. `proof` becomes admissible only if that row-level word is retired first, which is a conditional rather than a preference and is checkable in one grep.\n\n**`swept` is optional and exists to bound an ambiguity rather than to carry information.** With only two tokens an unmarked entry is permanently ambiguous between swept and predating the marker; with `swept` available that ambiguity is confined to a set that only shrinks.\n\n**What this costs, said here rather than left to be found.** Some constructions have no differential control available and never will, and the `evidence` obligation forces those to either a weaker warrant or a probe written to satisfy it. That is the known price of moving the check off the prose.\n\nTwo live violations found while deriving this, neither caused by it: a predicate writes `operation: operation any` where `dimension::operation` declares that inadmissible in bold in its own `grammar`, and six values sides bind more than one thing, two packing an undeclared axis inside a legitimate slug and the rest stating two regions on one axis inside one array element. The shipped arm checks the slug side only and sees none of them.\n\n**And the corpus is written in two dialects**, which neither seat knew before the attack phase: 139 of 527 entries drop the axis word from the values side entirely, `\"total_width: 6\"` against `\"total_width: W in 3..=7\"`, accounted for by two whole files. The slug side is uniform across both. Any arm reading the values side meets that first."
provenance = ["panel::202608072330_the-numeral-canon-panel::219_kiselyov_the_marker_spelling::#r3-where-we-genuinely-differ-on-a-design-call", "panel::202608072330_the-numeral-canon-panel::220_orchard_the_marker_spelling::#3-where-we-genuinely-differ-and-what-decides-it"]
keywords = ["warrant", "marker", "spelling", "construction", "exhaustive", "swept", "predicate", "values side", "token", "clause", "evidence", "theorem", "per axis"]

[[ruling]]
id = "a_proof_and_a_bounded_range_get_markers_the_notation_lacked"
kind = "ruling"
rung = "ratified"
ratified_by = "op"
ratification = "Asked as a four-option question and answered by selecting two of them together: a proof carries a different marker from a measurement, and the bounded whole-container range gets its own spelling. The two options he did not take were a per-file pass restating the missing dimension in each author's own voice, and leaving I13 as it stands with the corpus read literally."
topic = "the_predicate_notation"
says = "The predicate notation distinguishes three things where it distinguished two. A measurement carries the region it was swept over. A proof carries a marker saying its argument is width-free by construction, rather than being written as a sweep that happened to stop at three widths. A finding established across a bounded whole-container range, exhaustively over every value a container holds, is neither a sample nor a universal and carries its own spelling. The markers apply going forward; no existing file is restated, because the per-file pass was offered and declined."
because = "Across one topic's four files, 82 findings carried no width universal at all, against eighteen firings of the thread universal and thirty-nine of the target-feature one. Under I13 an absent axis says the finding holds in no situation where that axis exists, so read literally that topic held at no width anywhere in the library, which is not what any of its authors meant. The gap was in the notation rather than in the findings: a width-free argument had no honest spelling, so its authors wrote nothing and the notation read that as the strongest possible negative."
answers = ["what_a_proof_marker_is_against_a_measurement"]
note = "This is an append to I13 and invalidates nothing beneath it: every existing predicate still means exactly what it meant, and the never-widen-in-place rule is untouched, which is why declining the restatement pass costs nothing. What it does not settle is the marker's spelling or where a checker enforces the distinction, both of which are the panel's. The obvious failure to guard is a sweep relabelled a proof, and the test is the same one the notation already uses: name the construction that makes the width unable to enter, or it was a sweep."
provenance = ["panel::202608072330_the-numeral-canon-panel::217_op_the_last_round_and_the_panel_finishes_alone::#the-predicate-notation-gains-two-markers"]
keywords = ["predicate", "proof", "measurement", "marker", "width", "universal", "bounded range", "exhaustive", "I13", "notation"]

[[ruling]]
id = "accuracy_is_never_bought_with_performance"
kind = "intent"
rung = "ratified"
ratified_by = "op"
ratification = "Put as a fork between two readings of the accuracy intent, priced at 15.5x aggregate error and 16x worst case at depth five, with a third option offering both per arm. He selected none of the three and stated the intent below instead."
topic = "the_chain"
says = "Performance is never sacrificed for accuracy. Where something cannot be expressed reliably and accurately enough for general computing without losing performance and efficiency, that is a gap in the solutions rather than a trade to be made, and the work is finding the arm that is both. The precision strategy is the carve-out and it is narrow: it exists for the case where more than usual precision is wanted, and it is not the general answer."
quote = '''
We never sacrifice performance. If we can't express something reliably and accurate enough for
genereal computing (precision strategy is different, and would be used when more than usual
precision is needed) without losing perf and efficiency, we haven't done out job well enough and
lack the actual solutions and need to find them.
'''
because = "The fork presumed a trade. Ranking accuracy above performance answers a different question from the one the design poses, and a placement that buys accuracy by giving up speed has changed the question rather than settled it."
answers = ["which_accuracy_target_the_accuracy_intent_names"]
note = "What this does not do is pick the interior placement. It says the placement is chosen by which one is accurate enough at full speed, so the 15.5x measurement remains a fact about two candidate placements and stops being an argument for the slower one. Where no arm is currently known that is both, the honest report is that the arm has not been found, and that is a finding rather than a licence to take a side. His spelling is kept as he typed it."
provenance = ["panel::202608072330_the-numeral-canon-panel::217_op_the_last_round_and_the_panel_finishes_alone::#the-accuracy-target-he-refuses-the-trade-rather-than-the-reading"]
keywords = ["accuracy", "performance", "precision strategy", "general computing", "trade", "placement", "chain", "efficiency"]

[[ruling]]
id = "there_is_no_exchange_rate_because_there_is_no_generalisation"
kind = "intent"
rung = "ratified"
ratified_by = "op"
ratification = "Put as four candidate exchange rates: lexicographic with no rate, a stated rate per objective, a consumer-supplied rate, or silence. He selected none and stated the patchwork intent below, which rejects the question's premise rather than choosing among its answers."
topic = "the_strategy_axis"
says = "No exchange rate exists between objectives, because a rate is a generalisation over a category and the design rejects those by premise. Each arm carries its own justification, in words, recorded. A win is taken however small the gain and however small the region it applies to; the size of the region is the arm's predicate rather than an argument against it. The intended shape is a million small implementations for different situations, selected by const predicates that choose the most optimal path, with no attempt to generalise across them."
quote = '''
This is case by case basis and has to be justified in words that get recorded. Even small wins are
wins worth pursuing, however small, and however small a set they apply to. This is the "patchwork"
approach where we don't even try to generalise, we operate on const predicates that choose the most
optimal path always, from a million small different impls for different situations.
'''
because = "Asking at what rate one objective yields to another asks for a single policy covering a whole category, which is the anti-pattern the arms paradigm exists to refuse. The answer is not a rate and not silence: it is a recorded reason per arm, which is checkable in a way a rate never was."
answers = ["the_exchange_rate_a_preference_yields_at"]
instead = "Where a conflict between objectives arises, the arm states in words why it resolves the conflict the way it does, and that justification goes in the record beside the arm."
note = "Silence was on the option list and was not chosen, so this is not a licence to leave a conflict unexplained. The distinction is that the reason is local and written rather than global and derived. A million small implementations is the intended shape rather than a failure mode to be refactored away later, which bears on any review that would flag the count as duplication."
provenance = ["panel::202608072330_the-numeral-canon-panel::217_op_the_last_round_and_the_panel_finishes_alone::#the-exchange-rate-there-is-no-rate-because-there-is-no-generalisation"]
keywords = ["exchange rate", "patchwork", "arms", "const predicate", "small wins", "generalisation", "objectives", "justification", "I13"]

