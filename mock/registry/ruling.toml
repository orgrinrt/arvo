Option 1, but I should be clear on this: Runtime code can exist, it's only that the branching of it
should be done as much as possible, with const-time ifs that get erased via monomorphisation and just
const time solving and ultimately llvm. Never any runtime checks, ever. We catch invalids on compile
time, and unused paths we clear out when lowered. Period.
'''
note = "Two strengths in one sentence and they are different: \"as much as possible\" governs the branching, \"never, ever\" governs the checks. Runtime code exists; runtime validation does not. The options put to him were: compile time only, per type; both, at named places, compile time per type plus a runtime check at a declared ingest boundary; or runtime ingest as primary with the compile-time acts as consequences. He took the first and sharpened past it. The catalogue marks this STATED; by the same test it applies to the operating constraints it arguably reads as in force, since arvo's own repo rules carry it, and that disagreement is recorded here rather than acted on. The topic is a placeholder: no topic in this registry is about binding time."
