[[ruling]]
id = "two_experts_converging_is_a_ratification_and_the_coordinator_holds_the_gate"
kind = "process"
rung = "ratified"
ratified_by = "op"
topic = "panel_conduct"
says = "Panel-derived propositions do not wait on op. Where several experts converge heavily and can reason and spell it out, and the coordinator judges the reasoning, the evidence and the stated region sufficient, the proposition is promoted to canon. That promotion is a ratification and is treated as one, and it is recorded as distinct from a proposition op has stamped. Op's stamp is a marker that he has read it. The experts propose; the coordinator holds the gate; convergence is the bar rather than the trigger."
quote = '''
I stamp them but all of these are subject to being changed if the experts themselves end up
disagreeing or finding a better solution or wording or bound. These make sense to me, but I'm not a
domain expert. So if two experts agree on this, it is equal to my blessing. With my blessing on top
of it, it's basically not really worth much, because these get so theoretical I can't possibly
understand the implications and all that plays into it. So let's change the wording so that if two
separate experts agree on it heavily and can reason and spell it out, that is a ratification for
canon, though distinct from something I've blessed. But ratification never the less and should be
treated as such, and not reserved for me to stamp because this is not my speciality and I can't
really add anything to it. The stamp is just a marker that I've read it, no matter if I understand
it or not...
'''
because = "The requirement that ratification carry both expert convergence and his blessing is what left 122 panel propositions with no exit and not one of them ratified, while every ratified row in the namespace was him blessing his own words. The bottleneck was never his availability; it was a rule that reserved for him a judgement he says he cannot make."
instead = "He answers intent, fundamental design direction and broad strokes. Specifics are out of his depth by his own statement, and a panel exists precisely because they are."
note = "Two things this is not. It is not automatic promotion on a count of agreeing experts: he was explicit afterwards that the coordinator remains the gatekeeper, so the experts still only propose and somebody has to judge that a proposition is justified, reasoned and demonstrated enough to deserve canon. And it is not permanent: his own condition is that a promoted proposition stays open to change if the experts later disagree or find a better solution, wording or bound. A promotion carries the reasoning that justified it, so it can be argued with rather than merely counted."
provenance = ["panel::202608072330_the-numeral-canon-panel::213_op_the_experts_ratify_and_i_read::#the-format"]
keywords = ["ratification", "two experts", "convergence", "gatekeeper", "promotion", "stamp", "canon", "authority", "bottleneck"]

[[ruling]]
id = "an_expert_asks_its_peers_before_it_asks_op"
kind = "process"
rung = "ratified"
ratified_by = "op"
topic = "panel_conduct"
says = "An expert that cannot settle something asks the other experts in the panel first. Where they converge heavily, that convergence is the answer and op is not in the loop. He is reached for intent, fundamental design direction and broad strokes, and for nothing else."
quote = '''
It's fine, but they should first ask their peers in the panel and if they converge heavily, if they
agree, then that is the answer, and shouldn't need me in the loop. They are the experts, the domain
specialists. Not me. I can pretty much only answer things of intent, the fundamental design
directions and broad strokes, but anything that concerns specifics, is out of my depth, and is the
exact reason a panel or you managing them exist in the first place...
'''
because = "Said after observing that the experts avoid work unless they have absolute answers to everything, which he noted is their job. A question filed rather than derived is the avoidance, and filing it at him rather than at a peer is what made the avoidance look like diligence."
note = "This is why a panel is a small pool argued across rounds rather than a relay of single opinions: asking a peer requires there to be a peer holding the context, which a fresh dispatch per question does not provide."
provenance = ["panel::202608072330_the-numeral-canon-panel::213_op_the_experts_ratify_and_i_read::#parking-questions"]
keywords = ["peers", "convergence", "escalation", "intent", "specifics", "out of depth", "panel", "avoidance"]

[[ruling]]
id = "the_format_spine_is_canon"
kind = "ruling"
rung = "ratified"
ratified_by = "both"
topic = "the_format"
ratifies = [
  "a_format_is_identified_by_its_ambient_domain_and_its_representable_set",
  "membership_of_the_representable_set_is_one_affine_predicate",
  "arithmetic_on_a_format_factors_as_an_adaptation_of_an_exact_operation",
  "the_concept_is_closed_and_the_inventory_is_open",
]
says = "Four propositions become canon together and they are the format topic's spine. A format is identified by its ambient domain and its representable set, and that set is a constant of the type. Membership in it is one affine predicate over one parameterisation, of which integers, fixed point, scaled integers and floats are points. Arithmetic on a format is an exact operation in the ambient domain composed with a named total adaptation onto that set, and the adaptation is a first-class object with its own laws. The concept is closed and the inventory of admitted instances is open."
quote = '''
I stamp them but all of these are subject to being changed if the experts themselves end up
disagreeing or finding a better solution or wording or bound. These make sense to me, but I'm not a
domain expert. So if two experts agree on this, it is equal to my blessing.
'''
because = "Each stood at two independent experts before it was put to him, and the four are one shape rather than four claims: the identity fixes what a format is, the predicate says what is in it, the factoring says what an operation on it does, and the closed-concept clause says how a new instance joins without amending the canon."
note = "The first panel-derived propositions ever ratified in this registry. Marked `both` because he stamped them and the expert convergence was already there; under the ruling he made in the same breath, the convergence alone would have sufficed. His condition travels with them: subject to change if the experts later disagree or find a better solution, wording or bound."
provenance = ["panel::202608072330_the-numeral-canon-panel::213_op_the_experts_ratify_and_i_read::#the-format"]
keywords = ["format", "identity", "representable set", "ambient domain", "affine predicate", "adaptation", "closed concept", "open inventory"]

[[ruling]]
id = "behaviour_is_stated_per_declared_signature_and_the_premise_dissolves"
kind = "ruling"
rung = "ratified"
ratified_by = "experts"
topic = "the_container_premise"
ratifies = [
  "observability_is_relative_to_a_declared_signature",
  "every_operation_arvo_declares_is_a_function_of_the_declared_width",
  "the_carrier_is_observable_through_the_ambient_layout_observation_alone",
  "at_shared_occupancy_no_per_element_footprint_observation_exists",
]
says = "The container premise is malformed as a binary and both of its branches are false. Behaviour is stated per declared signature: every operation the design declares is a function of the declared width and never of the machine carrier, so arithmetic and encoding are stated over the declared width. The footprint is nonetheless observable, through exactly one observation the design does not own, the host language's layout observation on a sized type, and that observation exists only where the value is the sole logical occupant of its allocation. At a shared placement no per-element footprint exists to observe. Identity saturates at the declared signature set."
answers = ["the_container_premise"]
promotion = "Promoted on two independent instances of each of the four, and the second was dispatched specifically because the first was not two. All four rows were seat 210's alone, and seat 221, the same persona, declined to raise them and said in terms that a non-Dolan second read was owed. Seat 225 is that read, on a third persona, and derived blind: its phase-one commit precedes the commit in which it read the prior work, so the ordering is checkable rather than asserted.\n\n**Both branches are refuted by instruments rather than by argument.** The container branch fails op's own standards bound: a container-stated numeral returns 8192 where MATLAB `fi` at thirteen bits under wrap documents 0, swept exhaustively per width with the first witness named at each, and the divergence count rises with width rather than appearing at one cell. The rounding axis carries the same refutation, diverging in all 83 cells swept, which is the fixed-point form of the double-rounding story. The unobservable-carrier reading of the other branch does not compile: one primitive with two carriers fails const evaluation with the footprint contract unsatisfiable, which is the strongest refutation available and is committed with its stderr.\n\n**Seat 225 also built the instrument both prior seats named as missing**, a real packed column with elements straddling carrier boundaries, roundtripping exactly, where the only reachable size observation returns sixteen bits for a thirteen-bit placement. That is what establishes the fourth row rather than leaving it as the reasonable-sounding half of the third."
because = "Under the settled ratification model the experts propose and the coordinator judges whether the reasoning, the evidence and the stated region are enough. These four were read for that, and the deciding fact is that the two instances carry disjoint axes and agree where they overlap."
note = "**The intersection is stated rather than assumed.** Seat 225's instruments carry the width span 2 to 31 and the fraction-grid axis, which seat 210's own note flags as unreached. Seat 210's carry the operation and policy axes and the standards encodings. So the two agree over the union of what each covered and neither is a second instance on the other's axes, which is the honest shape rather than a defect.\n\n**One contamination, declared by seat 225 and recorded here rather than filed away.** Its brief withheld the four proposals by naming their slugs, and those slugs are descriptive sentences, so withholding them by name signposted the destination. Its route and its instruments are its own and were committed first. What that cost is unmeasurable and what it did not reach is the finding: **no signpost suggests dissolving the binary**, since all four slugs read as claims on one branch, and the dissolution is what this ruling turns on.\n\n**The question's own option list was the shape op has refused three times**, a single policy to govern a whole category. It is closed by dissolution rather than by picking a letter, which is what he has said the answer to that shape always is.\n\nThis unblocks the floor of the stack. `topic::the_container_premise` said of itself that no wording of several downstream clauses is true on both branches; there are no branches now, and the clauses can be written."
provenance = ["panel::202608072330_the-numeral-canon-panel::225_peyton_jones_the_container_premise::#3-the-statement-that-survives-and-it-is-already-the-canons-shape", "panel::202608072330_the-numeral-canon-panel::210_dolan_the_container_premise_is_a_theorem_over_a_signature::#1-what-i-did-first-which-was-try-to-break-the-question"]
keywords = ["container premise", "declared width", "carrier", "footprint", "signature", "observability", "layout", "shared occupancy", "packed", "dissolved", "malformed", "floor"]

[[ruling]]
id = "arms_over_regions_are_the_fundamental_heart"
kind = "intent"
rung = "ratified"
