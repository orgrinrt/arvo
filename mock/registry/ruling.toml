[[ruling]]
id = "there_is_no_universal_answer_take_the_win_and_gate_it"
kind = "ruling"
rung = "stated"
topic = "the_predicate_notation"
says = "A question asking which single policy governs a whole category is the anti-pattern he has already named. The answer is case by case: where something is free of soundness issues in one case, guard it with const expressions so it benefits without leaking an unsound premise to anything it does not apply to. Take the win where it applies, gate it out from where it does not."
quote = '''
Again, we don't need to settle for one universal solution, it's the anti-pattern I've already named.
Case by case. If commutative is void of soundness issues in one case, guard it with const expressions so
it benefits, but it doesn't leak unsound premise to anything it does not apply to. I don't understand
what is so hard to get about this? This is just me re-stating this same fucking thing over and over,
just under different names. Be it law, sentinel predicates, whatever the fuck, it's the same. Take the
win where it applies, gate it out from where it does not. No single one-fits-all solutions, it's
impossible
'''
note = "He rejected the question rather than answering it. It had been shaped as whether consumers would write a particular declaration, so that the design could decide whether to build the surface at all. Whether some consumer somewhere writes such a declaration is not a precondition for building the arm: the arm is built because a region exists where it is optimal. He notes it is the third time a question of this shape had been put to him in one sitting."
provenance = ["panel::202608072330_the-numeral-canon-panel::88_op_the_intent_is_not_every_clause_and_there_is_no_universal::#4-there-is-no-universal-answer-and-asking-for-one-is-the-anti-pattern"]
