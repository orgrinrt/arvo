# What op has said, one row per statement.
#
# The material is his: `INTENTS.md`, the seventeen `*_op_*` files of the numeral
# canon panel, and the two statements in `PRIOR_CALLS.md` that are his own voice
# about that corpus rather than entries in it.
#
# Three things govern how a row was built.
#
# **Quoting and naming the intent are two acts.** `quote` is verbatim, copied
# from the file including his typos. `says` is the intent inside it. A hedge, an
# aside or a self-correction is in `note` and never in `says`, because he has
# already had to say of one such clause that it was "just filler noise I mused on
# the spot".
#
# **A correction and what it corrected both stay.** He revises his own wording
# mid-answer often, and `corrects` is the edge for a reading that changed while
# the earlier row still holds. Nothing is deleted for being wrong later.
#
# **`rung` is carried from `INTENTS.md` where the entry exists there**, rather
# than re-judged here. Where the catalogue's assignment looks wrong the
# disagreement is in `note` and the assignment is unchanged.
#
# `answers`, `obligation`, `ratifies` and `declines` are unset throughout. The
# namespaces they point into are being populated separately, and a slug naming
# no row is a hard error. Which question each row would answer is recorded in
# `179_lamport_porting_ops_rulings_into_the_registry.md`.

# --- how his own words are to be read -----------------------------------------

[[ruling]]
id = "an_ack_is_not_a_ratification"
kind = "process"
rung = "ratified"
ratification = "Ratified by op in the second round, `panel::202608072330_the-numeral-canon-panel::211_op_the_second_ratification_round`. He selected it and added that these were settled long before the asking: \"Most of these have been well established and blessed by me earlier several times. This should not be something to ask me, I have been clear\". Panel file `95` is his own and carries two of this group in its addendum. The round should have searched before asking, and the rebuke is recorded with the row rather than filed away."
topic = "panel_conduct"
key = "I12"
says = "Op's word is the only thing that ratifies, and an opinion he gives before the experts have converged is an ack meaning the direction checks out. An ack does not close a question, does not stop work, and may not be quoted later as though it did. Ratification is the last step, reached only when the experts agree nothing is open and bring him a converged thing with the angles considered and the alternatives laid out."
quote = '''
we don't need to settle this with so loose base. We can explore more. And where there aren't any
ratifications, it only makes sense to make the experts work it out until they agree and stop
attacking each other and concede that this is actually good. Until that time, my word is only thing
that ratifies shit, and the last panel process taught me that I shouldn't go and ratify anything
before the experts actually agree and have a converged thing to bring to me, with all the angles
considered and perhaps some options too, alternatives. Until that time, we are wasting time taking
my opinions as anything other than "yeah checks out, direction is good" acks. Which is important we
do, but we need to stop treating them as a ratification that stops work on it and closes the issue.
That only happens once all experts agree that this is the best we could ever achieve, it is
perfect and there's simply no open things to settle.
'''
because = "The previous panel treated early opinions as closures, stopped work on questions that were not settled, and had to reopen them when a later expert found the gap."
note = "He said this while answering a different question, about `Precise` on `inexact`, and went past it. It governs how every other row here is read, including itself. It is also what makes the carried RATIFIED rung from the prior panel untrustworthy: those rows were classified under the superseded reading."
provenance = ["panel::202608072330_the-numeral-canon-panel::01_op_answers::#0-the-correction-an-ack-is-not-a-ratification"]
keywords = ["ack", "ratification", "ratify", "converged", "convergence", "settle", "authority", "rung", "provenance", "terminal"]

