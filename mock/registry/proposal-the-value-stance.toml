# --- the transparency row above, superseded now the raw door is gone ------------

[[proposal]]
id = "the_old_transparent_crates_work_is_each_value_types_own_doors"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "arvo_identity"
supersedes = ["the_old_transparent_crate_is_gone"]
says = "What the old `arvo-transparent` carried returns as the doors each value type declares for itself, and no general transparency contract stands beside them. On the value type that is `slot`, the member's coordinate in its format, and on the platform-sized aliases the doors to and from the host integer. No door gives or takes a value's carrier."
because = "The superseded row offered a `raw` door on the value type in place of the old crate, and the value type no longer has one: `ruling::behaviour_is_stated_per_declared_signature_and_the_premise_dissolves` leaves the carrier observable through the host's layout and through nothing the value declares, so a door typed in the carrier would make it declared. The old crate's job, getting at what a typed number holds, returns with the value type that holds it, which is how the old families are to come back."
provenance = [
  "mock::research/202611122300_value-stance-second-read::#arvo-transparent",
  "ruling::behaviour_is_stated_per_declared_signature_and_the_premise_dissolves",
]
keywords = ["arvo-transparent", "Transparent", "slot", "host doors", "carrier", "unwrap door", "old tree"]
