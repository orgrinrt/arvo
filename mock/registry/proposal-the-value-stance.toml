# The value stance and the old tree's crates, proposed from a second read of
# the ratified rows. Every row here is a proposal at one expert and none is a
# ruling: promotion is the coordinator's gate. The reading behind each is in
# `mock/research/202611122300_value-stance-second-read.md`, cited per row.

# --- the value stance ----------------------------------------------------------

[[proposal]]
id = "a_datum_of_a_format_is_one_point_of_its_ambient_domain"
kind = "answer"
sentence_kind = "definition"
standing = "one_expert"
topic = "the_primitive"
defines = "datum"
says = "A datum of a format is one point of its ambient domain: a member of the format's representable set. A set-valued datum is a composition's datum and never a format's, and the many exact results a saturating adaptation sends to one end of the set are a property of that adaptation, while the end itself stays one point."
because = "The spine makes a format its ambient domain and a representable set that is a constant of the type, with membership one affine predicate of which integers, fixed point, scaled integers and floats are points, so a member is a point. The statability ruling places intervals, stored-pair rationals and error-carrying values as compositions over formats rather than format instances, which takes the set-valued option out for formats. The min-plus ruling states absorption as a law over representable operands, `top + x = top`, and the spine puts saturation on the named adaptation, so the absorbing behaviour is a restriction on where a fold is sound rather than a denotation, which is the question's first option in its own words."
answers = ["what_a_datum_stands_for"]
note = "For formats only. The question's third option, a constructor-level clause, is not excluded by any ratified row, and this row does not exclude it either; it answers the question for a format's datum and leaves a composition's to the composition's own laws. The sub-fork the question's note names, soundness against bestness of a derived numeral, is untouched."
gap = "What a datum of a composition stands for is the composition's to say, and nothing here says it."
provenance = ["mock::research/202611122300_value-stance-second-read::#a-is-a-datum-of-a-format-one-point-of-the-ambient-domain"]
keywords = ["datum", "point", "ambient domain", "representable set", "member", "denotation", "absorbing top", "saturation", "set-valued", "composition", "Q4"]

[[proposal]]
id = "a_value_is_the_sole_occupancy_placement_of_a_declared_signature"
kind = "answer"
sentence_kind = "definition"
standing = "one_expert"
topic = "the_primitive"
defines = "value"
says = "A value of a declared signature is that signature's sole occupancy placement: one member's slot, held alone in the carrier the placement derivation gives at sole occupancy, in one canonical encoding. Every operation on it is a function of the declared width; the carrier is observable through the host's layout observation and through nothing the design declares."
because = "The ratified container ruling states that the footprint is observable through the host language's layout observation on a sized type and that the observation exists only where the value is the sole logical occupant of its allocation, which presupposes a sized type holding one value; its ratified fourth proposal makes placement the distinction, one primitive with two placements, so the value type is the sole placement used rather than a second placement beside the derivation. The placement ruling gives the derivation's output at sole occupancy as one carrier. The two obligations ask for exactly this: a platform-sized unsigned integer in a public error type, and a primitive of arvo's own at every position a bare number would take, each of which is a sole occupant."
obligation = ["a_platform_sized_unsigned_integer_at_an_api_position", "a_primitive_for_every_position_a_bare_number_would_take"]
note = "The design sentence that no row licenses a numeral value type carrying a stored slot read \"not in this crate\" as \"not licensed\": the format crate is right to forbid a carrier, and the value type belongs to a crate above it. Which ladder rung a declared width takes is not this row's; it is the placement derivation's, and it is frozen by the first release because the layout observation reads it. Its `defines = \"value\"` reaches past its own gap: `ruling::behaviour_is_stated_per_declared_signature_and_the_premise_dissolves` speaks of a value that either is or is not the sole occupant of its allocation, so values exist at shared placements too, and what this row defines is a value type at sole occupancy rather than a value. `ruling::a_format_datum_is_one_point_and_a_saturating_end_is_one_point` ratifies the datum clause for formats only. That a type may hold a datum as a value at sole occupancy is presupposed by `ruling::behaviour_is_stated_per_declared_signature_and_the_premise_dissolves` and `ruling::the_derivation_is_a_placement_and_the_operation_set_is_an_admission_rule`, and as a statement of its own it has one cold read; this row stays at one expert, and its slot and one canonical encoding no second read reached."
gap = "Shared placement, the packed column, is not covered and waits on the carrier deferral."
provenance = ["mock::research/202611122300_value-stance-second-read::#b-do-these-rows-license-a-type-that-holds-one-value-at-sole-occupancy"]
keywords = ["value", "value type", "sole occupancy", "placement", "carrier", "declared signature", "declared width", "layout", "size_of", "canonical encoding", "USize", "primitive"]

[[proposal]]
id = "ingest_of_a_host_value_is_the_declared_adaptation"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_format"
says = "A host value enters a format through that format's own declared adaptation, with the identity as the exact step: the host integer or float is a point of the ambient domain and the adaptation is total onto the representable set. No ingest carries a rounding or an overflow rule of its own, and a rejecting constructor is not an ingest."
because = "The spine factors arithmetic as an exact operation composed with a named total adaptation, and its ratified proposal says an operation that fuses an adaptation invisibly is an operation and an adaptation point wearing one name, to which the model's statements apply only once the two are separated. An ingest with its own clamp or wrap would be that fused case. A rejecting constructor is a runtime check, which the ratified no-runtime-check ruling refuses, and a masking one has no numeric meaning. The derivation is the spine's with the identity as the exact operation, so it states nothing the spine does not already carry."
note = "Op's own ingest row says arvo may ship casting and conversion helpers and may not use them in place of the consumer. This row is read as consistent with it: the adaptation the ingest applies is the one the consumer declared in the signature, so arvo decides nothing on the consumer's behalf."
gap = "What ingest does with a host value that is not a point of the ambient domain, a float's NaN or infinity, is not stated, and the ratified rows do not decide it."
provenance = ["mock::research/202611122300_value-stance-second-read::#c-is-ingest-of-a-host-value-the-declared-adaptation"]
keywords = ["ingest", "host value", "conversion", "cast", "adaptation", "exact step", "identity", "rounding", "overflow", "runtime check", "constructor"]

[[proposal]]
id = "the_exact_intermediate_is_named_beside_the_value"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_chain"
says = "Beside the value type of a declared signature stands an exact accumulator: a name for the exact step's result before the adaptation, with exact addition and subtraction on it, a widening from a value into it, and the signature's own adaptation as its one way back to a value. Its width is the exact result's width under the operations it admits, held in a register wide enough that no admitted step loses a bit."
because = "The statability ruling says a concept closed over `V x V -> V` has no name for the intermediate a composite claim quantifies over, so a claim about a composite has no expressible form; the spine makes the exact operation and the adaptation two first-class stages, so the intermediate is the exact step's result before the adaptation. Naming it is what makes a composite claim, a sum adapted once rather than per step, statable at all. Kaski's lane asks for that sum: a fold over many quantities whose rounding happens once."
obligation = ["composition_contracts_above_the_numeral", "a_deterministic_fixed_point_lane_with_declared_rounding"]
note = "The ratified row licenses the name and does not owe it: its companion list, the width algebra of exact results among it, \"is not promoted by this ruling and stays at one expert\". So the width clause of this row is this row's own and rests on nothing ratified. A reading that the row says the format concept supplies the width algebra and so the value crate owes the accumulator is not what the row says."
gap = "The width algebra past addition and subtraction, a product or a quotient held exactly, is not stated. Whether a fold's reduction order is specified is `question::reduction_order_or_associativity` and is not answered here."
provenance = ["mock::research/202611122300_value-stance-second-read::#d-does-the-row-at-1824-license-a-named-exact-intermediate-beside-the-value-type"]
keywords = ["accumulator", "exact accumulator", "intermediate", "exact result", "widen", "narrow", "composite claim", "statability", "V x V -> V", "fold", "sum", "width algebra"]

