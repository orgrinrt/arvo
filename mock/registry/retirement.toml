# What must not be cited again, and why.
#
# Two bodies of material, kept in one namespace because a reader meeting a claim
# in the wild does not know which body it came from.
#
# The first is `DROPLIST.md`, which this panel carries forward from its
# predecessor: its section 6 is that panel's cumulative droplist, extracted at the
# moment it closed. Those entries retire claims made about a design and a source
# tree that have since been deleted, and they are here because the current panel
# treats the ledger as live and cites into it.
#
# The second is the retirement and must-not-cite list each canon candidate carries
# in its own section 3 or its equivalent, plus the amendments its revisions make to
# those lists.
#
# `DROPLIST.md` is a living ledger, so every citation into it is the heading anchor
# of the section holding the entry; the section has no subheadings, and `claim` is
# what locates the entry inside it. That is the intended discovery path anyway: the
# claim is written in the words a later reader would grep for.
#
# The namespace has no `note` field, so a qualification that is neither the reason
# nor the replacement is carried inside `why`. Where a source states what would
# have to be overturned to reopen an entry, that is carried there too, because the
# droplist's own stated purpose is that an entry says enough of its reasoning for
# somebody who believes a retest would come out differently to know what has to go.

# --- the cumulative droplist, carried forward from the predecessor panel ---------

