why = "Compiles clean when corrupted, with zero diagnostic, because a permission-shaped coercion carries no data for the compiler to check against; a hand-verified wrong grant produced a silently wrong numeric answer. Two follow-up fixes also failed: a fully generic blanket derivation hit the generic-const-in-type-position wall, and porting a witness-constant shape onto the same trait is disarmable exactly the way one existing resolution constructor's classification was already disarmed, because the implementor writing the lie also controls the check for the lie inside the same impl block. Op's own adopted principle, which no consolidation stated, is that a fidelity grant is checked rather than asserted, on the same footing as the recovery map the earlier verification thread ended up witnessing; he also recorded what that does not settle, since a licence witness is not a port of the recovery-map witness, there being no returned value to check a grant against, which is precisely why the corruption went undetected."
kind = "wrong"
replacement = "Recomputing the relation inline in an ordinary const block at every consumption site, which satisfies the adoption in substance because recomputing inline is checking rather than asserting."
