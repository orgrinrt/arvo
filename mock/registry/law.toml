[[law]]
id = "multiplicative_associativity_under_wrapping"
statement = "`(a * b) * c == a * (b * c)`, where multiplication is the exact ambient product reduced onto the representable set by wrapping."
holds = [
  "total_width: W in 3..=8",
  "fraction_width: F = 0",
  "signedness: signedness in {unsigned, signed}",
  "overflow_policy: overflow policy = wrap",
  "operation: operation = mul",
  "arity: arity in {2, 3}",
]
fails = [
  "total_width: W in 3..=7",
  "fraction_width: F > 0",
  "signedness: signedness in {unsigned, signed}",
  "overflow_policy: overflow policy = wrap",
  "operation: operation = mul",
  "arity: arity in {2, 3}",
]
witness = "At `F > 0` a representable-width multiply discards F bits at every pairwise step before any clamp is consulted, so the ambient operation is no longer associative and no reduction repairs it. Measured three ways: nine of nine fractional configurations fail in `57_probes/p3` section 3, wrap's ring collapses identically at nine of nine in `61_probes/q2`, and 54 of 54 signed rows fail in `62_probes/p2` under both rounding spellings."
topic = "algebraic_laws"
note = "The `F = 0` holds region combines two instrument sets at different widths: the format unit's cube at four-bit widths with the `w = 3 through 7` width instances, and the strategy unit's `93` F1 sweep at `W in 3..8` for the unsigned case. The signed `F = 0` wrap cell is the cube's `ring` row and is separately marked `section-dependent` at `F > 0`, meaning the choice of representative range becomes arithmetic-bearing there."
gap = "Nothing here is established above `W = 8`. Every width in both lists is a model width, and the derived-laws unit established that a model band below the shipped width can be defeated by construction, so no row of this law transfers to a shipped width by band agreement."
provenance = [
  "panel::202608072330_the-numeral-canon-panel::63_spj_consolidation_the_format_concept::446",
  "panel::202608072330_the-numeral-canon-panel::63_spj_consolidation_the_format_concept::417",
