[[law]]
id = "equation_truth_sets_are_initial_segments_in_the_width"
statement = "For an equation law over the wrapping ring fragment, the set of widths at which it is true is an initial segment: true at every width up to a threshold and false above it. Disequation laws are the dual."
holds = [
  "total_width: W any",
  "fraction_width: F = 0",
  "signedness: signedness = unsigned",
  "overflow_policy: overflow policy = wrap",
  "operation: operations {add, sub, mul, neg} with integer constants",
  "arity: arity any",
]
fails = [
  "fraction_width: F = 0",
  "signedness: signedness = unsigned",
  "overflow_policy: overflow policy = saturate",
  "operation: operations {saturating add, saturating mul} with nonnegative clamp-embedded constants",
  "arity: arity = 2",
]
witness = "Saturating laws have neither polarity: gapped and interior-run truth sets exist among constant-free depth-2 terms, 16 and 24 of 21,945 pairs, including a law true at width 2 alone and a genuine ring identity false at width 2 alone. The mechanism is that the gapped sets occur exactly where the min-form property fails, a ceiling clamp discarding magnitude a later negative operand would have restored."
topic = "algebraic_laws"
note = "This is what survives of the model-band transfer after that mechanism was defeated. Polarity is the whole of it: a band FALSE embeds upward with its witness and a band TRUE exports nothing, so a band can refute and can never license. `84` measured the polarity at arity 1 by its own admission; `86` proved it at every arity as a corollary of the degree-grid criterion, which discharged that limit, so `arity any` is carried on the strength of the proof rather than of the sweep."
gap = "Nothing here is a licence. The consequence a reader needs is that the band mechanism cannot carry a positive verdict in either fragment, and this row states why for one of them."
provenance = [
  "panel::202608072330_the-numeral-canon-panel::90_giesen_consolidation_derived_algebraic_laws::237",
  "panel::202608072330_the-numeral-canon-panel::90_giesen_consolidation_derived_algebraic_laws::241",
