gap = "The signed cell restricted to a declared non-negative operand window is established to hold at `W in {4, 5, 6}` and is on neither list, because the declared operand window is not a declared axis and the cell is otherwise identical to the failing one. The strategy unit records that as its only positive law result and its cleanest region-scoped arm, and the notation cannot hold it."
