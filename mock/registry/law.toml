# The algebraic laws this panel reasoned about, with the regions it established.
#
# Every region here is transcribed from the establishing consolidation. Where a
# consolidation stated a region in the ratified notation it is carried verbatim;
# where it stated none but named its instrument's parameters, the region is those
# parameters and nothing more. Nothing is widened, and no axis is supplied that a
# source did not name.
#
# Three things a reader has to know before quoting any row.
#
# **`holds` and `fails` are not complements.** Absence from `holds` is not a claim
# that a law fails there, which is the one place this namespace's absence
# semantics is weaker than a proposal's predicate. Several rows below leave a cell
# out of both lists, and each says so in `gap`.
#
# **Several cells cannot be placed on either list, because the axis that
# separates them is not declared.** The representable range's geometry, the
# declared operand window and the constant-embedding convention each decide a
# verdict with every declared axis held fixed, so a row trying to carry them
# would put one region in both lists at once. Those cells are in `gap` rather
# than silently on one side.
#
# **`threads` is present on exactly the rows whose source wrote it.** The same
# class of pure-value law appears here both with `threads any` and with no thread
# axis at all, because one consolidation wrote the axis into its predicate and
# another did not. Under I13 that difference is the difference between a law that
# holds at any core count and one that holds only where threads do not exist, and
# it is an artefact of who was writing rather than of the algebra.

[[law]]
id = "additive_associativity_under_wrapping"
statement = "`(a + b) + c == a + (b + c)`, where addition is the exact ambient sum reduced onto the representable set by wrapping."
holds = [
  "total_width: W in {4, 8}",
  "fraction_width: F any",
  "signedness: signedness in {unsigned, signed}",
  "overflow_policy: overflow policy = wrap",
  "operation: operation = add",
  "arity: arity = 3",
]
topic = "algebraic_laws"
note = "Two instruments at two widths: the format unit's cube at four-bit widths, and `76`'s exhaustive sweep over `u8`. `F any` is licensed by the format unit's own scale-blindness argument, that addition at a common scale never reads the scale, rather than by a sweep over F. The source states no thread count and no target features, so both axes are absent, which under I13 says the law holds in no situation where threads exist. That reading is an artefact of the consolidation's notation discipline rather than of the algebra: the neighbouring row `associativity_of_a_composed_saturating_add_and_subtract` carries `threads any` for a claim of exactly the same kind, because its source wrote the axis."
gap = "The premise is same-scale addition throughout. Whether a mixed-scale addition exists, and what result format it infers, is an open question the additive column depends on and nobody has swept."
provenance = [
  "panel::202608072330_the-numeral-canon-panel::63_spj_consolidation_the_format_concept::444",
  "panel::202608072330_the-numeral-canon-panel::63_spj_consolidation_the_format_concept::473",
  "panel::202608072330_the-numeral-canon-panel::90_giesen_consolidation_derived_algebraic_laws::122",
]
keywords = ["associativity", "addition", "wrap", "wrapping", "abelian group", "additive", "scale blind"]

