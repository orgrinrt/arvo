witness = "Over every total order on the carrier at widths 2 and 3, exhaustively, wrapping addition and xor over `GF(2)^n` admit zero compatible total orders each, while saturating addition and min admit some. The structural reason holds at every width: a finite cyclic group admits no translation-invariant total order."
topic = "the_number_system"
note = "`W any` is the source's own, licensed by the structural argument rather than by the sweep, which ran at two widths. The consequence the format unit draws is that comparison on a wrapped numeral is representative-order, which arithmetic does not respect, and it says the canon owes that sentence under every filing equally. The number-system unit draws a different one: an order-or-magnitude boundary for `number system` is measured empty, because it groups wrapping with a bit vector and splits wrapping from saturating inside one kernel item."
gap = "The format unit records a further, untested hypothesis that the signed encoding trade, no bijective encoding of a signed value set having both raw-order agreement and raw-adder correctness, is this same theorem in disguise. Nobody has built it, and it would close the redundant-encoding hole if it were true."
