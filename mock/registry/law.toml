note = "Coherence is one of two independent law roles: the adaptation laws face the source and are what error transport and order transport consume, coherence faces the target and decides whether the member computes exactly in an induced algebra. All four combinations of the two roles are inhabited, which is why neither family subsumes the other and why expelling wrapping while retaining saturation has no criterion that does not empty the adaptation slot. The width entry is the instrument's own: `56_probes/q1_two_law_families.rs` declares its ranges as `LO = -8, HI = 7` and `ULO = 0, UHI = 15` at the top of the file, which is four bits in both sign domains, and it happens to agree with the cube. The consolidation states no width for it, so a reader working from the consolidation alone has nothing."
gap = "The unsigned add-only saturating case over a nonnegative window holds both roles and is on neither list, because the operand window that distinguishes it is not a declared axis."
