[[law]]
id = "quantise_then_reduce_commutes"
statement = "Quantising a value and then reducing it into range gives the same answer as reducing it and then quantising, so the composition order of the two axes is unobservable and a canon need not state it."
holds = [
  "total_width: W any: construction, wrapping translates by the span, an even multiple of the quantum at every width, so the width enters the argument only as which multiple",
  "fraction_width: F any",
  "signedness: signedness any: construction, the argument reads only translation by the span and the grid, and neither depends on where zero sits in the range",
  "ambient_domain: ambient domain closed under negation",
  "overflow_policy: wrapping",
  "rounding: in {floor, ceil, half_up, half_even}: swept, every member the row names, read in the quotient",
  "threads: threads any",
]
fails = [
  "rounding: toward_zero",
  "overflow_policy: wrapping",
  "signedness: signed, or unsigned with signed intermediates",
  "threads: 1",
]
topic = "rounding"
evidence = ["rounding_commutes_with_the_overflow_policies"]
note = """
The failing pairing is the one member that respects no translation set against \
the range policy built on translation. Every other pairing commutes, and the \
equality is read after the final range reduction, which is where a wrapping \
policy's values live. Before that reduction, at the representative level, the \
floor member alone commutes, measured at zero disagreements against 60, 32 and \
32 for ceiling, half-up and half-even, so a design that ever observes an \
intermediate representative needs the stronger statement.

The holding region is the wrapping half of the governing revision's commutation \
predicate, written from it with one derivation of this row's own: `W >= 1`, which is every width a format has, `F` \
any, signedness any, a domain closed under negation, every \
translation-equivariant member against wrapping, equality read in the quotient, \
threads any. The source's mode set is the translation-equivariant members, and \
half-even is not one; it is in the set here because wrapping is translation by \
the span, an even multiple of the quantum at every width, so half-even commutes with it as floor, ceiling and \
half-up do and toward-zero alone does not. The saturating half of the same \
predicate, every deterministic member against saturation, is \
`law::quantise_then_reduce_commutes_under_saturation`, split off because one \
row carries one region per field and the two halves differ on both the policy \
and the mode set. The holding region is the argument's, by equivariance; the \
cited instrument swept `W in {3, 4, 5}` over exact points at sixteen subquanta \
per quantum and agrees with it, and its toward-zero arm is the failing region's \
measurement.

The width and signedness entries carry the proof marker in the spelling of \
`ruling::the_warrant_is_a_token_and_a_clause_on_the_values_side`, as \
`ruling::a_proof_and_a_bounded_range_get_markers_the_notation_lacked` asks of a \
proof, and the instrument discharges the obligation that spelling carries: it \
varied the width over three values and the signedness over both, and the \
quotient verdict did not move. The fraction width and the thread count carry \
no marker. The instrument counts in quanta, so the fraction width never \
enters it and is not varied, and nothing varies the thread count, so neither \
can carry `construction` and each claims its region with no warrant.

The failing region is written exactly as the restoration pass restored it. An \
earlier revision had written `domain: OPEN` into this predicate and that token \
was deleted, because unmeasured goes unstated rather than hedged.
"""
gap = """
The failing region names no ambient domain, because the restoration pass \
deleted the token that stood there and stated nothing in its place, so as written \
it holds nowhere a domain is defined. The instrument's must-fail arm ran over \
exact values of both signs; writing that in is a widening and is not done here.

No witness. The source establishes the failure by existence, one witness, and \
records that its rate does not carry; the instance itself is not quoted in the \
governing files.
"""
provenance = [
  "panel::202608072330_the-numeral-canon-panel::138_leroy_the_restoration_pass::49",
  "panel::202608072330_the-numeral-canon-panel::136_leroy_the_candidate_revised_against_three_signatures::355",
  "panel::202608072330_the-numeral-canon-panel::132_leroy_the_canon_candidate_for_the_rounding_axis::344",
]
keywords = ["commutation", "commute", "quantise", "reduce", "range policy", "toward zero", "wrapping", "decomposition", "composition order", "representative", "quotient"]

