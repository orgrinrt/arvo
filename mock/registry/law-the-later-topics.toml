Only the signedness entry carries the proof marker, because only signedness \
was varied by the instrument the marker's spelling obliges, both signednesses \
with no movement. The width is argued free in the same way and the instrument \
ran one width, so under `ruling::the_warrant_is_a_token_and_a_clause_on_the_values_side` \
it cannot carry `construction`; the width, the fraction width and the thread \
count claim their regions with no warrant, and the marker \
`ruling::a_proof_and_a_bounded_range_get_markers_the_notation_lacked` asks of a \
proof is owed on them until a run varies them.
