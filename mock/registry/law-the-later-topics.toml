[[law]]
id = "quantise_then_reduce_commutes"
statement = "Quantising a value and then reducing it into range gives the same answer as reducing it and then quantising, so the composition order of the two axes is unobservable and a canon need not state it."
fails = [
  "rounding: toward-zero",
  "overflow_policy: wrapping",
  "signedness: signed, or unsigned with signed intermediates",
  "threads: 1",
]
topic = "rounding"
note = """
The failing pairing is the one member that respects no translation set against \
the range policy built on translation. Every other pairing commutes, and the \
equality is read after the final range reduction, which is where a wrapping \
policy's values live. Before that reduction, at the representative level, the \
floor member alone commutes, measured at zero disagreements against 60, 32 and \
32 for ceiling, half-up and half-even, so a design that ever observes an \
intermediate representative needs the stronger statement.

The failing region is written exactly as the restoration pass restored it. An \
earlier revision had written `domain: OPEN` into this predicate and that token \
was deleted, because unmeasured goes unstated rather than hedged.
"""
gap = """
**The holding region cannot be written.** The commutation predicate is stated \
over an ambient domain closed under negation, and no `dimension` row declares \
an axis for the ambient domain, so the region where this law holds has no \
expressible form in the canon's own notation. That is the single largest gap \
this port hit: the ambient domain appears in 26 of the 60 predicate spans that \
could not be ported, and is the sole blocker of 4 of them.

No witness. The source establishes the failure by existence, one witness, and \
records that its rate does not carry; the instance itself is not quoted in the \
governing files.
"""
provenance = [
  "panel::202608072330_the-numeral-canon-panel::138_leroy_the_restoration_pass::49",
  "panel::202608072330_the-numeral-canon-panel::136_leroy_the_candidate_revised_against_three_signatures::355",
  "panel::202608072330_the-numeral-canon-panel::132_leroy_the_canon_candidate_for_the_rounding_axis::344",
]
keywords = ["commutation", "commute", "quantise", "reduce", "range policy", "toward zero", "wrapping", "decomposition", "composition order", "representative", "quotient"]

[[law]]
id = "a_deletion_licence_holds_exactly_where_the_boundary_function_family_is_a_singleton"
statement = "Within a maximal unbound stretch, a licence to delete an interior resolution holds if and only if the placements of that stretch induce exactly one boundary function. The forward direction holds and the converse does not: a family can be a singleton with both licences refusing, so the two licences under-approximate the safe region rather than characterise it, which is what a sound licence is for."
witness = "The chain `+97 *3 +13` under a round-to-8 resolution has a singleton boundary-function family and both deletion licences refuse it, which refutes the converse. The forward direction has no counterexample over the four chains at three resolutions swept against it."
topic = "the_chain"
note = """
Carried as a law rather than as a proposal because the two licences are \
algebraic: the range licence reads widths and a bound, the algebraic licence \
reads whether the resolution commutes with or is absorbed by the composition. \
The algebraic one is a conjunction over every step, so one non-conforming \
operation anywhere revokes it with the endpoints unchanged, and the carrier of \
a chain's licence therefore has to see every step rather than only its ends.

The revision stated this as a biconditional using the words "exactly" and \
"precisely". The independent check split it into three directions, measured \
that one holds and one fails, and the restoration pass replaced the \
biconditional with the implication that holds. This row states the corrected \
form and keeps the refuted direction, because the refutation is what says the \
licences are sound rather than complete.
"""
gap = """
**No region, in either field.** The chain topic's statement carries no `holds \
for:` predicate on any of its twelve clauses, and neither does its revision, so \
there is nothing to transcribe. The forward direction's own support is the \
soundness of the licences established at a grid with four firing controls over \
4096 inputs per cell, and the check's reproduction reached only two cells of \
that grid, which its own coverage note calls a thin base for a universal. The \
sweep's thinness bounds the reproduction rather than the claim.
"""
provenance = [
  "panel::202608072330_the-numeral-canon-panel::178_leroy_the_restoration_pass::69",
  "panel::202608072330_the-numeral-canon-panel::173_leroy_the_canon_candidate_for_the_chain::575",
]
keywords = ["licence", "deletion licence", "range licence", "algebraic licence", "congruence", "absorption", "boundary function", "singleton", "stretch", "biconditional", "chain", "interior resolution"]

[[law]]
id = "double_rounding_is_innocuous_at_an_intermediate_width_between_f_and_2f"
statement = "Narrowing in stages through an intermediate fraction width strictly between the final width and twice it gives the same answer as narrowing directly, so a design may pick such a width and stop worrying about double rounding. It does not: no intermediate width strictly between F and 2F makes double rounding innocuous, at any F."
fails = ["fraction_width: any"]
topic = "rounding"
note = """
Established by constructive witness rather than by a sweep, which is why it \
carries a fraction width and nothing else: the construction is parametric in F \
and produces a counterexample at every one.

This is the closed half of a hole the rounding topic left open. What remains \
open is the double-rounding mechanism itself, after three wrong constructions, \
with the realisation-map topic's reduction-locality clause shown not to be at \
risk and staged-versus-direct narrowing shown to be what is.
"""
gap = """
The failing region names one axis. Under the notation an absent axis says the \
claim holds in no situation where that axis exists, so as written this row \
claims a failure only where no width, no signedness, no operation and no \
container exist, which is not what the source means. The source states the \
region as `F any` and states nothing else, and this row transcribes that rather \
than widening it. **Whether the corpus's partial regions should be read as the \
notation reads them, or as their authors meant them, is unsettled and is not a \
question a port may answer.**

No witness quoted. The construction is named in the governing files and its \
instance is not reproduced there.
"""
provenance = [
  "panel::202608072330_the-numeral-canon-panel::173_leroy_the_canon_candidate_for_the_chain::556",
  "panel::202608072330_the-numeral-canon-panel::AGREEMENTS::#13-the-chain-and-the-composite-topic-ten-files-166-through-178",
]
keywords = ["double rounding", "staged narrowing", "intermediate width", "innocuous", "grades", "composite correct rounding", "stepwise", "no threshold", "F", "fraction width"]
