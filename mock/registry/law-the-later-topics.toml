  "overflow_policy: saturating",
  "rounding: in {floor, ceil, toward_zero, half_up, half_even}: swept, every member the row names",
  "threads: threads any",
]
topic = "rounding"
evidence = ["rounding_commutes_with_the_overflow_policies"]
