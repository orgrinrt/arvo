policy and on the mode set, so one holding field over both would name \
`rounding` twice. The mode set is the five deterministic members of the ratified \
six, which is what every deterministic member names in that vocabulary.

The region is the argument's, from the clamp's endpoints being grid points, and \
is the source's `W >= 1`, written as every width. The cited instrument swept \
