# Laws established by the later five topics: the realisation map, rounding, the
# strategy object, the primitive, and the chain.
#
# A separate file from `law.toml` because that one is being written at the same
# moment for the four earlier consolidations. A row's namespace is the
# array-of-tables key and never the path, so these are the same namespace and
# every query sees both; two files only keep the merge clean. A later pass may
# refile by subject.
#
# Every row is ported from the revision that governs its topic, per
# `AGREEMENTS.md` sections 9 through 13: `122` over `119`, `136` restored by
# `138` over `132`, `151` over `146`, `164` over `161`, and `176` superseded in
# seven places by `178` over `173`.
#
# **Why so few rows, and why several carry no region.** `holds` and `fails` are
# predicates and the same axis check runs over them, so a law whose region the
# corpus states over an axis nothing declares cannot carry that region. The
# measurement is in `183_probes/`: of 64 predicate spans in the twelve governing
# files, 5 use only declared axes. `holds` and `fails` are optional and their
# absence means nobody established a region, which is the opposite of what an
# absent `predicate` entry means on a proposal, so a law can be stated honestly
# here where a proposal could not be written at all.

[[law]]
id = "fusing_a_multiply_add_preserves_the_answer_under_unsigned"
statement = "Fusing a multiply-add, so that the intermediate product is not resolved before the addition, computes the same answer as resolving it. The property is translation equivariance of the rounding position on the domain the cell reaches, so under an unsigned range policy the domain excludes the negatives where toward-zero and away-from-zero differ from their equivariant twins, and five of the six positions are free."
holds = [
  "total_width: 6",
  "fraction_width: in 0..=5",
  "signedness: unsigned",
  "overflow_policy: in {wrap, saturating}",
  "rounding: in {floor, ceil, toward_zero, away from zero, half_up}",
  "operation: multiply-add",
  "arity: 3",
  "chain_length: 2",
  "container: declared width",
  "threads: 1",
  "target_features: host aarch64-apple-darwin, rustc 1.98.0-nightly 57d06900f",
]
fails = [
  "total_width: 6",
  "fraction_width: in 1..=5",
  "signedness: unsigned",
  "overflow_policy: in {wrap, saturating}",
  "rounding: half_even",
  "operation: multiply-add",
  "arity: 3",
  "chain_length: 2",
  "container: declared width",
  "threads: 1",
  "target_features: host aarch64-apple-darwin, rustc 1.98.0-nightly 57d06900f",
]
evidence = [
  "fusion_under_unsigned_over_six_rounding_modes",
  "equivariance_is_domain_restricted",
  "the_false_unsigned_fusion_clause_and_its_repair",
]
topic = "the_strategy_object"
note = """
The failing rates at wrapping are 12.50, 12.50, 9.38, 6.25 and 3.91 percent of \
triples at F = 1 through 5, and at saturating 0.93, 1.61, 2.02, 2.18 and 2.08, \
both zero at F = 0, so the F = 0 cell of half-even belongs to the holding region \
and is left out of both fields rather than repeating `rounding` in one of them. \
The per-F figures at both policies are printed by the Rust instrument and by the \
Python one, digit for digit, which is what puts saturating in the failing \
region; the source's own prose reported the saturating half only as a range. \
The domain-restricted instrument sweeps wrapping alone, so it supports the \
holding region's equivariance reading and the wrapping half of the failing one, \
and the saturating half rests on the other two.

This region is the repair of a clause the first candidate got wrong. \
`146` section 5.5's first predicate block claimed the whole rounding axis free \
under unsigned, on a congruence argument that covers the reduction relocation \
and not the rounding relocation, and nobody had swept the unsigned half over \
six modes. Two signatures found it independently and a third instrument in a \
third language reproduced it.
"""
gap = """
No witness. The failing region is established as a rate over exhaustive triples \
rather than by a named instance, so nothing here is reproducible from the row \
alone.

The formulation is one expert's. `151` names its own exposure: the restricted \
equivariance test was decided over a window its author chose, and a clean sweep \
does not settle a property the way a counterexample settles its negation.
"""
provenance = [
  "panel::202608072330_the-numeral-canon-panel::151_leroy_the_candidate_revised_against_four_signatures::92",
  "panel::202608072330_the-numeral-canon-panel::151_leroy_the_candidate_revised_against_four_signatures::53",
]
keywords = ["fusion", "fused multiply-add", "fma", "equivariance", "translation equivariant", "rounding", "unsigned", "nearest-half-even", "IEEE default", "relocation", "free lowering"]

