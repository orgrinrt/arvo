[[question]]
id = "reduction_order_or_associativity"
key = "Q12"
asks = "Is the reduction order specified, or is associativity required?"
options = [
  "Require associativity: a fold may be split only where the operation is associative, so signed saturating folds run in one lane or under the strategy that permits a soundness trade.",
  "Specify the reduction shape as a fixed tree over the index range, independent of detected lane and core count, which makes the answer deterministic at any thread count and costs a single-core implementation a tree it does not need.",
  "Make the reduction shape part of the strategy, so the performance-first strategy splits freely and the others take the specified shape, which fits the per-strategy framing and costs an axis.",
  "Say nothing and let the answer depend on the core count, which under the soundness condition is a sacrifice for every strategy except the one whose purpose is to make it.",
]
decider = "panel"
topic = "the_chain"
unblocks = "Whether the layer above may split, thread or algebraically rewrite a reduction at all."
note = "The mechanism behind the measured sign asymmetry is contested inside the register. `42` established a reachability condition, the register quoted it in a two-bound form, and `55b` refutes the quoted form exhaustively: of 952 divergent signed-clamp triples, 448 are ceiling-only, 504 floor-only and zero involve both bounds. `55b` states its own bound: it targets the form quoted in the register rather than `42` itself, and a second read of `42` against that probe is owed. A drafting note the register carries rather than an option: wrapping's four separately-measured properties are one theorem, that the representation realises the cyclic group of its width. And a standing caution: no entry here should acquire a rewriting or equality-saturation engine, which is a domain and extraction-strategy decision arvo may not make for a consumer."
provenance = ["panel::202608072330_the-numeral-canon-panel::OPTIONS::#q12-is-the-reduction-order-specified-or-is-associativity-required"]
keywords = ["reduction order", "associativity", "reassociation", "fold", "split", "tree", "saturating", "wrapping", "clamp", "commutativity", "determinism", "threads"]

