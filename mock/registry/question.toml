# What is still open, with the options it is open between and whose call it is.
#
# Ported from the panel's live option register (`OPTIONS.md`, Q1 through Q65) and
# from the standing queue for op's seat (`156`). Both are living ledgers, so every
# citation into them is a heading anchor and never a line.
#
# Two things a reader should know before using this file.
#
# `decider` is a claim and it is the weakest field here. It is set by one
# mechanical rule, applied per row and citable: `op` only where the source says
# the question is his or records him settling it; `measurement` only where the
# source names a measurement as what closes it; `coordinator` for the calls `156`
# records as answered in op's stead; `panel` for everything else, as the default
# rather than as a finding.
#
# No answer is recorded here, including for the rows whose source records one.
# Where a question was answered, `note` says that it was and where, and never
# which way. What answers a question is a ruling or a proposal naming it, and the
# edge is drawn from that side.

# --- unit two: the format, and the questions carrying op's direction ------------

[[question]]
id = "what_then_validate_requires"
key = "Q1"
asks = "What does the acceptance criterion's \"then validate\" clause require of the typestate?"
options = [
  "Admissibility: the typestate refuses declarations it cannot serve and does not refuse ones it could, which owes a two-directional sweep and for which the panel holds no evidence.",
  "Usage: the typestate refuses operations violating the declared invariants with a readable diagnostic, which owes a diagnostic battery and for which the panel's evidence is substantial.",
  "Self-validation: the derived container is checked at derivation time to hold the declared range, which owes a range assertion per declaration and for which the panel's evidence is incidental.",
]
decider = "op"
topic = "the_format"
note = "Recorded as answered at `28` batch one, with the three parts left separable because each owes a different instrument, and with a challenge route named: a member may argue a part is truly not worth it, and that phrase is the bar. The register also carries `17`'s structural addition, that the criterion's own phrase \"no caveats left\" is a claim about the absence of a residue that no instrument can close."
provenance = ["panel::202608072330_the-numeral-canon-panel::OPTIONS::#q1-what-does-then-validate-require"]
keywords = ["validate", "validation", "admissibility", "usage", "self-validation", "acceptance criterion", "erasure", "trusted base", "diagnostic"]

