[[question]]
id = "which_carrier_the_packing_claim_is_about"
key = "Q7"
asks = "Which carrier is the claim that packing pays a claim about?"
options = [
  "An eight-byte carrier: the claim is about displacing a machine word, and against one it measures true past a threshold record count.",
  "A two-byte or four-byte carrier: against `u32` the single-core answer is false and the four-core answer is true, and against `u16` the single-core answer is false and the four-core answer, measured past the cache, is also true.",
  "No fixed carrier and no threshold: the inequality is the claim, packing paying when the bytes saved per element divided by available bandwidth exceeds the decode cost added per element, with any particular break-even figure a fact about one machine.",
  "Footprint rather than throughput: the claim is about resident memory and never was about loop speed, and the multi-fold cut in resident bytes holds whether or not a loop gets faster.",
  "Whichever regime is detected, with at least two arms behind that detection and the carrier the claim holds against differing per arm.",
]
decider = "measurement"
topic = "the_realisation_map"
note = "Op answered the regime half at `32` and the register records it as dissolving rather than selecting: the canon names no regime, so both the one-core and four-core break-even bands are correct as the two arms rather than as rivals. He marks it a ratifiable intent, which is not ratified. What remains open is measurement-shaped and named by `27` itself: writes are unpriced, every arm in both files reads only; random and strided access are unmeasured, and the prefetcher-hiding mechanism the thread turns on is specific to sequential access; and other hosts would move every crossing. The footprint option has not been priced by any file in the panel."
provenance = [
  "panel::202608072330_the-numeral-canon-panel::OPTIONS::#q7-which-carrier-is-the-packing-claim-about",
  "panel::202608072330_the-numeral-canon-panel::OPTIONS::#op-answered-the-regime-question-on-2026-08-08-32-and-it-dissolves-rather-than-selects",
]
keywords = ["packing", "carrier", "bitpack", "bandwidth", "contention", "cores", "break-even", "footprint", "resident memory", "prefetcher", "cache"]

