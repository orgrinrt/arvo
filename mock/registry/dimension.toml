# The axes a finding's region is stated over.
#
# The set is what the corpus actually varies, read off the predicates it
# writes. The fullest single one is at `109:156-159`, which names eleven axes in
# one line and is the closest thing the panel has to a declaration of the
# vocabulary.
#
# **These are design axes and not instrument parameters.** The corpus writes
# both into `holds for:` lines and the two are different things: `F = 0` is a
# region an arm can be gated on, and `regions = 6, arms in {5, 6}` says what a
# bench run happened to sweep. The second belongs on the `probe` row that ran
# it. The test is gateability, and it comes straight from I13: a predicate
# exists so that an arm can be built over the region it names, so an axis
# nothing could gate on is not one.
#
# Two width spellings are both here because the corpus uses both and they are
# not independent. See the `note` on each.

[[dimension]]
id = "integer_width"
what = "How many bits of the declared format sit above the point."
grammar = "`I = <n>`, `I in <range>`, `I in {<set>}`, or `I any`. `n` is a count of bits and the corpus stays inside 1..=64."
moves = "The representable range, and therefore whether an operation overflows at all. Several laws hold at one width and fail at the next because the intermediate stops fitting."
note = "Not independent of `total_width`: a predicate stating `W` and `F` has fixed `I` implicitly. Both spellings appear in the corpus and neither is wrong; a row states whichever its instrument varied."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::156"]
keywords = ["I", "integer width", "integer bits", "whole part", "width", "above the point"]

[[dimension]]
id = "fraction_width"
what = "How many bits of the declared format sit below the point."
grammar = "`F = <n>`, `F in <range>`, `F in {<set>}`, or `F any`. `F = 0` names the exact-integer case."
moves = "Whether an operation is exact. This is the axis the panel has dropped from a sentence three separate times, including once inside a standing workspace rule, and each time the sentence became a claim about a region it had never been established in: unsigned multiplicative structure holds at `F = 0` and dies above it."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::156", "panel::202608072330_the-numeral-canon-panel::AGREEMENTS::#6-cross-topic-agreements"]
keywords = ["F", "fraction width", "fractional bits", "below the point", "exact", "F = 0", "scale"]

[[dimension]]
id = "total_width"
what = "How many bits the declared format occupies in total, point included."
grammar = "`W = <n>`, `W in <range>`, `W in {<set>}`, or `W any`. `W in 1..=64` is the whole domain of a `u64` container and is neither a sample nor `any`."
moves = "The same thing `integer_width` moves, stated over the format as a whole. A signed format's sign bit is inside it."
note = "Redundant with `integer_width` and `fraction_width` taken together, and kept because the measurement corpus is written in it. A third notation state exists with no name: `W in 1..=64` is the entire container domain and reads as a sample, which is how a proof got recorded as a sweep that stopped at three widths."
provenance = ["panel::202608072330_the-numeral-canon-panel::106_giesen_consolidation_the_strategy_axis::324"]
keywords = ["W", "total width", "declared width", "bit width", "format width"]

[[dimension]]
id = "signedness"
what = "Whether the format carries negative values."
grammar = "`signedness = unsigned`, `signedness = signed`, `signedness in {unsigned, signed}`, or `signedness any`."
moves = "Which laws survive. The signed cell is the worst one in the corpus's own cube and is broken even at `F = 0` under clamping, and two instances sweeping disjoint values of this axis intersect to nothing, which is how a clause came to hold nowhere while reading as merely unqualified."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::156"]
keywords = ["signed", "unsigned", "signedness", "sign", "negative", "two's complement"]

[[dimension]]
id = "overflow_policy"
what = "What the operation does when a result leaves the representable range."
grammar = "`overflow policy = <name>`, `overflow policy in {<set>}`, or `overflow policy any`. Named values seen in the corpus: `wrap`, `saturate`, `saturate-both-ends`, `clamp`, `panic`."
moves = "Which family of licences is available at all. This is structural rather than incidental: no realisation map onto a container is licence-free, and the policy is what selects the family."
note = "`saturate` and `clamp` are used for the same thing in places and are distinguished in others. A row states whichever its source did; the two spellings are not asserted here to be one policy."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::157"]
keywords = ["overflow", "wrap", "wrapping", "saturate", "saturating", "clamp", "panic", "policy", "edge behaviour"]

[[dimension]]
id = "rounding"
what = "How a result that is not representable is placed on the representable grid."
grammar = "`rounding = <mode>`, `rounding in {<set>}`, or `rounding any`. `rounding = exact` names the case where nothing is discarded, which is a value of the axis rather than its absence."
moves = "Which results a chain produces, and which relocations are free. The IEEE default is the one mode that is not free under either signedness, so a design defaulting to it has every relocation unavailable at its default."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::157"]
keywords = ["rounding", "round", "truncate", "ties to even", "nearest", "IEEE", "double rounding", "grid", "quantise"]

[[dimension]]
id = "operation"
what = "Which arithmetic operation the claim is about."
grammar = "`operation = <op>`, `operation in {<set>}`, or `operation any`. Values are the operations the design ships, which is itself an open question."
moves = "Nearly everything. A law is a statement relating operations, and a claim about addition transfers to multiplication only where somebody showed it does. The corpus has twice mis-attributed a measured count to the wrong operation."
note = "`operation any` is not writable while the operation set is open, because `any` quantifies over a set nobody has closed. A row wanting it says which operations instead."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::157"]
keywords = ["operation", "op", "add", "addition", "mul", "multiply", "shift", "subtract", "operation set"]

[[dimension]]
id = "arity"
what = "How many operands the operation takes."
grammar = "`arity = <n>`, `arity in {<set>}`, or `arity any`."
moves = "Whether a claim about a binary operation says anything about the fused or n-ary form. It usually does not, and the corpus separates them."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::157"]
keywords = ["arity", "operands", "binary", "unary", "n-ary", "fused"]

[[dimension]]
id = "chain_length"
what = "How many operations run before a result is observed."
grammar = "`chain length = <n>`, `chain length in {<set>}`, or `chain length any`."
moves = "Accuracy, and which arm wins. Multiplicative chains need width growing linearly in fold length with no logarithmic closed form, and the crossing point where one accuracy arm overtakes another is itself decided by a weighting. Three separate topics reached this independently."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::157", "panel::202608072330_the-numeral-canon-panel::AGREEMENTS::#6-cross-topic-agreements"]
keywords = ["chain", "chain length", "fold", "fold length", "reduction", "depth", "accumulate", "sequence"]

[[dimension]]
id = "container"
what = "The machine storage the declared format is realised onto."
grammar = "`container = <type>`, `container in {<set>}`, or `container any`. Values seen: a machine integer type, `dense bit stream`, and a named model."
moves = "Whether an intermediate fits, and therefore whether a law's proof over exact values survives at all. One clause of a candidate was found unexecutable in 663 cells because its proof was set over exact values while the container is finite."
note = "Whether a claim is stated over the declared width or over this axis is the container premise, and it is blocking: no wording of several downstream clauses is true on both branches. See `topic::the_container_premise`."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::158"]
keywords = ["container", "carrier", "backing", "storage", "machine type", "u8", "u64", "bit stream", "packed"]

[[dimension]]
id = "alignment"
what = "Whether a packed value sits on a container boundary or straddles one."
grammar = "`alignment = aligned`, `alignment = straddling`, `alignment in {aligned, straddling}`, or `alignment any`."
moves = "The cost of a read and a write at the packed end, and whether a decode is one instruction or several."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::158"]
keywords = ["alignment", "aligned", "straddling", "boundary", "packed", "bitpack", "unaligned"]

[[dimension]]
id = "access_pattern"
what = "How the values are reached: sequentially, at random, contended between threads, or otherwise."
grammar = "`access pattern = <name>` or `access pattern any`."
moves = "Cost, and only cost. Nothing about which answer is correct depends on it, so a correctness claim leaving it out is not making the strong negative statement the notation otherwise assigns to an absent axis."
note = "Named as an axis in the corpus's own predicates and rarely varied. A cost claim that leaves it out has not established anything about a pattern it did not run."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::158"]
keywords = ["access pattern", "sequential", "random", "strided", "contended", "locality"]

[[dimension]]
id = "target_features"
what = "Which instruction-set features the compiler was allowed to use."
grammar = "`target features any`, `target features = host default`, or a named feature set."
moves = "Whether a lowering vectorises, and which instructions a backend reaches for. A measurement taken under one feature set says nothing about another."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::158"]
keywords = ["target features", "ISA", "instruction set", "SIMD", "NEON", "AVX", "vectorisation", "target"]

[[dimension]]
id = "threads"
what = "How many threads the claim was established over."
grammar = "`threads = 1`, `threads = <n>`, or `threads any`."
moves = "Nothing about single-threaded correctness, which is exactly why the axis is dangerous: work done on one thread proves `threads = 1` and nothing wider, and an absent `threads` means the claim holds in no situation where threads exist at all. `threads any` is the positive universal and has to be written; nothing infers it."
note = "arvo takes no stance on core count and runs at one, two or any finite n, so a `threads = 1` corpus is a body of real findings over a real region rather than a pile of claims awaiting rescue."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::159"]
keywords = ["threads", "thread count", "cores", "parallel", "single threaded", "concurrency"]

[[dimension]]
id = "strategy"
what = "Which strategy the claim was established under."
grammar = "`S = <name>`, `S in {<set>}`, or `S any`."
moves = "What counts as the correct answer. The strategies weigh measurements differently, so a claim about which arm is best is a claim about one strategy unless it names them all."
note = "`S any` quantifies over a set op has stated is open, so a row writing it is claiming more than the corpus can currently close. Rows naming the strategies they ran are the honest form."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::156"]
keywords = ["S", "strategy", "Hot", "Cold", "Warm", "Precise", "preset", "policy"]

[[dimension]]
id = "build_profile"
what = "Which build the claim was established under, and specifically whether debug assertions are on."
grammar = "`debug-assertions = on`, `debug-assertions = off`, or `debug-assertions in {on, off}`. Where optimisation level matters it is stated beside it as `opt level = <n>`."
moves = "Whether a binding-free distinguishing channel exists at all. One licence is false at `debug-assertions = on` and true at `off`, because the overflow panic plus a const-eval refusal is such a channel and neither exists in a release artifact. That bound is exactly the one op's own I18 draws, reached from a direction I18 was not derived from."
provenance = ["panel::202608072330_the-numeral-canon-panel::109_bellard_the_primitive_derived_cold::491"]
keywords = ["build profile", "debug", "release", "debug-assertions", "opt level", "cfg", "panic", "dev build"]
