[[probe]]
id = "the_change_test_misfiles_its_own_hierarchy_against_its_own_prose"
establishes = "Running the change-test discriminator (op's original hierarchy criterion) mechanically against the concept's own five dependency edges: the identity-domain, representable-set and reduction edges all classify as 'system' moved; the container edge classifies as 'format'; and the encoding edge is unclassified under the literal text, because the representation clause demands named values change and an encoding swap changes none. The charitable repair (dropping the values-changed conjunct) correctly files the encoding edge but then misfiles the representable-set edge, which the same source's own prose files under representation two sections earlier, as system instead."
