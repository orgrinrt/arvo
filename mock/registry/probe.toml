]
control = "The negative arm is the one that matters and it is present: an `argument` row carrying no evidence is silent. One reported row, not three. Without that arm the two positive arms would be satisfied by a checker that reports every row."
standing = "sound"
note = "The row is kept after the blocker it names is gone, because it is the evidence for why five topics' measured claims were unwritable, and the next reader meeting that gap in the audit trail needs to get from the gap to the instrument that measured it."
keywords = ["measured", "evidence", "probe", "gate", "blocked", "registry", "check", "sentence_kind", "unknown-row-reference"]

