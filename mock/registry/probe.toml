# --- what grades an accumulator: width or the reachable interval -----------

[[probe]]
id = "the_reachable_interval_composes_exactly_where_width_does_not"
establishes = "The width-growth rule g(W,V) = max(W,V) + 1 for repeated addition is not associative: g(g(5,0),0) = 7 against g(5,g(0,0)) = 6. The multiplicative rule g(W,V) = W + V is associative, so products do grade over widths where sums do not. For n operands drawn from Q = [-8, 7], the measured reachable set of exact sums equals the Minkowski sum [n*lo, n*hi] exactly at every n from 1 to 6, and the width computed by repeated max+1 is a sound but increasingly loose image of it: the slack between the exact bit count needed for the measured range and the repeated-max+1 bit count grows from 0 at n=2,3 to 2 at n=6."
lives = [
  "panel::202608072330_the-numeral-canon-panel::57_probes::p5_output.txt::1",
  "panel::202608072330_the-numeral-canon-panel::57_orchard_the_grading_and_the_refutation::#3-job-two-the-grading-second-read",
]
control = "The non-associativity of the width rule is exhibited directly by naming the two different results of the two association orders, g(g(5,0),0) versus g(5,g(0,0)), rather than merely asserted."
standing = "sound"
note = "The design consequence: the value set (the reachable interval) is what composes exactly under repeated addition; width is a derived, conservative abstraction of it that loosens with fold length. Says which of the two a canon should state as primary: the reachable set, with width as the thing an implementation computes from it."
keywords = ["grading", "grade monoid", "width", "reachable interval", "Minkowski sum", "accumulator", "associativity", "interval arithmetic", "fold length"]

[[probe]]
id = "an_intermediate_range_clamp_alone_breaks_multiplicative_associativity_at_full_precision"
establishes = "Holding the fractional axis at full guard width (zero coarsening loss anywhere in the fold) and adding an intermediate range clamp back in, the with-clamp fold still diverges from the no-clamp control: 448 of 4096 triples at fold length 3, 11528 of 65536 at fold length 4. A range clamp alone, with the coarsening mechanism entirely paid off, is a real and sufficient source of multiplicative non-associativity in its own right; it is job one's absorption/reachability mechanism, previously shown only inside additive folds, now shown acting inside a multiplicative one."
lives = [
  "panel::202608072330_the-numeral-canon-panel::58_probes::p2_multiplicative_grade_does_not_collapse.rs::1",
  "panel::202608072330_the-numeral-canon-panel::58_probes::p2_output.txt::20",
]
control = "The no-clamp arm at the same full guard width is the control: it measures zero divergence at every fold length checked, so the with-clamp arm's non-zero counts are attributable to the clamp and not to residual fractional loss. The output states the check directly: at every guard width measured, with-clamp divergence is greater than or equal to no-clamp's, i.e. the second mechanism only adds failures, never substitutes for the first."
reproduced = "None. One instrument, one author."
defect = "The result was first produced by accident: an earlier version of this probe clamped the accumulator at every fold step even at full guard width, which should be impossible to distinguish from exact integer multiplication and instead reported a wrong-looking divergence. The raw output is kept as `58_probes/p2_output.v1_bug.txt` rather than deleted. Re-read rather than dismissed, the 'bug' was the finding: clamping every step is exactly what an intermediate range clamp is, and it is a second, independent lossy mechanism the fractional-axis probe had not isolated from coarsening."
standing = "sound"
note = "This corrects a misreading of an earlier probe (`probe::which_factor_of_a_reduction_breaks_the_semiring`, `57_probes/p4`'s `ClampOnly` arm), which reads as isolating range-clamping's contribution at nonzero fraction width but is, by inspecting its own source (`match self.factor { Factor::ClampOnly => (a * b).clamp(0, self.m), ... }`, the multiply never reads the fraction shift), the `F = 0` case under a label that implies the other. No claim in this registry currently asserts clamping is innocent at `F > 0` from that probe (nothing cites it as evidence), so this is a correction of a reading that had not yet propagated rather than a retraction of a stamped claim; still worth recording because the mislabelled arm is easy to re-cite as though it tested what its name says. This probe is the corrected, controlled version of that same question, isolated the other direction: coarsening held at zero, clamp varied."
keywords = ["multiplicative", "associativity", "range clamp", "coarsening", "independent mechanism", "absorption", "fold", "F = 0"]

[[probe]]
id = "absorption_and_coherence_ext_agree_exactly_when_the_second_operand_is_representable"
establishes = "Absorption (a fold's later operand reduced once, at the end) and coherence-ext (both operands independently reduced before combining, the literal reading of an existing coherence law) disagree on exactly the configurations where the operand box extends outside the representable set Q, and never otherwise. Addition: 252 of 4248 configurations disagree, all 252 with a box element outside Q, zero when the box is a subset of Q; a widened 7744-configuration sweep at wider boxes and tighter clamps reproduces the identical partition at 220 disagreements. Multiplication: 240 of 4248, reproduced at 206 of 7744, same partition. Where they disagree, coherence-ext is the one wrong against measured associativity (matches on exactly the same 252/240/220/206 configurations it disagrees with absorption on); absorption matches measured associativity on every configuration in both sweeps, zero mismatches."
lives = [
  "panel::202608072330_the-numeral-canon-panel::61_probes::q1_absorption_versus_coherence.rs::1",
  "panel::202608072330_the-numeral-canon-panel::61_probes::q1_output.txt::1",
]
control = "Two independent checks against ground truth are stated per row: whether absorption and coherence-ext agree with each other, and whether each agrees with directly measured associativity. A boolean partition on 'box subset of Q or not' is checked against the disagreement set on every configuration in two differently-shaped sweeps (4248 and 7744 configurations), not sampled; both reproduce the identical partition, which is the case that had to fail (a sweep finding disagreements NOT confined to the outside-Q partition would have refuted the mechanism claim)."
standing = "sound"
note = "A second, weaker and distinct mechanism is also measured: instantiating an existing literal window-based coherence law (`56_probes/q1`'s own shape) directly at a configuration's own box disagrees with absorption far more often (681 of 4248 for addition), including 429 times even where the box is entirely inside Q. That is a domain-size defect (the window-restricted check never examines values the fold's reachable sum can actually take), distinct from and in addition to the reduced-operand mechanism above; it is a caution about a naive instantiation rather than the crux of this finding. Every arvo numeral in memory is format-typed, i.e. already an element of the representable set by construction, so a real fold operand always satisfies the condition under which absorption and coherence-ext collapse to one law; the two laws separate only for a synthetic operand that could not occur in a real fold."
keywords = ["absorption", "coherence", "coherence-ext", "reduced operand", "representable set", "Q", "partition", "fold", "associativity"]

[[probe]]
id = "a_wide_exact_fold_with_one_final_narrow_is_correctly_rounded_where_staged_narrowing_drifts"
