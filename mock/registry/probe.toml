# --- the rounding axis, files 122 to 138 ------------------------------------

[[probe]]
id = "rounding_is_vacuous_at_zero_fraction_width"
establishes = "Over scaled-integer operands at W = 5, with the rounding mode varied over floor, ceiling, toward-zero, half-up and half-even and no overflow policy applied, the choice of mode changes no answer for addition, subtraction and multiplication at F = 0, and none for addition and subtraction at any F. Division is the residue at F = 0."
lives = [
  "panel::202608072330_the-numeral-canon-panel::125_probes::p2_vacuity_and_v2_predicate.py::1",
  "panel::202608072330_the-numeral-canon-panel::125_probes::p2_output.txt::1",
]
control = "Two, both stated in the output line beside the figure they qualify, and both fired. Multiplication at F = 2, W = 5 must show mode-differing cells or the sweep cannot see a rounding difference at all: 512 of 1024, signed and unsigned. And division at F = 0 must differ between floor and toward-zero, which is the must-fail arm: 386 of 992 pairs."
standing = "sound"
note = "The overflow axis is deliberately outside this instrument: no overflow policy is applied, because the claim is about the quantisation step alone. A reader taking this as a statement about a range-limited type is taking it past what it swept."
keywords = ["rounding", "vacuous", "fraction width", "F=0", "quantisation", "division", "mode", "scaled integer", "exhaustive"]

[[probe]]
id = "rounding_commutes_with_the_overflow_policies"
establishes = "At W in {3, 4, 5} over exact points at sixteen subquanta per quantum, wrapping commutes with floor, ceiling, half-up and half-even and fails to commute with toward-zero, and saturating commutes with all five deterministic modes."
lives = [
  "panel::202608072330_the-numeral-canon-panel::125_probes::p3_commutation_with_overflow.py::1",
  "panel::202608072330_the-numeral-canon-panel::125_probes::p3_output.txt::1",
]
control = "Two must-fail arms, both fired and both printed with the count. Wrapping against toward-zero had to mismatch, and does, at 240 of 625 at W = 3 rising with width. And for saturating, an artificial boundary-violating mode that maps off-grid values just under the maximum to above the range had to mismatch, and does, at 15 of 497. Without the second arm the saturating result would be a row of zeroes from a sweep that might not reach the boundary at all."
