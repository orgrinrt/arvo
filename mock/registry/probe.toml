# --- the instruments about this repository's own instruments ---------------
#
# Four rows that are not about numerals at all. They are about the harness, the
# test gate and the checkers, and they are here because a `measured` claim
# citing anything in `mock/benches/` inherits every one of them.

[[probe]]
id = "the_bench_tree_was_built_at_the_undocumented_profile"
establishes = "The bench harness builds every variant and the bench binary with a plain release build and no profile flags, none of the variant manifests declares a profile, the bench root declares none, and no cargo config supplies one. So the whole bench directory was built at cargo's default release profile, `lto = false` and `codegen-units = 16`, rather than the fat-LTO one-codegen-unit profile the harness's own scaffolding documents."
lives = [
  "panel::202608072330_the-numeral-canon-panel::117_dispatcher_note_the_bench_profile_and_the_tests_that_cannot_run::#the-second-defect-which-is-the-serious-one-the-documented-profile-is-not-set-anywhere",
]
control = "None run, and the shape does not admit an obvious one: the finding is three greps returning zero and a fourth returning the documented values from the scaffolding, so the failing case is a profile declaration existing somewhere unlooked-at. What stands in its place is that the zero-returning greps are printed with their commands and the file paths they searched, so a reader re-runs them rather than trusting the count."
standing = "sound"
defect = "None in the instrument. Its own containing note carries a correction to a neighbouring claim, made an hour after first writing and left visible: it had called the variant test surface untested, in a panel whose members had run those tests ten times, and the real defect is smaller and differently shaped."
note = "The consequence for this namespace is direct. `codegen-units = 16` partitions unstably across builds, so two runs of the same unchanged variant can differ in inlining and layout, which is the contamination the per-variant isolation exists to prevent. It does not say any particular finding is wrong. It says every number in that directory was taken under a profile nobody recorded, and which findings rest on a harness artifact is a pass nobody has done."
keywords = ["bench", "profile", "lto", "codegen-units", "release", "harness", "variants", "reproducibility", "documented profile"]

[[probe]]
id = "no_bench_artifact_records_its_build_profile"
establishes = "Of the meta files beside the committed bench results, none records an optimisation level, an LTO setting, a codegen-unit count or a cargo profile. Each carries cpu, os, rustc, git_commit, timestamp, counter_freq and framework, and all but one record a git commit marked dirty."
lives = [
  "panel::202608072330_the-numeral-canon-panel::185_probes::p5_build_profile.sh::1",
  "panel::202608072330_the-numeral-canon-panel::185_probes::p5_build_profile.out::1",
]
control = "C4: a synthetic meta carrying a `profile` field is planted and the same grep must find it, or a zero over the real files is a fact about the grep. It is found. Plus C3, which plants six command lines and checks that `-O` and `opt-level` count as naming a profile while `--emit asm`, `cargo test`, `--crate-type` and `nm -g` do not."
standing = "sound"
note = "This is the mechanical half of the row above. That one establishes what profile the tree was actually built at; this one establishes that the artifacts cannot say. `build_profile` is a declared axis, and under the absence rule a result that cannot name it holds at no profile at all. The dirty-tree count is the second half of the same problem: a result whose commit is dirty cannot be tied to a tree either."
