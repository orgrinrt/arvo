]
control = "Four arms, stated in the header before the run, two of which had to fail. The long slice had to return the wrong answer, or the hand-chosen accumulator was wide enough all along and there is no gap to measure; it returns 224 where the answer is 480. The insufficient capacity had to be refused at compile time rather than merely computing badly; it aborts with `evaluation panicked: accumulator too narrow for this capacity`. The two positive arms had to be correct, or the miniature does not model the arithmetic it claims to."
defect = "The first run compiled the refusal arm and reported it as passing, because the offending constant was `pub` and unreferenced, and an inherent associated const is evaluated only where it is forced. The arm proved nothing and read exactly like a proof. Kept as `p1_v1_arm_d_never_forced.out` rather than deleted, since it is the same defect a neighbouring member file had already named in the abstract, biting the author who named it. The fix is one call that forces the const."
standing = "sound"
note = "A miniature rather than the real numeral: `Num<W>` carries a W-bit unsigned value in a `u32` and masks on every add, so the declared width cannot silently borrow bits it does not have. That models the width algebra and nothing else, which is what the question needs, and it means the figures are about the algebra rather than about any shipped type. One width, unsigned, addition."
keywords = ["fold", "accumulator", "capacity", "runtime length", "widen", "arm E", "const eval", "refusal", "E0080", "guard bits"]

[[probe]]
id = "bench_corpus_never_validates_its_own_arms"
establishes = "Across the whole committed bench corpus (214 CSVs, 82,960 rows) the digest fidelity column is zero in every row: no committed bench run has ever cross-checked that its timed arms compute the same answer. The gap is not cosmetic: the harness's own findings generator surfaces an arm that LLVM proves absorbing after 3 of 1024 iterations, 48 to 66 times past the M1's physical roofline, and recommends it in prose as the dominant strategy."
lives = [
  "panel::202608072330_the-numeral-canon-panel::20_fog_what_the_benches_already_know.md::#21-six-committed-cells-are-physically-impossible-and-the-harness-recommends-them",
  "panel::202608072330_the-numeral-canon-panel::20_fog_what_the_benches_already_know.md::#23-the-fidelity-checks-did-not-run-in-any-of-the-147",
  "panel::202608072330_the-numeral-canon-panel::22_xu_the_bench_that_was_missing.md::#seven-the-fidelity-check-and-i-was-wrong-in-section-zero",
  "panel::202608072330_the-numeral-canon-panel::22_xu_the_bench_that_was_missing.md::#demonstrated-not-argued",
  "panel::202608072330_the-numeral-canon-panel::22_xu_the_bench_that_was_missing.md::#fixed-in-the-consumer-and-demonstrated-firing",
  "panel::202608072330_the-numeral-canon-panel::41_dispatcher_note_no_bench_here_has_ever_checked_its_answers.md::#the-measurement",
]
control = "The corpus-wide sweep (41) sums the digest column across every committed CSV; a nonzero sum anywhere would have refuted the claim, and the sum came back exactly zero across all 82,960 rows, both for instructions and cycles and digest together. Independently, 22 states the positive control in advance: once `run_worker_validate` is wired into `run_orchestrator`, an injected one-character bug (`rem >= 4` changed to `rem > 4`, corrupting W=160 while every other width, exit code and digest stayed clean) had to be caught, and it was caught."
reproduced = "Three files, three methods, one conclusion. 20 found it by reading the harness source against the CSV schema. 22 found the same gap independently, then rebuilt the missing validation path and demonstrated it catching a real injected defect. 41 re-swept the entire corpus after both, mechanically, and confirmed zero held everywhere rather than only in the files 20 and 22 happened to look at."
defect = "Root cause, found in 22: `run_orchestrator` never calls `validate`, and the function that would (`run_worker_validate`) is not re-exported from the crate root, reachable only through `pub mod harness`. So every bench that ran under the orchestrator path was structurally unable to populate the digest column, whatever its arms actually computed."
standing = "sound"
note = "The smoking-gun instance is the `precise-container-width-l1_*` family's `warm-container-kernel` arm: 3.3 to 4.2ns/call, 12,365 to 17,022 Gops/s against a roofline of about 256 Gops/s, caused by LLVM proving a saturating fixpoint absorbing after 3 of 1024 loop iterations (an interval-arithmetic proof, verified in 22 by three predictions stated in advance and all holding). The harness's own statistics text recommends it: \"warm-container-kernel dominates: 190167% faster than the next best.\" The control is not systemic: the identical arm in the sibling family `warm-container-width-l1` sits mid-pack (946.7ns, third of six), so this is one family and configuration rather than every committed number being suspect. 41's corpus-wide predicate (arm mean at least 50x below the next best in its own file) fires exactly six times, all the same family and arm, at ratios 844x, 839x, 688x, 607x, 566x and 318x."
keywords = ["digest", "fidelity", "validate", "run_orchestrator", "run_worker_validate", "roofline", "absorbing fixpoint", "interval arithmetic", "190167%", "warm-container-kernel", "positive control"]
# --- delivery form of a packed-access gather ---------------------------------

[[probe]]
id = "a_packed_access_gather_written_as_a_loop_collapses_at_width_18"
establishes = "For a packed-sequence access gather compared against a hand-written twin across widths 1 to 128 (matrix run to 48, robustness swept to 4096 elements): written as a loop over an associated const access-byte-count, the typed arm's instruction shape matches the hand arm at every width at or below 17 and stops matching at 18 and above, where it collapses to one accumulator and one element per iteration (11 instructions against the hand arm's 34 at W=19, a serial reduction chain of 6 dependent instructions per element against 2). Fewer instructions and worse code: the recurrence, not the opcode count, is what regressed. Delivering the identical access as a trait-supplied gather with one impl per access width (no loop over the const) erases against the hand-written twin at all 36 of 36 widths tested, including the whole band from 18 up, and recovers the accumulator split (5 against 1 at W=19). A third form, a single fixed 8-byte load plus a shift, does not erase at most widths (it is different code, often better: 14 instructions against 43 at W=8) and at W=47 is the only arm that avoids serialising onto one accumulator, beating even the hand-written twin."
lives = [
  "panel::202608072330_the-numeral-canon-panel::51_probes::v3_matrix.out::1",
  "panel::202608072330_the-numeral-canon-panel::51_probes::fixed_gather.out::1",
  "panel::202608072330_the-numeral-canon-panel::51_probes::robustness.out::1",
  "panel::202608072330_the-numeral-canon-panel::51_probes::gen_access_control.py::1",
  "panel::202608072330_the-numeral-canon-panel::51_probes::gen_fixed_gather.py::1",
  "panel::202608072330_the-numeral-canon-panel::51_fog_the_packed_sequence_erasure_arm::#4-the-erasure-claim-was-a-sampled-law-and-it-breaks-at-width-eighteen",
  "panel::202608072330_the-numeral-canon-panel::51_fog_the_packed_sequence_erasure_arm::#5-the-mechanism-and-the-control-that-refuted-my-first-attribution",
  "panel::202608072330_the-numeral-canon-panel::51_fog_the_packed_sequence_erasure_arm::#6-two-attacks-both-of-which-land-and-neither-changes-what-a-consumer-writes",
]
control = "Two controls, stated before the run, isolate what the boundary responds to. The first (`gen_access_control.py`) holds W fixed at 13 and sweeps the access-byte count from 1 to 8, expecting divergence if access count alone drove the collapse; it found none, because at W=13 the extra bytes are masked away and LLVM proves the loads dead, which the probe reports as a failed control rather than as a result and moves on from. The second (`gen_fixed_gather.py`) holds the gather shape fixed at 8 bytes across three code forms (loop, flat, wide-load) and sweeps only W; this is the control that fired, and it isolates the collapse to the conjunction of loop-written form and W >= 18 (equivalently, live access window >= 4 bytes): `flat8` does not collapse at any width, `loop8` does not collapse below 18, `loop8` collapses at and above 18. Robustness swept two optimisation levels, `target-cpu=native`, and element counts from 64 to 4096; the accumulator-count metric held stable across every configuration except `-Os`, which is reported separately as degenerate because nothing unrolls there and the metric cannot distinguish the arms."
defect = "The instrument's first headline (\"erases at 18 of 36 widths\") was itself a sampled law and its own author caught it: at n=4096 the typed arm also differs from the hand arm at four widths below 18 by emitting one fewer instruction and one fewer load on the same accumulator count, which is an improvement misread as a regression by a same/different metric. The accumulator-count metric replaces it because it names a regression rather than a difference."
standing = "sound"
note = "The panel's original single-width evidence for the erasure claim sat at W=13, which the sweep found is on the working side of a boundary nobody knew existed, by luck rather than design (W=13 was chosen for being coprime with 8, cycling the bit phase through every offset). Packing against not packing is separately named unpriced: the packed arms run 34 to 43 instructions with five accumulators against an unpacked walk's 49 instructions with zero identified accumulators, and the two touch different amounts of memory, so the comparison needs the bench harness rather than an instruction count."
keywords = ["packed access", "gather", "loop", "accumulator", "collapse", "erasure", "sampled law", "delivery form", "trait-supplied", "wide load", "recurrence", "W=18"]

# --- encoding as a separate axis from the denoted value set -----------------

