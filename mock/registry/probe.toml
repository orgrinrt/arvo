standing = "sound"
note = "The direct evidence behind proposal::raw_order_agreement_holds_for_monotone_encodings_not_only_unsigned and behind law::no_bijective_signed_encoding_has_both_raw_order_and_raw_adder_correctness's raw-order half; the adder-correctness half of that law comes from a separate probe (56_probes/q3_signed_encoding_trade.rs)."
