# --- the fusion mechanism, files 141 to 143 ---------------------------------

[[probe]]
id = "translation_equivariance_is_the_fusion_mechanism"
establishes = "Writing the exact rational x for a multiply scaled by 2^F and an integer addend c, the stepwise form round(x) + c and the one-round form round(x + c) agree for every x and c exactly when the rounding position is translation equivariant over the integers. Floor is, and confirms at zero differing inputs in every cell; toward-zero is not, and its failure is fully characterised by where the argument is negative and non-integral."
lives = [
  "panel::202608072330_the-numeral-canon-panel::141_probes::p3_the_missing_ulp_is_a_rounding_move.rs::1",
  "panel::202608072330_the-numeral-canon-panel::141_probes::p3b_the_mechanism_control_corrected.rs::1",
  "panel::202608072330_the-numeral-canon-panel::141_probes::p3c_translation_equivariance_is_the_mechanism.rs::1",
  "panel::202608072330_the-numeral-canon-panel::141_probes::p3c_out.txt::1",
]
control = "Two earlier mechanism guesses were refuted by this instrument's own controls, which is why there are three versions and all three are kept. The final one does not guess: it derives the equivalence condition and then checks the derivation, so the arms are a proof and its verification rather than two hypotheses raced against each other."
