[[probe]]
id = "a_widening_operation_cannot_be_folded"
establishes = "A fold cannot take a widening operation. Four independent formulations of a widening fold over a runtime-length slice are refused by rustc, each because the accumulator's type after one step is not its type before. The wall is the runtime trip count: the same widening operation folded over a static-length list compiles, as does a closed operation over a runtime-length slice."
lives = [
  "panel::202608072330_the-numeral-canon-panel::35_probes::p1_fold_cannot_widen.rs::1",
  "panel::202608072330_the-numeral-canon-panel::35_probes::p1.out::1",
]
control = "Four positive arms, and all four compile clean in the same run: a widening operation in a fixed-arity expression, the same over a static-length list, a closed operation in a runtime-length loop, and a closed operation into a separately named wider accumulator. They are what locates the boundary. Without them the result reads as widening never working, and the actual wall, the trip count rather than the widening, would be invisible."
standing = "sound"
note = "A compiled refusal rather than a count, so it carries no magnitude and needs none. The four refused arms report one diagnosis between them, which is what says they are one wall met four ways rather than four separate defects."
keywords = ["fold", "widening", "closed operation", "accumulator", "trip count", "loop-carried", "compiled refusal", "capacity", "E0308"]

