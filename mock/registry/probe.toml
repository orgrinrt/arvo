[[probe]]
id = "monotonicity_and_absorption_are_two_properties_and_a_reserved_top_buys_one"
establishes = "A min-plus shortest path needs two properties from the arithmetic and a numeral can have one without the other. Over the same instance sets, at unsigned integer widths 3 and 4, three overflow policies are compared on all three questions at once: whether the top absorbs, whether addition is monotone, and whether the routine returns the exact answer. Wrapping fails absorption at 15 of 16 cells and monotonicity at 680 of 2176 triples, and is wrong on 48.08% of 621,961,320 in-range instances. Saturation reports zero on all three. A numeral wrapping in its interior below a reserved absorbing top buys absorption outright, at 0 of 16, and still fails monotonicity at 560 of 2176 and returns a wrong answer on 12.57% of the same instances."
lives = [
  "panel::202608072330_the-numeral-canon-panel::35_probes::p9_reserved_top.rs::1",
  "panel::202608072330_the-numeral-canon-panel::35_probes::p9.out::1",
  "panel::202608072330_the-numeral-canon-panel::35_probes::p9.err::1",
]
control = "Saturation is the arm that had to come out differently and does, reporting zero on all three questions at both widths while the other two report non-zero on all three. So the instrument can separate the properties rather than measuring one thing three ways. The in-range control is the same one the neighbouring sweep uses: an instance counts only where the exact answer and every intermediate fit in range, so a disagreement cannot be range exhaustion. **The probe was written to refute its own author's proposal**, by the author, and its header says so before the code."
standing = "sound"
note = "The reserved-top policy is not a shipped shape and never was. It was offered in an earlier draft as a way to serve two consumers with one spent value, offered without being built, and this is the instrument that killed it. Its corpse is what makes the row worth keeping: it is the only measured point separating the two properties, because it is the only policy that has one and not the other."
keywords = ["monotonicity", "absorbing top", "min-plus", "shortest path", "reserved top", "wrapping", "saturation", "relaxation", "infinity", "two properties"]

[[probe]]
id = "a_runtime_length_fold_compiles_at_every_length_and_computes_at_one"
establishes = "A fold whose accumulator width is written by hand rather than derived from a capacity compiles at every slice length and is correct only up to the length its author guessed: the same function over the same types returns 240 against an exact 240 at length 16 and 224 against an exact 480 at length 32, with nothing recompiled and only the length moved. The capacity-derived shape returns 480 at capacity 32, and at capacity 64 with an 8-bit accumulator is refused during const evaluation. So the compiling and the computing come apart precisely at the point where a bound stops covering the count."
lives = [
  "panel::202608072330_the-numeral-canon-panel::199_probes::p1_arm_e_compiles_and_does_not_compute.rs::1",
