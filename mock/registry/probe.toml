  "panel::202608072330_the-numeral-canon-panel::73_probes::p1c_output.txt::1",
]
control = "A positive arm that this row's first wording failed to name, and which is what makes the zeros mean anything: the mutation set is shown to be detectable, breaking the HONEST declaration's verdicts in 3 of the 4 cases, so the collapsed column's zeros are a fact about the collapsed declaration rather than about a checker that notices nothing. One of the four, `honest saturate`, is labelled the control in the source. Its header is also the clearest statement of the principle in this corpus: a row that cannot fail is not a measurement, and the way to show it cannot fail is to corrupt what it is nominally about and watch it not notice. The predecessor reported zero coherence and zero monotonicity failures for every collapsed declaration, and this one says that number is worth nothing until somebody tries to make it nonzero."
