[[probe]]
id = "a_two_axis_strategy_resolve_rule_is_checked_as_a_semilattice_join_at_compile_time"
establishes = "A strategy-resolution rule, modelled as pointwise max over a genuine two-axis product order (not a single linear ranking) using generic axis labels rather than the current Hot/Warm/Cold/Precise names, satisfies commutativity, associativity and idempotence, checked as const trait-bound assertions at compile time over three named strategy points forming a non-trivial join structure."
lives = ["panel::202608072330_the-numeral-canon-panel::77_probes::probe3_strategy_resolve_lattice.rs::1", "panel::202608072330_the-numeral-canon-panel::77_probes::probe3_output.txt::1", "panel::202608072330_the-numeral-canon-panel::77_probes::probe3_negative_output.txt::1"]
control = "A second construction (probe3_negative_check.rs) replaces the join with a rule biased toward the left operand's overflow axis, which is not a genuine join. The same commutativity const-assertion then fails to compile, `evaluation panicked: assertion failed: <P00 as Resolve<P12>>::OVERFLOW_RANK == <P12 as Resolve<P00>>::OVERFLOW_RANK`, confirming the check bites when the resolution rule is not order-independent."
standing = "sound"
note = "Deliberately models two independent axes with a product order rather than one linear ranking, because a single-ranking probe would only check the easy case. Uses generic axis labels (A0..A2), not the current strategy names, per I1's open strategy set. This is a first mechanically-checked instance on Q27 (which strategy's laws govern a cross-strategy operation), flagged by its own author as a candidate item for that question rather than a settlement of it."
keywords = ["strategy resolution", "cross-strategy", "join", "semilattice", "commutativity", "associativity", "idempotence", "product order", "compile-time", "Q27"]

[[probe]]
id = "additions_chain_error_is_zero_by_closure_while_multiplications_plateaus_at_twice_one_step"
establishes = "Under a fixed-point accumulator, a chain of additions on a decaying input pays no extra rounding cost beyond a single one-step bound regardless of chain length (extra error stays at exactly zero, n = 1 through 256), while the naive per-step-rounded multiplication chain on the same input plateaus at exactly twice the one-step bound from n = 16 onward and never grows further. A widened accumulator pays zero extra error for every n by construction, one rounding cost at the end rather than one per step."
lives = ["panel::202608072330_the-numeral-canon-panel::77_probes::probe1_chain_error.py::1", "panel::202608072330_the-numeral-canon-panel::77_probes::probe1_output.txt::1"]
control = "The growth-ratio check compares naive_ratio[n] against naive_ratio[n/2] across successive doublings: a climbing ratio would show unbounded growth, a plateauing ratio (measured: 2.000 from n=16 to n=256, factor 1.000) shows the naive strategy saturates rather than diverging without bound. The wide strategy's zero-error-by-construction column is the negative control the plateau is read against."
standing = "sound"
note = "A second, qualitative table in the same source file (not backed by a separate committed output file, reported as a narrative table inside `77_amin_derived_laws_derived_cold.md:213`) reports the same construction is non-monotonic and can spike sharply for an input near one raised to increasing powers, fluctuating 4.0, 0.0, 2.0, 4.0, 2.0, 2.0 and then jumping to 130.0 one-step-bound multiples at n = 4096. That figure is weaker evidence than this row's own committed output: it is hand-transcribed prose inside a committed markdown file rather than a raw script output, so it is reported here as colour rather than as part of what this probe establishes."
keywords = ["chain error", "fixed-point", "addition", "multiplication", "rounding", "plateau", "closure", "widened accumulator", "non-monotone"]
