[[probe]]
id = "the_licence_family_biconditional_fails_in_one_direction"
establishes = "Of the three directions a claimed biconditional decomposes into, two hold with no counterexample and one fails: a licence holding implies the boundary-function family has one member, a family above one implies the licence refuses, and a family of one does NOT imply a licence holds. The counterexample is the chain `+97 *3 +13` under round-to-8, where both the algebra licence and the range licence refuse and the family has one member."
lives = [
  "panel::202608072330_the-numeral-canon-panel::177_probes::p1_licence_family_biconditional.py::1",
  "panel::202608072330_the-numeral-canon-panel::177_probes::p1_output.txt::1",
]
control = "K3: on every cell where a licence holds the family must be one, which passes over the two such cells. Without it the failing direction would be unattributable between a real asymmetry and an instrument that reports refusals everywhere."
standing = "sound"
note = "The failing direction is the one the repair does not need, which is why this is an amendment to two words rather than a refutation. The words are `exactly` and `precisely`, and the instrument exists because somebody decomposed a sentence into its three implications before believing any of them."
keywords = ["biconditional", "licence", "family", "counterexample", "converse", "deletion", "algebra licence", "range licence", "exactly"]
