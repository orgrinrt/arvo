  "panel::202608072330_the-numeral-canon-panel::175_probes::clause23::clause23.py::1",
  "panel::202608072330_the-numeral-canon-panel::175_probes::clause23::clause23.out::1",
  "panel::202608072330_the-numeral-canon-panel::175_probes::clause23::README.md::1",
]
control = "Three, all reported with their required verdict. C-A: an identity resolution must give exactly one distinct boundary function on every chain, or the enumeration is counting placements rather than functions. C-C: more than zero chains must show a family. C-D: more than zero inputs must actually differ at the boundary, or the families differ nowhere anybody can observe, at 30 of 256."
