[[obligation]]
id = "a_primitive_for_every_position_a_bare_number_would_take"
need = "A primitive of arvo's own for every public API position across the stack where a bare integer, float, bool or platform-sized index would otherwise sit, so that no such position anywhere in the stack has to fall back on the machine's own types."
consumer = "any, and the whole stack by rule"
why = "The constraint forbids the bare types at those positions and is enforced by lint, so it is a demand on arvo whether or not anyone states it as one: every position it closes is a position arvo has to have something for. A rule that forbids without supplying is a rule consumers cannot follow."
gap = "**This is the widest obligation here and it was enumerated nowhere**, because it comes from a prohibition rather than from a consumer naming a want, and the enumeration was built by reading what consumers ask for. It is not satisfied by counting the primitives that exist: it is satisfied by the positions, and nothing has enumerated those. One consumer's error type already produced a narrower version of it, recorded separately as the platform-sized unsigned integer."
topic = "the_format"
provenance = ["panel::202608072330_the-numeral-canon-panel::INTENTS::#i14-the-operating-constraints-which-are-rules-as-much-as-intents"]
keywords = ["primitive", "bare", "u8", "u32", "u64", "i32", "f32", "f64", "bool", "usize", "public API", "position", "no bare primitives", "stack's own"]

[[obligation]]
id = "the_surface_expressible_as_contracts_before_anything_implements_it"
need = "Every part of arvo's surface stated as a trait contract that holds and is checkable before an implementation of it exists, so a consumer can build against the shape while the implementation behind it is unfinished."
consumer = "any, and hilavitkutin as the live instance"
why = "Op names the contract structure as a paradigm arvo keeps, for the reason that it lets the shapes stick while implementations are still in progress, and he names a consumer that is in exactly that condition now. So what is owed is not merely that traits are used, but that the surface is expressible as contracts first and implementations second."
gap = "One place enforces where traits may live, which is narrower than the paradigm and does not reach the surface as a whole. Nothing here says what a contract has to carry to be usable before its implementation exists, and no row anywhere establishes that the surface can be stated that way."
topic = "arvo_identity"
provenance = ["panel::202608072330_the-numeral-canon-panel::181_op_the_canon_becomes_a_registry_and_the_contracts_hold::#181-op-the-canon-becomes-a-registry-the-contracts-hold-and-this-runs-to-a-finished-canon"]
