[[obligation]]
id = "the_unstable_machinery_does_not_reach_a_consumer"
need = "A consumer naming arvo's types needs no unstable compiler features, no nightly-only attributes and no feature gates of its own, whatever arvo uses internally to build them."
consumer = "kolli, and every crate in the stack by the same reasoning"
quote = "The numerics come from arvo, the workspace's numeric substrate, and every crate here takes it. arvo's unstable machinery stays inside arvo, so a crate naming these types needs no feature gates of its own. (kolli, `mock/DESIGN.md.tmpl`, on `dev`)"
why = "The consumer states it as a property it depends on rather than as a hope, in the sentence that adopts arvo across every one of its crates, so adopting arvo at all rests on it. It is also the strongest form of the containment question the corpus argues about from arvo's side: a consumer has said what it needs the answer to be, which no other row about unstable features has."
gap = "**Nothing in the registry is about this**, and it is not implied by anything that is. It bounds what arvo may use internally by what leaks, which is a constraint on the implementation of every arm the canon proposes rather than on any one of them, and no proposal here states whether it holds. The one measurement adjacent to it is the pin's own feature list, which says what arvo uses and nothing about what escapes to a caller. Whether a `generic_const_exprs` bound in a public signature can be hidden from a consumer at all is exactly the open question, and it is unmeasured."
