# What arvo is asked for, in the asker's own terms.
#
# Read from outside the canon on purpose: a check that walks the canon can only
# report that the canon agrees with itself, so the enumeration has to come from
# somewhere the canon does not reach. This is the instrument behind op's bar
# that the canon be exhaustive enough for a full design and a full
# implementation to follow from it.
#
# **Whether an obligation is met is derived and is never stated here.**
# `refsto(obligation::<slug>)` reports what points at it, and an empty result is
# the finding. A proposal alone does not meet one: a proposal is proposed rather
# than met, and reporting it otherwise closes a gap op has never seen.
#
# **The names in the sources are the deleted crate tree's and none of them
# appear below.** Every row is the need the consumer states in its own words.
# Where a consumer names a crate and never says what it is for, no row exists
# and `184` records the gap.
#
# An absence here means nobody has enumerated it, never that arvo does not owe
# it. `184` says exactly what was read.

# --- what the engine's plan chain asks for ------------------------------------

[[obligation]]
id = "set_operations_over_a_fixed_size_bit_set"
need = "Union, intersection and difference over sets of a size fixed at compile time, for a scheduler's read and write sets and for the dirty masks its plan ends on."
consumer = "hilavitkutin, and vehje for a compiler's artifact read and write sets"
why = "Two steps of a twelve-step plan chain rest on it, and the same surface is asked for again by a different consumer for a different purpose, which is what makes it an obligation rather than one consumer's convenience."
topic = "arvo_identity"
provenance = ["panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#what-hilavitkutin-asks-for", "panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#what-vehje-asks-for"]
keywords = ["set", "sets", "bitmask", "bit set", "mask", "union", "intersection", "difference", "read set", "write set", "dirty mask", "access set"]

