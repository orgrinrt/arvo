# --- the one that is not a type -------------------------------------------------

[[obligation]]
id = "a_build_flag_that_changes_float_semantics"
need = "A cfg a consumer's build system sets, under which arvo's float semantics change."
consumer = "hilavitkutin"
why = "Its rustc wrapper emits exactly one cfg and this is it, on the consumer's own account, and a pragma in the consumer's source is what turns it on."
gap = "This is a live dependency and a hazard at the same time, and the row records the first without endorsing the second. The panel has measured the other direction: one source one flag apart gives one type name two policies, and a compile-time check cannot catch it, because each build emits one lowered path and satisfies the check while the denotation differs between builds. Whether arvo should carry such a surface at all is a design question no row here answers."
topic = "binding_time"
provenance = ["panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#the-one-that-is-not-a-type-at-all"]
keywords = ["cfg", "build flag", "fast math", "unsafe-fp-math", "float semantics", "pragma", "rustc wrapper", "denotation", "one lowered path", "soundness hole"]

# --- op's own, which no consumer document could state ---------------------------

[[obligation]]
id = "composition_contracts_above_the_numeral"
need = "Contracts for units bigger than a single numeral, so that what a chain of operations guarantees is expressible at all."
consumer = "any"
why = "Op names it as half of what arvo is for, beside the algorithm surface, and explicitly not the numeral alone. The panel reaches the same place from the other direction: a chain is not a value, so an accuracy intent stated over chains has no expression over a per-value primitive, and that was recorded as a hole in the whole framing rather than as a gap in one topic."
topic = "the_chain"
provenance = ["panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#what-op-asks-for", "panel::202608072330_the-numeral-canon-panel::INTENTS::#i11-arvo-is-a-library-and-the-value-is-what-composes-on-top-of-it"]
keywords = ["composition", "contract", "chain", "beyond the numeral", "fold", "accuracy across chains", "bigger than a numeral", "guarantee", "trait contract"]
