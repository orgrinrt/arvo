[[obligation]]
id = "a_content_hash"
need = "A hash of content that is stable across sessions and across machines, wide enough that a cache keyed on it does not collide at the population its consumer holds, and whose width the consumer names rather than inherits."
consumer = "hilavitkutin"
quote = "The runtime API carries the hash value as arvo_hash ContentHash, an alias for arvo_bits Bits<28>. (hilavitkutin, `mock/crates/hilavitkutin-persistence/DESIGN.md.tmpl`, on `dev`)"
why = "Its persistence layer keys on it, and stability across sessions is the property that makes a cache a cache. Nothing else about a cache key is free: two entries colliding is a wrong answer served from disk rather than a slow one."
gap = "The consumer states the stability and not the width or the collision bound, and the earlier wording here stated neither, so anything returning bytes met it. What the population actually is, and therefore what width is enough, is not established anywhere. **The quotation is the nearest the consumer comes and it does not close this**: 28 bits is where the hash is carried, which is a layout fact, and nothing says the population fits under the birthday bound at that width. So the row is quoted and still under-specified, and those are different states."
