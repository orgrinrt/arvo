[[obligation]]
id = "the_algebra_is_legible_enough_to_adopt_without_adopting_half_of_it"
need = "Arvo's algebra states its layers so that a consumer reading it adopts the whole of what it reached for, rather than one layer of two while believing it took both."
consumer = "tarina"
quote = "And arvo carries two grade counts at two layers, ratified after both readings were seen: a site count that is an operation-layer fact and is published, and a moved count that is a value-layer fact, data-dependent, and never published by default. Tarina adopted one and did not notice there were two. [...] Arvo's algebra is still the intended destination. It is not adopted until its two-layer shape is understood well enough to adopt correctly. (tarina, `mock/research/canon/03-algebra.md`, on `dev`)"
why = "**A consumer reporting that arvo's design misled it, in its own canon, naming the exact reading it got wrong.** That is the only evidence of this kind anywhere in the corpus and it is not a matter of taste: the consumer did not merely find the design hard, it adopted a wrong subset and shipped a local algebra instead, and says so as its reason for not adopting. It lands on op's bar directly, since a canon that a competent reader takes half of is not one a full design can be built from."
gap = "**Legibility has no instrument here and this row does not supply one.** Every check in this repository walks the registry and can only report that the canon agrees with itself, which is the property that fails silently when a reader takes half of a correct document. The nearest thing to a test is a second consumer reading the two-layer shape cold and reporting which layers it found, and nobody has done that. Worth saying plainly that this row cannot be closed by an argument that the two layers are correctly stated: they are, and the consumer read them anyway."
topic = "arvo_identity"
provenance = ["panel::202608072330_the-numeral-canon-panel::200_mcsherry_re_deriving_the_demand_side::#5-two-consumers-were-never-read-and-both-say-things"]
keywords = ["legibility", "two layers", "grade", "site count", "moved count", "published", "misled", "adoption", "algebra", "documentation", "consumer report"]

[[obligation]]
id = "every_standard_convention_expressible_as_an_alias_over_the_primitives"
need = "Each industrial fixed-point and floating-point convention writable as a first-class alias over arvo's own primitives, so a consumer reaches for the standard's own vocabulary and gets arvo underneath, and a parity suite runs the same computation through both and asserts the same answer."
consumer = "any, and op by rule"
quote = "it is bounded by soundness and also the rule that demands we provide first-class matlab and ieee754 compatible apis as aliases over arvo primitives and such (op, on whether a declared numeral's footprint is observable)  --  actual tests where we run same stuff in our api and then on matlab/sysc/etc APIs, and assert that both actually return the same ... on a wide selection of different usages (op, the verification mandate, quoted in `PRIOR_CALLS.md`)"
why = "**It is an adequacy test on the abstraction rather than a feature.** A convention that cannot be written as an alias is a gap in the primitives, and the gap is falsifiable per standard before anything ships, which is what makes this the one demand-side row that can refute a design rather than merely ask it for something. Op names it as a bound on a question the panel had put to him as open, so it constrains work that is in flight now."
gap = "**No row carried this and the corpus has held it since long before this panel.** The standards appear in the corpus as a test rather than an inspiration, one prior pass recorded that the table-changing files had never once been tested against MATLAB, IEEE 754 or SystemC, and the first gap the test caught was slope-bias, which is why a neighbouring retirement exists at all. None of that reached the demand side, so the enumeration was missing the requirement that most constrains it.\n\nWhat is unstated: which conventions are in scope. MATLAB `fi`/`fimath`, IEEE 754, SystemC `sc_fixed`, Vitis `ap_fixed` and Algorithmic C `ac_fixed` all appear in the corpus, op named two, and no row says whether the set is those, more, or a core with the rest open. The parity suite is also unbuilt: it is a mandate with no artifact."
topic = "arvo_identity"
provenance = ["panel::202608072330_the-numeral-canon-panel::PRIOR_CALLS::#which-verb-validate-is-in-his-acceptance-criterion"]
keywords = ["MATLAB", "fi", "fimath", "IEEE 754", "SystemC", "sc_fixed", "ap_fixed", "ac_fixed", "alias", "convention", "parity suite", "adequacy", "expressible", "standard"]
