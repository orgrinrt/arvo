[[obligation]]
id = "a_content_hash"
need = "A hash of content that is stable across sessions and across machines, wide enough that a cache keyed on it does not collide at the population its consumer holds, and whose width the consumer names rather than inherits."
consumer = "hilavitkutin"
why = "Its persistence layer keys on it, and stability across sessions is the property that makes a cache a cache. Nothing else about a cache key is free: two entries colliding is a wrong answer served from disk rather than a slow one."
gap = "The consumer states the stability and not the width or the collision bound, and the earlier wording here stated neither, so anything returning bytes met it. What the population actually is, and therefore what width is enough, is not established anywhere."
topic = "arvo_identity"
