# What arvo is asked for, in the asker's own terms.
#
# Read from outside the canon on purpose: a check that walks the canon can only
# report that the canon agrees with itself, so the enumeration has to come from
# somewhere the canon does not reach. This is the instrument behind op's bar
# that the canon be exhaustive enough for a full design and a full
# implementation to follow from it.
#
# **Whether an obligation is met is derived and is never stated here.**
# `refsto(obligation::<slug>)` reports what points at it, and an empty result is
# the finding. A proposal alone does not meet one: a proposal is proposed rather
# than met, and reporting it otherwise closes a gap op has never seen.
#
# **The names in the sources are the deleted crate tree's and none of them
# appear below.** Every row is the need the consumer states in its own words.
# Where a consumer names a crate and never says what it is for, no row exists
# and `184` records the gap.
#
# An absence here means nobody has enumerated it, never that arvo does not owe
# it. `184` says exactly what was read.

# --- what the engine's plan chain asks for ------------------------------------

[[obligation]]
id = "set_operations_over_a_fixed_size_bit_set"
need = "Intersection, union and an emptiness test over sets of a size fixed at compile time, each lowering to one instruction, for a scheduler's read and write sets and for the dirty masks its plan ends on."
consumer = "hilavitkutin, and vehje for a compiler's artifact read and write sets"
quote = "`AccessMask` is the arvo-bitmask `Mask64` (<=64 stores) or `Mask256` (<=256 stores). All scheduler ops = single-instruction bitwise. (hilavitkutin, `mock/crates/hilavitkutin-api/DESIGN.md.tmpl`, on `dev`)  --  All scheduler ops = single-instruction bitwise: AND for conflict, OR for union, `== 0` for empty check. (the same claim with the operations enumerated, `mock/research/imported-from-polka-dots/design_rounds/202603181200_topic.hilavitkutin-design-consolidation.md`)"
why = "Two steps of a twelve-step plan chain rest on it, and the same surface is asked for again by a different consumer for a different purpose, which is what makes it an obligation rather than one consumer's convenience. **The lowering is part of the need rather than a quality of implementation**: the consumer states what these compile to, in a live design, so a correct set type that lowers to a loop does not meet this. It is also the only obligation here that names an instruction count, which makes it the one an arm can be measured against."
gap = "**This row read `union, intersection and difference` and the third of those is asked for nowhere.** No mask difference appears in the consumer at all; the two hits for the word are a string crate's code-size discussion and a type-level operation on the hlist typestate, which is a different mechanism. So the row carried an operation nobody wanted, which is the cheapest way for an implementation to spend effort on nothing. Union survives and is not the same mistake: the live design walks `the union of the fiber's units' write masks`. The single-instruction requirement was absent from the row entirely and is the load-bearing half. What is still unstated is whether `Mask256` is required to hold the same lowering, since one instruction over four words is not available on every target."
topic = "arvo_identity"
provenance = ["panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#what-hilavitkutin-asks-for", "panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#what-vehje-asks-for", "panel::202608072330_the-numeral-canon-panel::200_mcsherry_re_deriving_the_demand_side::#3-per-obligation-is-there-a-statement-of-need"]
keywords = ["set", "sets", "bitmask", "bit set", "mask", "union", "intersection", "overlap", "conflict", "read set", "write set", "dirty mask", "access set", "single instruction", "lowering"]

[[obligation]]
id = "ordering_a_directed_acyclic_graph"
need = "A topological order over a dependency graph that rejects a cycle rather than returning one, an upward rank giving a critical path, and a waist detection giving phase boundaries."
consumer = "hilavitkutin for a scheduler's plan, vehje for a compiler's pass order"
quote = "2. Topological sort + node renumbering (arvo-graph). A registration whose units form a cyclic data dependency (each reads what another writes, transitively back to itself) cannot be linearised; the runner rejects it as `PlanError::Cycle`. [...] 3. Upward rank -> critical path (arvo-graph). 4. Waist detection -> phase boundaries (arvo-graph). (hilavitkutin, `mock/crates/hilavitkutin/DESIGN.md.tmpl`, steps 2 to 4 of the plan chain, on `dev`)"
why = "Three of the twelve plan steps are this one surface asked for three ways, each with a stated purpose rather than a crate name, and the second consumer wants the same thing for an unrelated reason. The cycle case is part of the need and not an error path bolted on: the consumer names the rejection it wants back, so a routine that assumes acyclicity does not meet this."
gap = "**This row carried a fourth item, a bandwidth-reducing reordering, and it did not belong here.** It came from the dependency sentence's `arvo-graph for DAG / RCM`, and the consumer's own per-crate design puts RCM at step 5 and attributes it to a different crate, with two outputs going to two different consumers. The consumer disagrees with itself across those two documents and this row inherited the half that was a crate list. The item now lives in `a_sparse_adjacency_a_plan_can_be_built_on`, whose need was rewritten to the analyses the consumer asks for over a matrix it supplies, which is where the consumer's live design puts both."
topic = "arvo_identity"
provenance = ["panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#what-hilavitkutin-asks-for", "panel::202608072330_the-numeral-canon-panel::200_mcsherry_re_deriving_the_demand_side::#3-per-obligation-is-there-a-statement-of-need"]
keywords = ["graph", "DAG", "dependency graph", "topological sort", "topo", "rank", "critical path", "waist", "phase boundary", "cycle", "ordering", "pass order"]

[[obligation]]
id = "a_sparse_adjacency_a_plan_can_be_built_on"
need = "A renumbering permutation that reduces bandwidth, and a partition into connected components with a fine decomposition and dead column elimination, both taken over a compressed sparse matrix the consumer hands over rather than one arvo builds."
consumer = "hilavitkutin"
quote = "It converts to a bidirectional CSR (forward adjacency plus a pre-computed transpose) to feed the arvo-sparse structural steps (5-6). [...] 5. RCM reordering -> renumber permutation on `ExecutionPlan`: row order is the WU execution order (feeds fiber grouping, step 8), column order is the arena layout (arvo-sparse). 6. Block diagonal -> connected-component partition projected to per-phase trunk skeletons (one trunk per block; sets `Phase` id, `Trunk` id, trunk count). Dulmage-Mendelsohn fine decomposition, dead column elimination, and the phase-alignment check layer on in later rounds (arvo-sparse). (hilavitkutin, `mock/crates/hilavitkutin/DESIGN.md.tmpl`, steps 1, 5 and 6 of the plan chain, on `dev`)"
why = "Two named steps of the plan chain, and the boundary is stated by the consumer in the same breath as the representation: it builds the CSR and converts it precisely in order to feed these. The two outputs go to different places, the row order into fiber grouping and the column order into the arena layout, so the permutation is a result the consumer consumes rather than an internal detail of a partition."
gap = "**This row asked for the sparse representation itself and that was wrong in the same way two neighbouring rows were.** It read `a compressed sparse representation of a dependency graph, sized at compile time, that stays the fastest shape at every graph size`, and the consumer builds that itself: `DependencyGraph uses CSR backing (row_offsets + col_indices + edge_kinds)`, and `bench-locked canonical at every N (no threshold)` is the consumer recording its own choice of backing rather than asking arvo to guarantee anything. Third of five plan-chain rows found to be the crate list rather than the need. What is still unstated is which fine decomposition the consumer wants when the graph is not square, since Dulmage-Mendelsohn is named without the bipartite structure it decomposes being described anywhere.\n\n**The slug still names the representation and stays that way**, for the reason the float-flag row's slug stays: it is an address, six landed member files cite it by name, and this namespace has no way to supersede a row, so renaming it would orphan those six for a cosmetic gain. Read the `need`, not the slug."
topic = "arvo_identity"
provenance = ["panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#what-hilavitkutin-asks-for", "panel::202608072330_the-numeral-canon-panel::200_mcsherry_re_deriving_the_demand_side::#6-what-changes"]
keywords = ["sparse", "CSR", "adjacency", "RCM", "reverse Cuthill McKee", "bandwidth", "permutation", "renumber", "block diagonal", "connected components", "Dulmage-Mendelsohn", "dead column elimination"]

[[obligation]]
id = "a_spectral_partition_of_a_dependency_graph"
need = "A spectral split of a graph into groups that can run apart, taken over an operator the consumer supplies rather than over a representation arvo picks, and reproducible bit for bit at a fixed iteration count the consumer names."
consumer = "hilavitkutin"
quote = "arvo-spectral's `SparseLaplacian` walks forward edges only, giving the directed Laplacian. Spectral partitioning needs the symmetric (undirected) Laplacian: nodes `i` and `j` couple if `i -> j` or `j -> i`. This engine-local operator wraps the `CsrBidirectional` (forward plus transpose) and implements `LinearOperator` with the symmetric matvec, using unit edge weights (every dependency edge is one unit of coupling for partitioning purposes). It is composition over the `LinearOperator` contract, not a reimplementation of an arvo primitive. (hilavitkutin, `mock/crates/hilavitkutin/src/plan/laplacian.rs`, module header, on `dev`)"
why = "One named step of the plan chain, and the one that decides which work is allowed to run in parallel. The operator being the consumer's is the load-bearing half: it builds a symmetric Laplacian of its own because a directed one is the wrong object for partitioning, and it describes that as composition over a contract rather than as reimplementing anything. So what is owed is the contract and the split over it. Reproducibility is not a nicety either: the consumer pins the iteration count precisely so the schedule it derives stays statically analysable, and a split that moved between runs would move the schedule with it."
gap = "**This row briefly demanded the Laplacian construction, the power iteration and both split forms, and that was wrong in the direction that matters.** It was written from a table in the consumer's `research/seed/`, which is demoted material, and reported as the consumer's design. The consumer's actual source builds its own Laplacian and says why in the file's opening comment. Reading a seed file and calling it a design is the failure of claiming what a design says without opening the design, and it inflated the one measurement op's exhaustiveness bar is checked by. Reported by an expert dispatched on a neighbouring question and verified here against committed source. What remains genuinely unstated is where the iteration-count determinism is written down: it is in the consumer's roadmap research rather than in a design document."
topic = "arvo_identity"
provenance = ["panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#what-hilavitkutin-asks-for"]
keywords = ["spectral", "Fiedler", "eigenvector", "partition", "graph partition", "block diagonal", "parallel groups", "linear operator", "matvec", "operator contract", "deterministic", "iteration count"]

[[obligation]]
id = "a_cost_dynamic_program"
need = "Combinatorial grouping over a cost model: packing items into bins, and ordering a chain of operations so the total cost of the chain is least."
consumer = "hilavitkutin"
quote = "The DP cost is neither the step-6 Laplacian nor a per-fiber weight. Spec Step 8 states it outright: `cost(i,j) = record_count x sum of size_of::<T_k>() over the union columns of ops i..j`, using type-native strides (R3) and the co-located arena model; the cost IS the memory bandwidth of one data walk through the candidate fiber's arena. Feasibility = the full domain-14 holistic check (register file, L1 write budget, L1+L2 total, no fan-in, no pipeline breaker). Greedy mode for <=10 ops, DP for >10. (hilavitkutin, `mock/research/202606201900_granular-roadmap-and-sketch-plan.md`, on `dev`)"
why = "Its grouping step is named as greedy together with a matrix-chain dynamic program, and a separate ordering step reaches for bin packing by name. Both decide how work is grouped rather than how much of it fits anywhere. **The objective is a minimum over sums**, which makes this the min-plus shape the corpus has results about rather than a budgeted optimisation: minimising a cost over a chain, under a separate feasibility predicate that admits or rejects a grouping and does not enter the objective."
gap = "**This row read `a dynamic program over costs, deciding how to group work under a budget`, and the budget half was wrong.** The consumer's budgets are cache-footprint constants that size morsels, which is a different step of the same chain, so the row attached a real quantity to the wrong need and could have been met by something the consumer never asked for. Reported by an expert dispatched on a neighbouring question; the two routines and the misplaced budget were verified here against the consumer's own documents.\n\n**The cost model this row recorded as stated nowhere is stated**, and the quotation carries it: record count times the summed element sizes over the union of columns an interval touches, which is the bandwidth of one data walk through that grouping's arena. So the row is no longer under-specified in its objective. **Its provenance is weaker than a design and that is the remaining gap**: the sentence lives in the consumer's research, reporting what a spec says, and the live per-crate design does not carry it. A cost model quoted from a document reporting a second document is worth having and is not worth treating as settled. What genuinely remains open is the feasibility predicate, which is named as one check over five conditions taken together and defined in none of them here."
topic = "arvo_identity"
provenance = ["panel::202608072330_the-numeral-canon-panel::184_dispatcher_note_the_demand_side::#what-hilavitkutin-asks-for"]
keywords = ["cost", "DP", "dynamic programming", "combinatorics", "grouping", "bin packing", "matrix chain", "greedy", "knapsack", "ordering"]

