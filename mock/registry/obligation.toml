why = "Its build tooling exists partly to turn this on, driven by a pragma a person writes in the consumer's source. The need is the relaxation and the region it applies to; nothing about it requires the mechanism the consumer currently uses. The quotation states the mechanism because that is what the consumer wrote, and it is worth having in that form: `the only cfg this crate emits` is the consumer bounding its own surface, which is the fact the conflict with `a_content_hash` turns on."
gap = "**This row used to state the mechanism**, a named cfg the consumer's build sets, which the field description forbids in as many words: the need, never the mechanism that serves it. As worded it could only be met by the one thing the corpus argues against, which is not a coverage finding about arvo but a defect in the row. What the corpus has measured is that one source one flag apart gives one type name two policies, and a compile-time check cannot catch it, because each build emits one lowered path and satisfies the check while the denotation differs between builds. So the need stands and the current mechanism is what is in doubt. It also conflicts with `a_content_hash`, from the same consumer: a hash stable across machines and a float regime that changes with a build flag cannot both hold over the same values, and nothing in the registry says so. **The slug still names the mechanism and stays that way.** It is an address, five landed member files cite it by name, and this namespace has no way to supersede a row, so renaming it would orphan those five for a cosmetic gain. Read the `need`, not the slug."
