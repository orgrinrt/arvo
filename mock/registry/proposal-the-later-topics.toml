because = "The components have different closure properties, so the question of whether the strategy set is closed has two answers and conflates them. The assignment space is closed and enumerable, because an axis position with no lowering cannot be supplied from outside. The weighting space is open and consumer-supplied, because a weighting re-ranks arms that already exist. The axes are closed; the named points are open."
note = """
Two cold derivations reached the pair blind by different routes, one from a \
bytes-level model and one from two of the stated intents set against each other. \
**The blindness evidence is weaker than the pair's own files claim and the \
discount travels with the row.** The commit ordering establishes the within-file \
half for each and nothing about the between-file half, and for one member it runs \
the wrong way: its phase one landed two minutes after the other member's file was \
already in the tree. Blindness rests on the two coverage statements and on one \
member's specific disclaimer, and on nothing else. Both also read the same \
auto-loaded workspace rules, one of which states a mechanism they both used, so \
wherever that mechanism does the work they are one instance wearing two hats.

`normative` because the pair is a definition, and the mechanical test is a \
criterion rather than a measurement.
"""
