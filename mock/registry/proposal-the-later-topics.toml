[[proposal]]
id = "the_realisation_map_has_an_algebraic_character"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_realisation_map"
says = "A primitive's realisation map takes an exact result back into the primitive's value set. Beyond what it computes, the map has an algebraic character: the set of algebraic properties it possesses. The map is a homomorphism for an operation when reducing before that operation and reducing after it agree, and it is order-preserving when it never inverts the order of two exact results."
because = "The two properties are what a design may act on: one licenses deferring a reduction, and the other licenses constructions and rewrites that read the map's order. Naming the character is what makes the licence families statable at all."
note = """
Signed as definitional by the one signature that reached it. `normative` for the \
same reason as the other definitions here: it is stipulated, and the source \
marks it `Definitional; no predicate`.

What follows from the character is a family of claims about which licence is \
available where, and none of those is in this file: every one of them is stated \
over an ambient domain and its closure under negation, and no `dimension` row \
declares such an axis.
"""
gap = "The whole of what this character licenses is unported. The topic's ten remaining clauses all carry regions naming axes the registry does not declare."
provenance = [
  "panel::202608072330_the-numeral-canon-panel::119_leroy_the_canon_candidate_for_the_realisation_map::379",
  "panel::202608072330_the-numeral-canon-panel::122_leroy_the_candidate_revised_against_two_partial_signatures::347",
]
