[[proposal]]
id = "within_an_unbound_stretch_the_design_may_select_any_realisation"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_chain"
says = "Within a maximal unbound stretch, the design may select any realisation whose boundary behaviour meets the stretch's declared grade on its definedness domain. The exact grades fix the boundary function uniquely: composite correct rounding owes the resolution of the exact value, structural exactness owes the exact value, stepwise owes the fully-eager function, and the bounded-drift grade admits the family of placements within its bound."
because = "The licence rests on two normative premises and both are named. The observability perimeter bounds obligations above, so nothing beyond the observation surface is owed; the declaration bounds them below, so the declared grade is owed. Neither follows from the partition theorem the clause sits beside."
instead = "Where a stretch contains an operation that is partial at the profile in force, agreement on definedness is part of the declared grade at every profile, because partiality is a binding-free observation channel that no assertion flag governs."
note = """
**This is the underivable one, and it is why the topic's own result is that its \
central claim splits by provenance.** Three members tried to derive it from the \
stated intents and all three failed for stated reasons: one intent licenses \
removing unused paths rather than roaming among used ones, one says optimal \
rather than behaviour-preserving, and two constrain the surface and supply no \
licence. It rests on a workspace rule that was in every member's context and \
named by none of the cold derivations until the attack found it.

**Standing is recorded as one expert and the honest number is zero.** The panel's \
own ledger puts this at zero independent instances, and the enumeration has no \
value for that. A reader counting instances from this field will count one too \
many.

It holds in a shipped artifact and fails in a development build, which is a \
build bound arriving from a direction the intent that already states that bound \
was never derived from. The profile does not merely add an observation channel: \
it changes which operations are partial, so the same pair of realisations can \
share a definedness domain at one profile and not at the other.
"""
gap = """
Whether the observability principle becomes an intent of arvo's is not the \
panel's, and a workspace rule is not a ratification. Whether a canon may carry a \
sentence of this kind beside established ones is a second question of op's, \
coupled to the canon-form question as one decision.

The build bound is real and is not written as a region, because a region on an \
imposed proposition would invert it. The bound is `debug-assertions = off` for \
the licence to hold, and it is stated in the sentence rather than in a predicate.
"""
provenance = [
  "panel::202608072330_the-numeral-canon-panel::176_leroy_the_candidate_revised_against_two_signatures::93",
  "panel::202608072330_the-numeral-canon-panel::173_leroy_the_canon_candidate_for_the_chain::80",
]
keywords = ["licence", "normative", "unbound stretch", "boundary function", "declared grade", "definedness domain", "observability perimeter", "underivable", "build profile", "debug-assertions", "partial operation", "composite correct rounding", "structural exactness"]

[[proposal]]
id = "the_type_carries_whatever_must_be_const_available"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "binding_time"
says = "The type carries whatever must be const-available to decide validity or to select a lowering, and that criterion is compelled rather than chosen: a parameter left to runtime forces the check the design's own intent forbids."
because = "The compulsion is read off emitted code rather than argued: where the parameter is const, one path is emitted and nothing branches on it, and where it is not, the check the intent forbids is what stands in its place."
instead = "An axis that decides neither validity nor a lowering is not a member of the type on this criterion, and belongs wherever the identity criterion puts it."
note = """
**The entailment behind this is one expert's and is explicitly asking for a \
second read.** The panel's first ledger entry claimed two instances; the author \
of the second refused that rung on its own row, a signature concurred after \
verifying at source, and the corrected entry puts the entailment at one \
instance. Nothing about it is weakened by that, and the row carries the request \
rather than burying it.

The wording the correction also fixes is worth carrying: the claim is that \
neither build branches on the build and each emits one path, rather than that \
no runtime check exists, because the base build's compare-and-select is the \
declared saturating arithmetic and is exactly what the intent permits.

`normative` because the sentence tells the design what the type must carry. The \
compulsion is its reason and sits in `because`.
"""
