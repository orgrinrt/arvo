# What the later five topics settled: the realisation map, rounding, the
# strategy object, the primitive, and the chain.
#
# A separate file from `proposal.toml` because that one is being written at the
# same moment for the four earlier consolidations. A row's namespace is the
# array-of-tables key and never the path, so these are the same namespace and
# every query sees both; two files only keep the merge clean. A later pass may
# refile by subject.
#
# Every row is ported from the revision that governs its topic, per
# `AGREEMENTS.md` sections 9 through 13: `122` over `119`, `136` restored by
# `138` over `132`, `151` over `146`, `164` over `161`, and `176` superseded in
# seven places by `178` over `173`. Where a revision leaves a clause standing,
# the candidate's own text is the source and the revision's opening list is what
# says so.
#
# **This file is far shorter than the material it comes from, and the reason is
# mechanical rather than editorial.** A non-normative proposal must carry a
# region, a region entry must name a declared `dimension`, and the corpus
# predicates over 115 distinct keys of which 19 map onto a declared axis. Of the
# 64 predicate spans in the twelve governing files, 5 use only declared axes.
# Two whole topics, the primitive and the chain, write no predicate on any
# statement clause at all. What could not be written is enumerated in
# `183_rompf_porting_the_five_candidates.md`, which is the larger half of the
# port and the part worth reading.
#
# **`normative` carries the definitions as well as the prescriptions.** The
# `sentence_kind` enumeration has no value for a stipulated definition, and
# `normative` is the only one whose predicate contract fits: a definition is
# imposed rather than established, and a region on it would say the definition
# holds only where somebody measured. Every such row says so in `note`.

# --- the primitive ------------------------------------------------------------

[[proposal]]
id = "a_primitive_is_a_value_set_with_one_realisation_map"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_primitive"
says = "A primitive is a value set together with one realisation map taking an exact result back into it, over a declared operation set. Its identity is that structure up to denotation-preserving isomorphism, relative to the declared operation set. Of the three sameness relations, nominal, representational and denotational, each licensing a different operation, only the denotational one is a congruence under composition, which is why it and only it licenses substitution inside a composite."
because = "The composed clause survived attack at both ends: the packed end does not touch it, because it is a statement about denotation while the compile refusal that would refute it is a statement about representability. Types are the degenerate case of lenses, which is the synthesis the two cold derivations could not reach and which arrived in the reply round, and it gives one vocabulary across the whole declared range without the cost the single-vocabulary option carried."
note = """
The composed wording is one expert's and the parts underneath it have stronger \
provenance of their own. The identity half is conditional on a decision that is \
not the panel's: under one branch of the container premise the isomorphism \
quotients the carrier and this clause's extension is the coarser partition, and \
under the other it must preserve the carrier and the extension refines, measured \
at 32 primitives against 64 on the swept grid. The wording is parametric in the \
operation set, so its truth value is stable and only its extension moves.

`normative` because the sentence is a definition. It is stipulated rather than \
established, so it carries no region, and the kind enumeration has no separate \
value for a definition.
"""
gap = "Which branch of the container premise holds is not the panel's to choose, and the extension of this clause moves with it."
provenance = [
  "panel::202608072330_the-numeral-canon-panel::161_leroy_the_canon_candidate_for_the_primitive::521",
  "panel::202608072330_the-numeral-canon-panel::164_leroy_the_candidate_revised_against_two_signatures::159",
]
keywords = ["primitive", "value set", "realisation map", "identity", "denotation", "isomorphism", "sameness", "nominal", "representational", "denotational", "congruence", "substitution", "composite"]

