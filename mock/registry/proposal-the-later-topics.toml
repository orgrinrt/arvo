[[proposal]]
id = "the_lens_degenerates_to_an_ordinary_value_at_sole_occupancy"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_primitive"
says = "The realisation is a lens: a placement of the value's bits, a carrier, an offset and a width, within a carrier allocation. It degenerates to an ordinary value exactly where its focus is the sole logical occupant of its carrier allocation, with padding permitted and sharing not. At a degenerate point the language supplies a standalone type and the native end never mentions the lens; everywhere else the primitive is reached through its carrier and no size-bounded contract ranges over it."
because = "Sole occupancy is correct in three failure directions where the positional condition it replaces is wrong in all three: under-strict on sharing at offset zero, over-strict on padding, and over-strict on sole occupancy at a nonzero offset. A thirteen-bit value at offset three of a sixteen-bit carrier is two bytes, sized, referenceable, and round-trips over all 8192 values; the positional condition rejects it and sole occupancy accepts it."
note = """
The third failure direction is the one that decides it, and it was found by a \
separately built instrument extending the first. Standing stays at one expert \
because the second party built its instrument after reading the first rather \
than deriving independently.

What the unrepaired condition would have cost is recorded rather than inferred: \
the canon would have classified the first element of every packed column as an \
ordinary value.

Whether a placement has a standalone name is a property of the target's \
addressing rather than of the primitive, so this states the reason and no arity. \
The lens's form is invariant under the container decision; only identity's \
granularity moves with it.

`normative` because it is a definition with a criterion, stipulated rather than \
measured. The three failure directions are measured and belong to the criterion's \
justification rather than to a region the definition holds in.
"""
provenance = [
  "panel::202608072330_the-numeral-canon-panel::161_leroy_the_canon_candidate_for_the_primitive::548",
  "panel::202608072330_the-numeral-canon-panel::164_leroy_the_candidate_revised_against_two_signatures::257",
]
keywords = ["lens", "realisation", "placement", "carrier", "offset", "width", "sole occupancy", "padding", "sharing", "degenerate", "standalone type", "Sized", "packed column"]

