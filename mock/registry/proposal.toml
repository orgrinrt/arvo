says = "At derivation, compile-time, per type: the declared representation is checked through its executable maps, exhaustively at a model width. At ingest, runtime, per datum: bits arriving without their construction history pass a membership door that is a pure function of the type's parameters and the bits. Between doors nothing checks and nothing needs to. A property a representation declares about itself counts only where a check ties it to the maps; a declared constant nothing reads is a comment with a type."
because = "The two acts have different units, different times and different subjects, so one mechanism cannot serve both. The last clause is the same failure the derived-laws topic found one coordinate up, where an author-written law marker is a declaration checked by nothing, and it is the reason a declaration has to be tied to the maps rather than trusted."
note = "One expert, and it contains an open question of op's: whether both acts are wanted, and where."
gap = "Whether both acts are wanted, and where, is op's and is unanswered."
