says = "A composite crossing that loses nothing is determined by its endpoints. Where it loses, it is determined by its endpoints together with an order, the two candidate orders being the source's policy governing the loss and the target's, and the typestate cannot break the tie. An order must be named exactly where a crossing is lossy, and nowhere else."
