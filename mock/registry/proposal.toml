  "arity: arity = 3",
  "container: interval numerals containing zero, 100 of them",
]
law = ["additive_associativity_under_saturation", "multiplicative_associativity_under_saturation"]
evidence = ["absorption_and_associativity_agree_for_clamped_addition"]
note = "The instruments are `57_probes/p2`, `p2b`, `p8` and `p1`, `61_probes/q1`, all committed in the panel and all re-run byte-identically by the consolidator. The width entry is the cube's own width instances, which the counts section names as the format-shaped part of the sweep; the raw 4248 and 7744 figures count clamp-and-operand-box combinations, most of which are no format at all, and a reader quoting 4248 as a count of formats checked would be wrong. The sign-confinement closed form is a corollary and never the criterion: the opposite-bound mutant is sign-confined with a reachable ceiling, the closed form predicts associativity, and it diverges 2240 times while absorption predicts the failure."
