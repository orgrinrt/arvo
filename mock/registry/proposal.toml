# What the four topic consolidations established, as rows op has not seen.
#
# A row in this namespace carries no standing by construction: being here is the
# whole of its provenance claim, and it becomes canon only when a `ruling` names
# it under `ratifies`.
#
# This said "Nothing does", and it was false: four rulings name eleven rows
# between them, and `ruling::the_format_spine_is_canon` alone ratifies three.
# **The count is not written here**, because a number in a comment is a second
# copy of something the registry already answers and this one had gone stale in
# the direction that matters, telling every reader no row had been stamped.
# `grep -h '^ratifies' ruling.toml` is the answer that cannot drift.
#
# Four things a reader has to know before quoting any row.
#
# **`sentence_kind` is what established the claim, not what the sentence sounds
# like.** A definitional canon candidate that stipulates what a word means is
# `normative` and carries no region, because a region on an imposed proposition
# would say the design may violate it everywhere unmeasured. A claim that could
# be measured false is not `normative` however definitional its grammar, and it
# carries the region it was established in or it is not here at all.
#
# **A region is transcribed, never supplied.** Where a consolidation stated one
# it is carried verbatim; where it stated none but named its instrument's
# parameters, the region is those parameters. Where neither was available the
# row was not written, and the claim is enumerated in `182` instead. That list
# is longer than this file.
#
# **`threads` and `target_features` appear on exactly the rows whose source
# wrote them.** Under I13 an absent axis says the claim holds in no situation
# where that axis exists, so several rows below are narrower than their authors
# meant. The narrowing is faithful to the notation and is an artefact of who was
# writing. `182` names the instances it found; it is not a complete list, and
# reading it as one is how two rows carrying the narrowing went unlisted.
#
# **A `measured` row names the probe it ran.** The ones that do not sit under a
# ratchet, the `measured-claim-cites-no-probe` lint, whose own doc
# comment says why each is stuck and whose ceiling admits no new arrival rather
# than tolerating them. It currently holds with no headroom, so the next
# `measured` row landing without a probe turns it red, which is the ratchet
# working rather than a regression.
#
# Both paragraphs above said the opposite until seat 216 checked them. The first
# claimed `182` was exhaustive. The second claimed `probe.toml` did not exist, so
# no `measured` row had anything to point at and the check was red on purpose.
# That namespace is populated and most `measured` rows now cite it. A header
# describing a state the file has passed is worse than no header, because it is
# read as current by everyone who does not think to test it, and nothing about it
# changes when the state does. Which is also why no figure appears in this
# paragraph: a count in a comment is the same defect one layer down, and the
# check beside this one refuses it.

