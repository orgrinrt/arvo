icate notation is the exception to the machinery group blocking nothing.** Every finding in the stack states its region in it, so a change there rewrites predicates written under the old form, and predicates are append-only so the rewrite is not available. Its two remaining open questions are worth closing ahead of stack work rather than in topic order."
