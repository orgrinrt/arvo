note = "**The question presented as a fork over a whole category and dissolves instead**, which is the shape op has refused under several names: take the win where it applies, gate it out from where it does not, compose the arms.\n\n**What the ruling adds that the question lacked**: a `construction` entry obliges the row's `evidence` to name an instrument that varied that axis and found no movement. So a transfer argument is not asserted in prose, and the question's \"the canon naming which one per claim\" becomes something a check can reach.\n\n**The residue is real and is narrower than the question was.** An induction-shaped argument has no differential control available in general, since no finite sweep establishes it, and seat 219 named that cost against its own `evidence` obligation. Which transfer shapes can meet the obligation, and what a row does when its argument is sound and uncontrollable, is a separate open question.\n\n**One expert, the coordinator's own.**"
