[[proposal]]
id = "an_order_is_named_exactly_where_a_crossing_is_lossy"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_number_system"
says = "A composite crossing that loses nothing is determined by its endpoints. Where it loses, it is determined by its endpoints together with an order, the two candidate orders being the source's policy governing the loss and the target's, and the typestate cannot break the tie. An order must be named exactly where a crossing is lossy, and nowhere else."
because = "Composition of lossless crossings commutes with the endpoints, so nothing extra is owed. Composition of lossy ones does not, and the two candidate orders give different answers, so something outside the typestate has to say which. Naming an order where a crossing is lossless would be a knob with no content."
