says = "The twenty topics are not one order. Eleven form a stack whose floor is the container premise, then the format, then rounding, overflow policy, the number system and the realisation map on the format, then the primitive on the realisation map and the number system, the strategy axis on rounding, overflow policy and the realisation map, the strategy object on the strategy axis, the algebraic laws on the primitive and the two edge behaviours, and the chain on the laws and the primitive. Four are a frame the stack sits inside rather than on: the operating constraints, arvo's identity, the execution environment and binding time. Four are the canon's own machinery and block nothing in the stack: canon form, the predicate notation, naming and panel conduct. Validation rests on the format and on binding time, which is the one stack topic resting on a frame topic and the edge least likely to survive."
