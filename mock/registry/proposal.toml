[[proposal]]
id = "the_laws_of_a_format_are_derived_from_two_hypotheses_rather_than_enumerated_per_policy"
kind = "answer"
sentence_kind = "theorem"
standing = "one_expert"
topic = "algebraic_laws"
says = "The laws of a format's operations are derived, not enumerated per policy. The induced operation is associative when the ambient operation is associative on the reachable set and the reduction's kernel is a congruence for it. The congruence half is decided by the range's geometry per operation, mirror symmetry for multiplication and sign confinement for addition, and is repairable by choosing the representable set. The ambient half fails wherever a fixed-width rescale is part of the operation itself, for every policy, and nothing downstream repairs it."
because = "Both hypotheses hold and the induced operation on the representable set is associative, because that set is the quotient. Evaluated mechanically over the unit's cube: zero sufficiency violations, zero cells associative without both hypotheses, zero residue, with each hypothesis and the measured truth observed both true and false across the cube. Read through it the unit's table rows become derivations rather than observations: addition's ambient is always associative so additive verdicts are decided by the congruence half alone and are scale-blind; wrapping's kernel is always a ring congruence so wrapping is decided by the ambient half alone; saturation's kernel is a congruence only under the stated geometry; and no multiplicative cell survives a nonzero fraction width anywhere. The closed forms are exact: the kernel is a multiplicative congruence iff the range is mirror-symmetric or nonnegative, and an additive congruence iff the range is sign-confined, with the predictor mismatching nothing over all 100 zero-containing intervals."
predicate = [
  "total_width: W = 4",
  "fraction_width: F in {0, 2}",
  "signedness: three sign domains, unsigned and signed two's complement and signed symmetric range",
  "overflow_policy: overflow policy in {wrap, saturate}",
  "operation: operations {add, mul}",
]
law = ["multiplicative_associativity_under_saturation", "additive_associativity_under_saturation"]
note = "The consolidation marks its equivalence **provisionally passes** and says so in load-bearing terms rather than as a hedge: the twenty-four-cell prediction with zero residue is an equivalence trial passed, but the frame itself is one expert and unattacked, and nobody has tried to break it the way two earlier claims in the same unit were broken. It names this as the thing it most wants attacked next. It was subsequently attacked from the number-system topic, from a direction it was not built to face, and it held, which the attacker states as a failed refutation rather than a proof. The fraction entry read `one unnamed value above 0` until seat 215 asked for it to be named or dropped, on the ground that an unnamed value cannot be gated on. It is 2, and it was never missing: `57b`'s prose says two scales without naming the nonzero one, while the cube in `57_probes/p9_output.txt` labels all twelve of its second-half rows `F=2`. The probe was outside this row's provenance at the time, which is the same porting gap the five repaired chains had. The sign entry conflates the range's geometry into the signedness axis because no `dimension` row declares the geometry, and the geometry is exactly what the congruence half turns on."
gap = "The frame is stated over associativity. Whether it derives the other laws the design cares about is not established, and nobody has tried. Held at one expert on width alone, and it is the strongest row in its topic. Seat 215 took the closed forms as a predictor rather than a claim and ran them out of sample at `W = 8`, over 24 cells of three sign domains, two policies, two operations and `F in {0, 2}`: every cell agrees, in both directions, with the predictor returning both verdicts across the cube so the run could have disagreed. The decisive cell is multiplication, saturating, on the mirror-symmetric range at `F = 0`, where the closed form says associative and the ordinary reading that signed saturation breaks associativity says not: measured 0 bad of 16,581,375. On that same range addition fails on 4,129,024, and two operations splitting on one range is something no account keyed on signedness alone can produce, which is what makes the geometry claim carry its own weight. What that does not do is widen the predicate. This row is evidenced at `W = 4` and 215 is at `W = 8`, so the widths intersect nowhere and the fraction widths intersect at exactly `{0, 2}`. The proposition has two arrivals; its width region has one instance each, and each is cited for its own."
