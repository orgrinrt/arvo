says = "The concept's edge is not an order and not a magnitude: order-compatibility is a property of the selected reduction, varies within a single family the design must contain, and groups a wrapped integer with a bit vector. A wrapped numeral satisfies fewer of the properties a numeral is expected to satisfy than almost anything else the concept contains, and it sits in the kernel on op's four-times-restated I3; so any clause proposed as a boundary of the concept is checked against wrapping before anything else."
