# --- the number-system concept, from `74` ----------------------------------
#
# Every row in this block is `normative`, and that is a finding rather than a
# filing convenience. The topic's output is a concept: what a numeral is, what
# its coordinates are, what a crossing between two of them means, who owns
# which choice. None of it is a claim an instrument could refute, so none of it
# carries a region, and the predicate discipline is therefore silent about an
# entire topic. Where a sentence here is offered as true by construction over
# the concept's own definitions, it is `normative` on the reading that a
# consequence of a stipulation is part of the stipulation. That reading is the
# porter's call, it is marked on each row it decides, and `182` lists them.
#
