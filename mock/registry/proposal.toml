[[proposal]]
id = "const_availability_is_the_axis_and_a_trajectory_condition_is_not_an_arm"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_predicate_notation"
says = "A condition available at const time may gate an arm, whatever it reads and wherever it comes from. A condition not available at const time may not, because selection happens at monomorphisation and there is nothing there to read. So a trajectory condition known only at runtime does not become an arm: it stays a finding about where a law holds, and a consumer who knows their data satisfies it selects the arm at their own call site from their own const knowledge."
because = "Op answered the axis on 2026-08-13, saying it is const-availability and that the admissible category is whatever is available at const time, which reaches const functions and const data from outside the typestate and leaves the typestate usable inside a const expression rather than being the only source. The rest follows from what const-availability means rather than from a choice between the options."
answers = ["may_an_arms_predicate_read_data"]
note = "**The question's three options are stale and option (a) is stale in its own self-description.** It calls itself the predicate intent read literally, and the intent was sharpened past the literal reading before the entry was written. The entry's own `note` records this and the entry was never amended. Options (b) and (c) present a fork over a category op has refused three times under three names.\n\n**The measurement in the entry supports this without deciding it**: a value-gated selection materialises both arms and picks with a conditional select, thirteen instructions against six and three for the two const-gated arms. The runtime-gated form buys nothing at the substrate level even where permitted.\n\n**The substrate ships the choice rather than making it**, which is the toolbox posture rather than a new rule.\n\n**What stays open belongs elsewhere**: whether a declared ingest boundary is worth building, so a trajectory condition is checked once where values enter and is a typestate fact afterwards. That is a design question about a mechanism and it belongs to `validation`.\n\n**One expert, the coordinator's own.**"
