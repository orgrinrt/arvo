says = "Each choice in the sequence has an owner and a resolution time: a type, an aggregate, or the compilation, resolving at monomorphisation, or a runtime datum. The concept's per-value obligations are owed by choices resolved at monomorphisation whoever owns them; a choice owned by an aggregate makes its obligations per-aggregate; and a platform-width numeral is a target-indexed family of formats whose exclusion grounds apply only to dependence that survives to runtime."
