[[proposal]]
id = "the_numeral_concept_is_a_dependent_sequence_of_choices"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_number_system"
says = "The numeral concept is a dependent sequence of choices, not a tuple of independent ones: an ambient domain, a representable set over it, a reduction from the space that pair derives, an encoding of the set, a container for the encoding. Each choice ranges over a set the earlier choices determine, the components range over relations with the function case ordinary, and the dependency runs one way."
because = "A tuple of independent choices cannot say that the space of reductions is derived from the pair above it, which is the fact the format topic reached separately, and it cannot say that a redundant encoding makes a relation rather than a function. The sequence says both, and the one-way dependency is what lets a sentence name the prefix it quantifies over."
answers = ["is_the_ambient_operation_family_fixed"]
note = "One expert with two instruments, which is one author's two arrivals rather than two authors'. The word `format` collides here: two units use it for different prefixes of this same sequence, and the collision is unresolved and is op's naming call."
provenance = [
  "panel::202608072330_the-numeral-canon-panel::74_giesen_consolidation_the_number_system_concept::475",
  "panel::202608072330_the-numeral-canon-panel::67_kiselyov_which_prefix_earns_the_word::608",
