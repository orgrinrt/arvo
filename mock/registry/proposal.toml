[[proposal]]
id = "membership_and_hosting_are_two_questions"
kind = "answer"
sentence_kind = "normative"
standing = "one_expert"
topic = "the_number_system"
says = "Whether something is a number system and whether this implementation can carry one are different questions. The first is about structure and is answered by locating the candidate on the chain of choices; the second is about residue at runtime and is answered by what a value at rest may carry. Neither enumerates, both are open, and a system the implementation cannot host is still a system."
because = "Conflating them makes the concept's boundary a fact about one implementation's runtime, which would move every time the implementation did. Keeping them apart is what lets the concept be closed while the inventory stays open."
note = "One expert on the split; the hosting half is a different author's and is conditional on an open question of op's."
