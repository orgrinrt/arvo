says = "A system exposes its ambient domain together with that domain's own law inventory, its representable set, and its selected reduction with that reduction's verdicts, including that the reduction moves no value already representable. The reduction's verdicts carry no information alone: the properties a consumer relies on are conjunctions of an ambient law and a reduction verdict, and a system that names its own computed algebra as its ambient domain satisfies every verdict while voiding every conclusion."
