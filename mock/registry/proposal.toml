[[proposal]]
id = "arithmetic_on_a_format_factors_as_an_adaptation_of_an_exact_operation"
kind = "answer"
sentence_kind = "normative"
standing = "two_experts"
topic = "the_format"
says = "Arithmetic on a format is an exact operation in an ambient domain composed with a named, total adaptation onto the representable set. The adaptation is a first-class object with its own laws; an operation that fuses one invisibly is an operation and an adaptation point wearing one name, and the model's statements apply to it only when the two are separated."
because = "The factoring is what makes error analysis possible: the error of a computation is the composition of adaptation errors, and the adaptation error is a property the format can state. Two authors derived it cold, one at the per-operation level and one at the chain level, each committing phase one before reading the other. The negative case completes it rather than qualifying it: eager fixed-point multiplication at nonzero fraction cannot supply an exactly associative ambient operation, because the rescale is baked into every pairwise step, and the fused spelling is precisely what cannot be re-expressed as exact composition."
law = ["multiplicative_associativity_under_wrapping"]
note = "The standing carries a discount its own authors stated: both derivations draw on one numerical-analysis literature, so this is two independent instruments over one shared premise rather than two arrivals from nothing. The consolidation's own bound is that it is worth more than a read and less than two arrivals, and there is no tier between the two that the schema can express. The negative case is a structural argument from two authors rather than a proven theorem, and its author says so."
provenance = [
  "panel::202608072330_the-numeral-canon-panel::63_spj_consolidation_the_format_concept::616",
  "panel::202608072330_the-numeral-canon-panel::63_spj_consolidation_the_format_concept::116",
]
keywords = ["standard model", "adapt", "exact", "ambient", "adaptation", "fused", "error analysis", "unfused", "C1"]

[[proposal]]
