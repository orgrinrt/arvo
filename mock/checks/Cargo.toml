# The checks over the canon, as a crate the harness runs.
#
# A member of the mock workspace, which is what makes `cargo mock test` and the
# readiness report reach it.
#
# The library holds the readers and the predicates; the integration tests point
# them at the committed registry and at planted inputs. Integration tests each
# get their own process, so a fixture built in one cannot be seen by another,
# and a `tests/common/mod.rs` compiles a second copy per test binary rather than
# sharing one.

[package]
name = "arvo-checks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Comment-preserving, because one of the checks is about what a comment claims
# and a value-only parser cannot see it.
toml_edit = "0.22"
