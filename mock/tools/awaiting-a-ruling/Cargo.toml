# Its own workspace root. This crate sits inside the mock workspace directory
# and is not a member, and cargo refuses that outright: "current package
# believes it is in a workspace when it is not". Membership is the wrong fix,
# since it would put a cdylib into the consumer's dependency graph.
[workspace]

[package]
name = "arvo-awaiting-a-ruling"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
# The URL spelling has to match the one the engine pins, character for
# character. Cargo keys a git source by its URL, so `https://` here against
# `ssh://` there is two copies of the same crate in one graph and a type
# mismatch across the boundary, with nothing in the error saying so.
mockspace = { package = "mockspace-lint-rules", git = "ssh://git@github.com/hiisi-digital/mockspace.git", branch = "dev" }

[lib]
crate-type = ["cdylib", "rlib"]
