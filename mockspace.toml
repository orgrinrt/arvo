# arvo. The mockspace config.
#
# At the repo root rather than inside `mock/`: a repo has exactly one of these,
# and the root is where it belongs. `mock_dir` maps it to the workspace it
# governs.

# The engine pin. `mockspace_version` is the released form, and mockspace has
# cut no release yet, so this tracks the working trunk instead. The launcher
# re-resolves the branch head periodically.
mockspace_branch = "dev"

project_name = "arvo"
crate_prefix = "arvo"
abi_version = 1
mock_dir = "mock"

proc_macro_crates = []
module_crates = []

# Which macro to track per-crate in domain items
primary_domain_macro = "strategy"
primary_domain_label = "Strategies"

# Layer labels by depth index, one per depth the dependency graph
# actually produces. The graph currently has ten depths (0 to 9); the
# previous list had seven, so depths 7 to 9 rendered as "Other" and
# "L2 substrate" appeared four times. Fixed as item 3 of D14 in
# design_rounds/202607290050_topic.the-restructure-widens.md.
#
# These describe what occupies each depth, which is computed from real
# dependency edges. They are deliberately NOT the L0a / L0 / L0.5 / L1
# / L2 / L3 numbering in mock/DESIGN.md.tmpl, because the two genuinely
# disagree about structure rather than about naming: the graph puts
# arvo-hash beside arvo-tensor at depth 6, and arvo-refit beside the
# algorithm crates at depth 8, where the document calls them L2, L1 and
# L1. That disagreement is a finding for the restructure round, not
# something to paper over by relabelling here.
layers = [
  "L0 root",              # arvo-transparent
  "L0 strategy",          # arvo-strategy
  "L0 storage",           # arvo-storage
  "L0.5 bit contracts",   # arvo-bits-contracts
  "L0.5 contracts",       # arvo-bits, arvo-mask-contracts, arvo-numeric-contracts
  "unoccupied",           # no crate sits at this depth today
  "L1 value storage",     # arvo-hash, arvo-tensor
  "L1 mask storage",      # arvo-bitmask
  "L2 algorithms",        # arvo-comb, arvo-graph, arvo-refit, arvo-sparse
  "L3 spectral"           # arvo-spectral
]

# Domain kind labels for STRUCTURE.md domain items table
[domain_kinds]
strategy = "🎛️ strategy marker"

# Known macros for DESIGN.md table (description | usage)
[known_macros]

# Crate header colors for dependency graph (bg_color | fg_color)
[crate_colors]
arvo = "#E8EEF7 | #3A6EA5"
arvo-bits = "#E8EEF7 | #3A6EA5"
arvo-bitmask = "#E6F2E6 | #2D6A2D"
arvo-tensor = "#E6F2E6 | #2D6A2D"
arvo-hash = "#E6F2E6 | #2D6A2D"
arvo-sparse = "#E6F2E6 | #2D6A2D"
arvo-graph = "#E6F2E6 | #2D6A2D"
arvo-comb = "#E6F2E6 | #2D6A2D"
arvo-spectral = "#EDE6F3 | #5C2D82"

# ---------------------------------------------------------------------------
# Lint configuration
# ---------------------------------------------------------------------------
#
# Per-gate severity: commit (pre-commit hook), build (standalone
# `cargo mock`), push (pre-push hook). Levels: off / info / warn / error.
# Violations at `error` fail the gate. Presets are documented in
# mock/agent/skills/lint-rules/SKILL.md.

# --- Universal quality lints (mockspace built-ins) -------------------------

[lints.no-empty-crate]
commit = "warn"
build = "warn"
push = "warn"

[lints.no-todo]
commit = "warn"
build = "warn"
push = "error"

[lints.file-size]
commit = "error"
build = "error"
push = "error"
max_lines = "500"

# --- arvo custom lints (mock/lints/*.rs) -----------------------------------

[lints.no-std-enforcer]
commit = "error"
build = "error"
push = "error"

[lints.no-alloc-enforcer]
commit = "error"
build = "error"
push = "error"

[lints.no-dynamic-dispatch]
commit = "error"
build = "error"
push = "error"

[lints.strategy-marker-required]
commit = "error"
build = "error"
push = "error"

[lints.arvo-bits-traits-only]
commit = "error"
build = "error"
push = "error"

[lints.no-runtime-grow]
commit = "error"
build = "error"
push = "error"

# --- Layer enforcement via forbidden-imports -------------------------------
#
# The L0 → L1 → L2 → L3 dependency table from mock/DESIGN.md.tmpl,
# encoded as import rules. A crate violates the rule if it imports
# any path listed under `forbidden` for its scope. {prefix} expands
# to crate_prefix ("arvo").

[lints.forbidden-imports]
commit = "error"
build = "error"
push = "error"
rules = [
  # Facade — arvo re-exports the public surface from every workspace crate. Forbid only std / alloc.
  { scope = "arvo", forbidden = "std::*, alloc::*", reason = "arvo is the facade re-exporting every workspace crate; only platform / heap deps are forbidden" },

  # L-1 root — arvo-transparent depends on notko only.
  { scope = "arvo-transparent", forbidden = "std::*, alloc::*, arvo::*, arvo_strategy::*, arvo_storage::*, arvo_bits_contracts::*, arvo_mask_contracts::*, arvo_numeric_contracts::*, arvo_bits::*, arvo_bitmask::*, arvo_refit::*, arvo_tensor::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-transparent is the L0 root: defines the Transparent trait + raw() helper; depends on notko only" },

  # L-1 — arvo-strategy depends on notko + arvo-transparent.
  { scope = "arvo-strategy", forbidden = "std::*, alloc::*, arvo::*, arvo_storage::*, arvo_bits_contracts::*, arvo_mask_contracts::*, arvo_numeric_contracts::*, arvo_bits::*, arvo_bitmask::*, arvo_refit::*, arvo_tensor::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-strategy is L0: strategy markers + container projection; depends on notko + arvo-transparent only" },

  # L0 — arvo-storage depends on notko + arvo-transparent + arvo-strategy. Hosts the only fielded primitive types in the substrate.
  { scope = "arvo-storage", forbidden = "std::*, alloc::*, arvo::*, arvo_bits_contracts::*, arvo_mask_contracts::*, arvo_numeric_contracts::*, arvo_bits::*, arvo_bitmask::*, arvo_refit::*, arvo_tensor::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-storage is L0 storage; depends on notko + arvo-transparent + arvo-strategy only" },

  # L0.5 — arvo-bits-contracts. Bit-level trait declarations + sealed-bridge impls on bare primitives. Hosts Narrow<T> trait declaration post-round-202604280034 merge. Depends on the L0 root stack.
  { scope = "arvo-bits-contracts", forbidden = "std::*, alloc::*, arvo::*, arvo_mask_contracts::*, arvo_numeric_contracts::*, arvo_bits::*, arvo_bitmask::*, arvo_refit::*, arvo_tensor::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-bits-contracts is L0.5 contracts; depends on notko + arvo-transparent + arvo-strategy + arvo-storage only" },

  # L0.5 — arvo-mask-contracts depends on bits-contracts + the L0 stack.
  { scope = "arvo-mask-contracts", forbidden = "std::*, alloc::*, arvo::*, arvo_numeric_contracts::*, arvo_bits::*, arvo_bitmask::*, arvo_refit::*, arvo_tensor::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-mask-contracts is L0.5 contracts; depends on the L0 stack + arvo-bits-contracts only" },

  # L0.5 — arvo-numeric-contracts depends on bits-contracts + L0 stack.
  { scope = "arvo-numeric-contracts", forbidden = "std::*, alloc::*, arvo::*, arvo_mask_contracts::*, arvo_bits::*, arvo_bitmask::*, arvo_refit::*, arvo_tensor::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-numeric-contracts is L0.5 contracts; depends on the L0 stack + arvo-bits-contracts only" },

  # L1 — arvo-bits hosts bit-storage type aliases (Bit / Nibble / Byte / Word / DWord / QWord).
  { scope = "arvo-bits", forbidden = "std::*, alloc::*, arvo::*, arvo_mask_contracts::*, arvo_bitmask::*, arvo_refit::*, arvo_tensor::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-bits hosts bit-storage type aliases; depends on arvo-storage + arvo-strategy + arvo-bits-contracts + arvo-numeric-contracts only" },

  # L2 — arvo-bitmask depends on the contracts + arvo-storage. Hosts concrete Mask<W> + Narrow<T> impls per Q-C.
  { scope = "arvo-bitmask", forbidden = "std::*, alloc::*, arvo::*, arvo_numeric_contracts::*, arvo_refit::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-bitmask is L2 mask storage; depends on arvo-storage + arvo-bits-contracts + arvo-mask-contracts + arvo-bits + arvo-tensor only" },

  # L2 — arvo-refit re-exports the bit-width refit family from arvo-bits-contracts. Trait declarations and impls live in arvo-bits-contracts post-round-202604280034 merge; renamed from arvo-narrow in round 202604301700.
  { scope = "arvo-refit", forbidden = "std::*, alloc::*, arvo::*, arvo_numeric_contracts::*, arvo_tensor::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-refit re-exports the bit-width refit family from arvo-bits-contracts; depends on arvo-storage + arvo-bits-contracts + arvo-mask-contracts + arvo-bitmask only" },

  # L2 — arvo-tensor. Value-storage peer of arvo-bitmask.
  { scope = "arvo-tensor", forbidden = "std::*, alloc::*, arvo::*, arvo_mask_contracts::*, arvo_bits::*, arvo_bitmask::*, arvo_refit::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-tensor is L2 value-storage; depends on arvo-storage + arvo-bits-contracts + arvo-numeric-contracts only" },

  # L2 — arvo-hash. Hash-domain types + algo contracts.
  { scope = "arvo-hash", forbidden = "std::*, alloc::*, arvo::*, arvo_mask_contracts::*, arvo_refit::*, arvo_tensor::*, arvo_graph::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-hash is L2 hash-domain; depends on arvo-storage + arvo-bits-contracts + arvo-numeric-contracts + arvo-bits + arvo-bitmask only" },

  # L2 algorithm crates — depend on the contract stack + arvo-tensor + arvo-bitmask.
  { scope = "arvo-graph", forbidden = "std::*, alloc::*, arvo::*, arvo_mask_contracts::*, arvo_refit::*, arvo_hash::*, arvo_sparse::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-graph depends on arvo-storage + arvo-bits-contracts + arvo-numeric-contracts + arvo-tensor + arvo-bitmask only" },
  { scope = "arvo-sparse", forbidden = "std::*, alloc::*, arvo::*, arvo_mask_contracts::*, arvo_refit::*, arvo_hash::*, arvo_graph::*, arvo_comb::*, arvo_spectral::*", reason = "arvo-sparse depends on arvo-storage + arvo-bits-contracts + arvo-numeric-contracts + arvo-tensor + arvo-bitmask only" },
  { scope = "arvo-comb", forbidden = "std::*, alloc::*, arvo::*, arvo_mask_contracts::*, arvo_refit::*, arvo_hash::*, arvo_graph::*, arvo_sparse::*, arvo_spectral::*", reason = "arvo-comb depends on arvo-storage + arvo-bits-contracts + arvo-numeric-contracts + arvo-tensor + arvo-bitmask only" },

  # L3 — arvo-spectral depends on the contract stack + arvo-tensor + arvo-bitmask + arvo-sparse.
  { scope = "arvo-spectral", forbidden = "std::*, alloc::*, arvo::*, arvo_mask_contracts::*, arvo_refit::*, arvo_hash::*, arvo_graph::*, arvo_comb::*", reason = "arvo-spectral depends on arvo-storage + arvo-bits-contracts + arvo-numeric-contracts + arvo-tensor + arvo-bitmask + arvo-sparse only" },

  # Universal — no ad-hoc threading, clocks, filesystem anywhere.
  { scope = "*", forbidden = "std::thread::*, std::time::*, std::fs::*, std::net::*, std::process::*, std::io::*", reason = "arvo has zero platform dep; syscalls belong in consumer crates" },
]

